# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["source"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  actions: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    if: github.repository == 'snapcoalition/SNAPscipolorg.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the stance_last_updated plugin can read per-file
          # last-commit dates via `git log`.
          fetch-depth: 0
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.4' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          # The stance validator writes its full grouped report here when it
          # fails, so notify-on-failure can quote it verbatim in the issue.
          STANCE_VALIDATION_REPORT: stance-validation-report.txt
      - name: Upload validation report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stance-validation-report
          path: stance-validation-report.txt
          # Absent for failures the validator wasn't responsible for (Liquid
          # errors, gem issues); the notify job falls back to the log excerpt.
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    if: github.repository == 'snapcoalition/SNAPscipolorg.github.io'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-on-failure:
    if: ${{ failure() && github.repository == 'snapcoalition/SNAPscipolorg.github.io' }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      # Present only when the stance validator was what failed the build. The
      # step is allowed to fail so that every other kind of build failure still
      # falls through to the log-scraping path below.
      - name: Download validation report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: stance-validation-report

      - name: Fetch failed-step logs and extract error excerpt
        id: excerpt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e

          # Preferred path: the validator already wrote a formatted report, so
          # quote it directly rather than digging it back out of the log.
          if [ -s stance-validation-report.txt ]; then
            head -c 60000 stance-validation-report.txt > excerpt.txt
            echo 'heading=Validation report' >> "$GITHUB_OUTPUT"
            echo 'note=Produced by `_plugins/stance_tag_validator.rb`. Entry numbers are 0-based positions in the YAML list. See the full log via the Run link above.' >> "$GITHUB_OUTPUT"
            {
              echo 'excerpt<<__EOF__'
              cat excerpt.txt
              echo
              echo '__EOF__'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'heading=Error excerpt' >> "$GITHUB_OUTPUT"
          echo 'note=Shows everything after the most recent `Generating...` marker in the failed step'"'"'s output (capped at 12 KB). See the full log via the Run link above.' >> "$GITHUB_OUTPUT"

          # The whole-run log archive (gh run view --log-failed) isn't ready
          # while this job is still running, so fetch the failed job's logs
          # directly instead.
          JOB_ID=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/jobs" \
            --paginate --jq '.jobs[] | select(.conclusion=="failure") | .id' | head -n1)

          if [ -n "$JOB_ID" ]; then
            gh api "repos/$GH_REPO/actions/jobs/$JOB_ID/logs" > full.log 2>/dev/null
          else
            : > full.log
          fi

          # Strip ANSI escape sequences (Jekyll colorizes its error output),
          # then strip everything up to and including the ISO-8601 timestamp on
          # each line, leaving just the message. This is layout-agnostic: it
          # works whether or not the line is prefixed with job/step tab columns.
          sed -E \
            -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' \
            -e 's/.*[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z[[:space:]]*//' \
            full.log > clean.log

          # Take everything after the last "Generating..." marker.
          START=$(grep -n 'Generating\.\.\.' clean.log | tail -n1 | cut -d: -f1)
          if [ -z "$START" ]; then
            tail -n 150 clean.log > excerpt.txt
          else
            tail -n +"$((START + 1))" clean.log > excerpt.txt
          fi
          head -c 12000 excerpt.txt > excerpt.trimmed.txt
          mv excerpt.trimmed.txt excerpt.txt

          {
            echo 'excerpt<<__EOF__'
            cat excerpt.txt
            echo
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Open issue on deploy failure
        uses: dacbd/create-issue-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Pages deploy failed on ${{ github.ref_name }} (${{ github.sha }})"
          labels: deploy-failure
          body: |
            The **Deploy Jekyll site to Pages** workflow failed.

            - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Commit:** ${{ github.sha }}
            - **Triggered by:** @${{ github.actor }}
            - **Branch:** ${{ github.ref_name }}
            - **Event:** ${{ github.event_name }}

            ### ${{ steps.excerpt.outputs.heading }}

            ```
            ${{ steps.excerpt.outputs.excerpt }}
            ```

            _${{ steps.excerpt.outputs.note }}_
