# Master filter configuration for the Stance on Science search and per-state
# pages. Update this file to add new tags, races, or parties. All Stance pages
# read from this file. (Districts are free-form strings on each response and are
# not enumerated here.)

tags:
  - Agriculture
  - Artificial Intelligence
  - Climate
  - Energy
  - Environment
  - Investment in Higher Education
  - Jobs and Workforce
  - K-12 Science Education
  - Policymaking Process
  - Public Health
  - Science Diplomacy
  - Science Funding
  - Social Media
  - Transportation
  - Trust in Science

# alphabetical order for the Race picklists
races:
  - Attorney General
  - Governor
  - Lieutenant Governor
  - Local County Races [All]
  - Mayor
  - Nebraska Public Power District  # for NE
  - RTD Board of Directors  # for CO
  - School Board
  - Secretary of State
  - State Assembly
  - State Auditor
  - State Board of Education
  - State Superintendent of Education
  - State House of Delegates
  - State House of Representatives
  - State Legislature  # necesary for NE, the only state with a unicameral legislature
  - State Senate
  - State Supreme Court
  - State Treasurer
  - University Board of Regents
  - US House of Representatives
  - US House of Representatives Non-Voting Delegate  # for DC
  - US Senate

# ballot order for grouping candidates in the "Group by candidate" view
# must contain exactly the entries in `races` above — the build fails if the two lists disagree
race_ballot_order:
  - US Senate
  - US House of Representatives
  - US House of Representatives Non-Voting Delegate
  - Governor
  - Lieutenant Governor
  - Attorney General
  - Secretary of State
  - State Treasurer
  - State Auditor
  - State Senate
  - State Supreme Court
  - State Assembly
  - State Legislature
  - State House of Delegates
  - State House of Representatives
  - State Board of Education
  - State Superintendent of Education
  - University Board of Regents
  - Mayor
  - School Board
  - Local County Races [All]
  - Nebraska Public Power District
  - RTD Board of Directors

# Per-state additions to `races` above, valid only for the `races:` attribute
# on questions in _data/stance_questions/<state>.yml (scoping a question to a
# specific district, e.g. a congressional seat). Does NOT apply to the
# candidate `race` field in stance_responses or to race_ballot_order — those
# still require a canonical race from the list above. Keyed by state slug.
race_overrides:
  va:
    - VA-1
    - VA-2
    - VA-3
    - VA-5
    - VA-7
    - VA-8
    - VA-9
    - VA-11

