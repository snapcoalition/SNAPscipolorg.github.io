  date: 2026-08-11 # optional
  primary_candidate: true # optional, default false; true = ran in the primary but did not advance. Must be the same on every row for a given candidate
  response: |
    I favor strong, citizen-driven, not industry-driven, guardrails. This month, five incidents of AI autonomously breaking out of security tests came to light. AI may be outstripping our ability to create strong parameters for its development. On Data Centers, we risk massive energy rate increases while facing energy shortfalls this Winter, according to Enstar. Our statewide laws governing AI and Data Centers must protect the public from unintended consequences. 
 
    We can’t just trust whoever writes the post-election rules. We need standards now: Every data center should require a grid impact assessment through the Department of Energy. I plan to establish a statewide land use review modeled on Anchorage's with dedicated, proactive zoning, conditional use review, siting limits, and proof of water and utility capacity. On state land outside organized boroughs, like the hyperscale project near the Dalton Highway, this standard would apply through DNR's leasing process. No lower bar because of location or backers. Operators pay Alaska's corporate tax rate and meet the same labor standards as any major build. SB 250 got the utility piece and died in the House. I'll build on that proposal.

    KEYWORDS: safety, ratepayers, accountability

- candidate_first_name: Tom # this is Bryce's cat. titles and middle names go here
