  response: |
    The Departments that make up DHSS exist so that no Alaskan goes without care because of where they live. That's the whole purpose. In 2022, Governor Dunleavy split DHSS into the Department of Health and the Department of Family and Community Services. My standard for each is the same: does it make it easier or harder for a family in Bethel or Fairbanks to actually get help, whether that's Medicaid, behavioral health, the Pioneer Homes, or the Office of Children's Services.
 
    When I appoint commissioners for these departments, I'll be looking for people who have done the work, not political loyalists: nurses, behavioral health providers, tribal health administrators, people who understand rural access because they've lived it, not studied it from Juneau. A governor who is surrounded by those who only think like him is a governor who stops learning, and nowhere is that more dangerous than in health policy.
    
    I want commissioners who will tell me when a policy isn't working for the communities it's supposed to serve, who bring the judgment to fix it, not just administer it, and who have the foresight to move Alaska forward with new ideas and innovation. 

    KEYWORDS: accountability, access, experience

- candidate_first_name: Meda # this is Bryce's cat. titles and middle names go here
  candidate_last_name: DeWitt # used for alphabetical sorting
  state: ak
  race: Governor # must match one of the options!
  party: No Party Preference # must match one of the options!
  question: ak-q1
  date: 2026-08-14 # optional
  primary_candidate: true # optional, default false; true = ran in the primary but did not advance. Must be the same on every row for a given candidate
  response: |
    Alaska is leaving the Industrial Era and entering the Technological Era, and we intend to lead it on our terms. Our platform includes a comprehensive AI and data governance policy: an Alaska Data Governance Office, an Alaska Personal Data Protection Act, and a Likeness, Voice, and Identity Rights Act establishing identity as personal property, modeled on Tennessee's ELVIS Act. We will apply an "Alaska Standard" to data centers: bring-your-own-power additionality, permit-condition caps on electricity and water use, zero-discharge water standards, heat reuse, free, prior, and informed consent, decommissioning bonds, and continuous public monitoring. We favor a decentralized nodal model of micro-to-medium facilities on microgrids, 80 percent or more renewable, with Alaska Native Corporation co-ownership, and state data stored in Alaska within five years. Our evidence base includes the international CARE Principles for Indigenous Data Governance, national research on data center water and electricity consumption and ratepayer cost-shifting, Alaska energy analyses from UAF's Alaska Center for Energy and Power, and my own doctoral research pairing Traditional Ecological Knowledge with Western technological systems. AI should serve Alaskans: counting fish, tracking wildfire, and monitoring permafrost.

    KEYWORDS: Technological Era, Alaska Data Governance Office, Alaska Personal Data Protection Act, Likeness, Voice, and Identity Rights Act, Alaska Standard, bring-your-own-power additionality, permit-condition caps, zero-discharge water standards, heat reuse, free, prior, and informed consent, decommissioning bonds, decentralized microgrids, ANC co-ownership, state data stored in Alaska, CARE Principles, Traditional Ecological Knowledge, ratepayer cost-shifting, AI serving Alaskans

- candidate_first_name: Meda # this is Bryce's cat. titles and middle names go here
  candidate_last_name: DeWitt # used for alphabetical sorting
