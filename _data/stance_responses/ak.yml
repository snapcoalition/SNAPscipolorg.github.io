    I believe Alaska’s coastal resources belong to the people and must be responsibly managed to protect our environment, economy, and future generations.

    My 25-Year Plan emphasizes long-term sustainability rather than short-term decisions. We must continue investing in scientific research, habitat restoration, water quality monitoring, and responsible fisheries management to protect our marine ecosystems.

    I support science-based fishing regulations that balance commercial, recreational, and subsistence fishing while protecting fish populations for future generations. Local fishermen, Alaska Native communities, scientists, and coastal residents must have meaningful participation in decisions affecting their livelihoods.

    I also believe industries operating along our coastlines, including oil, gas, mining, and shipping, must be held accountable for environmental protection and restoration. Economic development should never come at the expense of permanently damaging resources that Alaskans depend upon.

    We must strengthen partnerships with the University of Alaska, fishing organizations, and coastal communities to monitor changing ocean conditions and develop long-term solutions.

    Protecting Alaska’s coastal resources is not just an environmental responsibility. It is an investment in jobs, food security, cultural traditions, and the economic future of our children and grandchildren.

    KEYWORDS: Sustainability, Conservation, Future Generations

