  response: |
    While I recognize that artificial intelligence is a growing industry nationwide, my priority is protecting Alaska's resources and residents. Under my administration, Alaska will not host AI data centers. These facilities demand massive amounts of electricity and water—resources that we must carefully manage and prioritize for our communities and existing industries, not for the immense utility draw of data infrastructure. However, this does not mean we will ignore the technology itself. We will adopt a cautious, measured approach to using AI in state operations and services, ensuring that any implementation strictly prioritizes data security, educational integrity, and tangible benefits for Alaskans. By maintaining a firm boundary against resource-draining data centers while carefully evaluating practical AI software applications, we can protect our state's infrastructure while remaining adaptable to technological advancements.

    KEYWORDS: Resource Protection, Caution, Security

