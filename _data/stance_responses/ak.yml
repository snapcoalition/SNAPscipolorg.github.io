    The purpose of the Department of Health is simple: keep Alaskans alive, well, and thriving, from prenatal care to Elder care. That means prevention first, because every dollar spent upstream saves lives and money downstream; it means healthcare access in all 200-plus communities, not just on the road system; and it means a department that works with Tribal health organizations as full partners, honoring the Alaska Tribal Health System as a national model. The department must deliver on Medicaid without backlogs, protect children through a child welfare system that honors ICWA, respond to our behavioral health and overdose crises with real treatment capacity, and integrate culturally grounded care, including reimbursement for traditional healers. My appointment criteria: proven operational competence, because Alaskans have waited too long behind broken systems; lived experience of rural and Alaska Native healthcare realities; commitment to data transparency and measurable outcomes; the humility to consult Tribes, providers, and communities before deciding; and the backbone to defend public health science. I have served as an ICWA Qualified Expert Witness and a traditional healer, and I will appoint leaders who see both the spreadsheet and the human being. Health is our first infrastructure and key to homeland security.

