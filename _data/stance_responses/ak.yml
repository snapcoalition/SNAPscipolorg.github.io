  response: |
    Alaska burns natural gas for 40 percent of our power and uses hydro for another 29 percent, while wind sits at 2 percent and solar barely registers. That is not an energy strategy. That is inertia.
 
    Alternative and renewable energy must be central to Alaska's future, and will be in my Administration. We have world-class wind in coastal and western Alaska, enormous untapped geothermal resources near Unalaska and the Aleutians, and a hydro asset at Bradley Lake that is chronically under-dispatched because our transmission can't move the power where it's needed. Families in over 200 rural communities pay fifty cents to a dollar per kilowatt hour for diesel. That ends when we build local generation they own.
    
    As Governor, I will create an Alaska Department of Energy to end the fragmented, utility-by-utility governance that keeps costs high. I'll expand the Renewable Energy Fund, invest in grid-scale storage so intermittent renewables become reliable, and modernize the Railbelt intertie so cheap power actually reaches people. Every project comes with prevailing wages, apprenticeship utilization, and Project Labor Agreements, because the transition to clean, affordable energy should build Alaska's union workforce, not bypass it.

    KEYWORDS: diversification, affordability, storage

- candidate_first_name: Tom # this is Bryce's cat. titles and middle names go here
  candidate_last_name: Begich # used for alphabetical sorting
