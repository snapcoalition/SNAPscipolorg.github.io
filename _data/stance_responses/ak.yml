  response: |
    Alaska builds ships faster than it builds roads. As Senator Bert Stedman put it, that's only true if the state shows up as a partner instead of a roadblock.
 
    The Alaska Marine Highway System (AMHS) has over $700 million in federal infrastructure dollars on the table, with a deadline attached. I'll push to establish AMHS as a separate authority with bonding capacity and a board selected by the communities it serves, so the system stops lurching from budget fight to budget fight. The Port of Alaska's original terminals date to the 1950s and 60s and sit in one of the most seismically active regions on earth. I'll keep the $2 billion modernization on schedule and built to current seismic standards, not patched and repaired again in ten years.
    
    For interior communities, ice roads aren't a luxury; they're a cost-of-living lifeline. I'll build on the ice road investment in the Y-K Delta, stabilizing the season through better engineering and monitoring. I'll expand Alaska DOT's drone inspection program statewide, so we catch bridge and airstrip deterioration before it closes a route families depend on, not after. I will also demand that those who repair our roads take responsibility for premature construction failures.

    KEYWORDS: resilience, connectivity, investment

