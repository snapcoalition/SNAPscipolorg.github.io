  response: |
    I support data center development in Alaska on one condition: the project brings its own generation and pays the full cost of interconnection. A facility that builds new capacity adds jobs and tax base. One that plugs into an existing grid with thin reserve margins transfers cost onto every other ratepayer, and in the Interior those ratepayers already pay among the highest electricity prices in the country.

    Siting should remain a local decision through zoning and platting. The people who live next to the water draw and the substation should make that call, not Juneau.

    Before approval, I want disclosed load, disclosed water use, and a firm interconnection agreement — not projections offered during a permitting hearing.

    The evidence that informs this is Railbelt resource adequacy analysis and utility filings before the Regulatory Commission of Alaska. Our regional grid has operated close to its margins in winter. Adding large, constant, inflexible load to a system in that condition is an engineering question before it is an economic development question.

    On AI in education and ownership of training data, I hold no settled position yet. The law is moving faster than the evidence, and I would rather say so.

    KEYWORDS: interconnection costs, grid reliability, local control

