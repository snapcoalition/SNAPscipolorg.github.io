  response: |
    Alternative energy is central to Alaska's future, and Alaska holds world-class wind, solar, geothermal, hydro, and tidal resources alongside our oil and gas. Alaskans pay some of the highest energy costs in the nation, and diversification is how we bring those costs down while keeping wealth in our communities. We support a decentralized-first energy strategy: community-scale renewables on microgrids, built and owned locally, including Alaska Native Corporation and Tribal co-ownership, so rural Alaska stops exporting its energy dollars. We will address the Cook Inlet gas shortfall honestly; we oppose the Alaska LNG project as currently structured and support near-term solutions like Nikiski import conversion while we build renewable capacity. We support state investment in energy research through the University of Alaska, including the Alaska Center for Energy and Power, and streamlined permitting for renewable projects that meet strong environmental and consent standards, including free, prior, and informed consent for projects on or affecting Indigenous lands. New load growth, including data infrastructure, must bring its own power with additionality requirements so ratepayers never subsidize industrial demand. Energy independence for every Alaska community is the goal, and renewables are how we get there.

    KEYWORDS: Alternative energy, wind, solar, geothermal, hydro, tidal, energy costs, diversification, decentralized-first, community-scale renewables, microgrids, local ownership, ANC and Tribal co-ownership, Cook Inlet gas shortfall, Alaska LNG opposition, Nikiski import conversion, Alaska Center for Energy and Power, energy research, renewable permitting, free, prior, and informed consent, bring-your-own-power additionality, ratepayer protection, energy independence

