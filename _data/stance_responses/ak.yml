- candidate_first_name: James
  candidate_last_name: William Parkin IV
  state: ak
  race: Governor
  party: Republican
  question: ak-q1
  date: 2026-07-24
  primary_candidate: false
  response: |
    While I recognize that artificial intelligence is a growing industry nationwide, my priority is protecting Alaska's resources and residents. Under my administration, Alaska will not host AI data centers. These facilities demand massive amounts of electricity and water—resources that we must carefully manage and prioritize for our communities and existing industries, not for the immense utility draw of data infrastructure. However, this does not mean we will ignore the technology itself. We will adopt a cautious, measured approach to using AI in state operations and services, ensuring that any implementation strictly prioritizes data security, educational integrity, and tangible benefits for Alaskans. By maintaining a firm boundary against resource-draining data centers while carefully evaluating practical AI software applications, we can protect our state's infrastructure while remaining adaptable to technological advancements.

    KEYWORDS: Resource Protection, Caution, Security

- candidate_first_name: James
  candidate_last_name: William Parkin IV
  state: ak
  race: Governor
  party: Republican
  question: ak-q2
  date: 2026-07-24
  primary_candidate: false
  response: |
    The preservation of our wild fish stocks and marine biology is foundational to Alaska's culture and economy, yet I am deeply concerned that financial interests are currently corrupting scientific research and resource management. We are witnessing critically low numbers of king salmon, while multi-billion-dollar commercial trawlers generate unacceptably high levels of bycatch. Millions of pounds of dead fish are wasted annually, but because large areas are under federal control—and because of the immense money involved—government agencies lack the political will to intervene. Furthermore, there is a troubling reluctance among scientists to report the true negative impacts of these practices. We must end this corruption. My policy is to fight aggressively for state influence over federal waters to strictly regulate bycatch and hold this industry accountable. Management must be driven by independent science, not by corporate profits.

    KEYWORDS: Accountability, Bycatch, Integrity

- candidate_first_name: James
  candidate_last_name: William Parkin IV
  state: ak
  race: Governor
  party: Republican
  question: ak-q3
  date: 2026-07-24
  primary_candidate: false
  response: |
    Alaska has always been an energy powerhouse, but as we look to the future and our high per-capita energy consumption, we must diversify responsibly. My administration will prioritize moving Alaska toward hydrogen and hydroelectric power as our primary alternative energy sources. Hydroelectric power is a proven, reliable source of baseline energy that makes sense for our geography and water resources. Pairing it with emerging hydrogen technology provides a powerful path to clean, sustainable energy storage and deployment. These technologies offer a robust alternative to our reliance on fossil fuels without sacrificing grid stability. We will support policies, regulatory frameworks, and research initiatives that incentivize the development of hydrogen-hydroelectric infrastructure, ensuring Alaska remains an energy leader while securing long-term, affordable, and sustainable power for our communities.

    KEYWORDS: Hydroelectric, Hydrogen, Diversification
    
- candidate_first_name: James
  candidate_last_name: William Parkin IV
