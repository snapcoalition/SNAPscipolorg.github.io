    For too long, government has relied on short-term budgeting while roads, bridges, ports, airports, and other essential infrastructure continue to age. We must move toward predictable, long-term funding that addresses maintenance before small problems become expensive emergencies.

    My plan supports improving highways, expanding transportation connections where economically feasible, modernizing ports, and maintaining reliable air transportation for rural communities. Alaska’s transportation system must serve everyone, including communities without road access.

    I support strengthening partnerships with the University of Alaska to research cold-weather construction, permafrost deterioration, erosion, and innovative technologies that extend infrastructure life while reducing maintenance costs.

