  response: |
    The preservation of our wild fish stocks and marine biology is foundational to Alaska's culture and economy, yet I am deeply concerned that financial interests are currently corrupting scientific research and resource management. We are witnessing critically low numbers of king salmon, while multi-billion-dollar commercial trawlers generate unacceptably high levels of bycatch. Millions of pounds of dead fish are wasted annually, but because large areas are under federal control—and because of the immense money involved—government agencies lack the political will to intervene. Furthermore, there is a troubling reluctance among scientists to report the true negative impacts of these practices. We must end this corruption. My policy is to fight aggressively for state influence over federal waters to strictly regulate bycatch and hold this industry accountable. Management must be driven by independent science, not by corporate profits.

    KEYWORDS: Accountability, Bycatch, Integrity

