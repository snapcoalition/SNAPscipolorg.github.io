    Scientists who apply the scientific methods in totality are honorable and trustworthy. Those who proclaim pre-determined ideology through the disguise of science are to be challenged, defunded, and shamed for making a mockery of true science-minded people seeking truth.

    Decades ago I was on a flight which the person I was sitting beside was traveling around the U.S. getting signatures and commitment by presidents and chancellors of major universities to promote "hands on science" in the classroom. The concern was that we are loosing U.S. scientists because our educational system is make the learning process stagnant and only conceptual via text books rather "alive and experiential" through hands on learning. I advocate for making science come alive, remove those stagnant learning barriers, partner with our scientific business and industry and promote new scientists and the next level of "what if."

    KEYWORDS: INTEGRITY, OBJECTIVITY, AND CRITICISM
