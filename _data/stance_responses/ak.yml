    The Department of Health and Human Services exists to protect and improve the physical, mental, and social well-being of all Alaskans, ensuring our most vulnerable populations have access to the care and support they need. It is a critical agency that requires leadership grounded in both rigorous expertise and profound empathy. When considering an appointee to lead this department, my criteria are strict: the commissioner must possess an extensive background in science and medical knowledge, paired with strong, demonstrated humanitarian experience. We do not need a political operative or a pure administrator; we need a qualified health professional who understands the science behind public health policy and has a proven track record of fighting for people's well-being. This ensures that our health policies are both medically sound and deeply compassionate.

    KEYWORDS: Science, Humanitarianism, Experience

