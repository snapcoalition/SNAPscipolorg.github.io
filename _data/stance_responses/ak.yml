  response: |
    Alaska's coastal waters feed our families, anchor our economies, and carry our cultures, and our management must keep pace with a changing ocean. Our Fish First framework puts salmon, subsistence, and coastal communities at the center of state policy. We will strengthen Alaska's voice at the North Pacific Fishery Management Council to address trawl bycatch with accountability, full observer coverage, and enforceable caps, and we will respond to Gulf of Alaska Chinook declines with science-driven action that protects both stocks and fishing families. We support Tribal co-management as a cornerstone of coastal stewardship: the Indigenous peoples who have managed these waters for millennia hold knowledge our fisheries need, and Traditional Ecological Knowledge will stand alongside Western science in state decision-making. We will invest in the research and monitoring that made Alaska's fisheries a global model, expand ocean acidification and warming surveillance, and support climate resilience planning for coastal communities facing erosion and relocation. We will grow mariculture and value-added seafood processing so more of every fish caught in Alaska builds wealth in Alaska. Healthy oceans support commercial harvests, sport fishing, tourism, and culture together, and we will manage for all of them.

    KEYWORDS: Fish First, salmon, subsistence, coastal communities, North Pacific Fishery Management Council, trawl bycatch, observer coverage, enforceable caps, Gulf of Alaska Chinook, Tribal co-management, Traditional Ecological Knowledge, research and monitoring, ocean acidification, climate resilience, erosion and relocation, mariculture, value-added seafood, commercial harvests, sport fishing, tourism, culture

