    I support artificial intelligence, what I prefer to call Augmented Intelligence, as a tool to strengthen human judgment, productivity, education, national security, and economic growth. America must lead this technology race and outpace China, while protecting privacy, cybersecurity, intellectual property, and human accountability.

    I support responsible data-center development, including opportunities in Alaska, but not at the expense of residential ratepayers or local resources. Large projects should demonstrate reliable power supply, pay the infrastructure costs they create, disclose expected electricity and water use, protect land and communities, and produce measurable economic benefits such as jobs, investment, and tax revenue. I also support examining whether Alaska’s climate, energy resources, and strategic location can make us competitive for carefully planned facilities.

    My position is evidence-driven and will continue developing as technology evolves. DOE/Lawrence Berkeley research projects data centers could consume 6.7%–12% of U.S. electricity by 2028. NIST emphasizes innovation with security and accountability, while Stanford’s 2026 AI Index reports the U.S.–China AI performance gap has effectively closed.

    KEYWORDS: Augmented Intelligence, American Innovation, Global Competitiveness, Outpace China, National Security, Technological Leadership, Human Oversight, Economic Growth, Workforce Development, Education, Data Privacy, Intellectual Property Protection

