    PAUL FOR ALASKA | POLICY POSITION — TRANSPORTATION
    
    I support an Alaska-first transportation strategy that prioritizes public safety, economic development, national security, and fiscal accountability. Alaska's vast geography demands dependable highways, bridges, ports, railroads, airports, and marine transportation systems.
    
    My highest priority is modernizing Anchorage's Don Young Port of Alaska, a critical lifeline for statewide commerce, fuel, food, and essential supplies. I support seismic resilience, infrastructure replacement, transparent project accounting, and strict oversight to prevent unnecessary cost overruns and increased consumer costs.
    
    I also support developing Port MacKenzie as a complementary commercial and industrial transportation hub, including completing its rail connection where justified by demonstrated economic benefits. Both ports should serve distinct but coordinated purposes, strengthening Alaska's supply chains, resource development, and economic competitiveness.
    
    Rural Alaska also deserves practical transportation improvements, including aviation infrastructure, marine transportation, and strategic road connections that reduce isolation and the cost of living.
    
    I support modern engineering, preventive maintenance, innovative inspection technologies, and responsible public-private partnerships.
    My guiding principle: Maintain what we have, complete economically justified projects, connect Alaska's communities, and demand accountability for every public dollar invested.

    KEYWORDS: Alaska First, Infrastructure Modernization, Port of Alaska, Port MacKenzie Development, Rail Expansion, Highway Improvements, Rural Transportation Access,  Marine Highway System, Aviation Infrastructure, Seismic Resilience, National Security, Supply Chain Reliability, Economic Development, Preventive Maintenance,Public Safety, Strategic Transportation Planning, Freight Efficiency, Resource Development, Public-Private Partnerships, Government Accountability, Project Oversight, Federal Transportation Funding, Alaska Connectivity

