  response: |
    Fish come first. Without sustainable runs, there is no lasting commercial, sport, or subsistence fishery, and no economy built on one.
 
    I'll direct the state to take firm, coordinated positions at the North Pacific Fishery Management Council, prioritizing sustainability and Alaskan access, not showing up as a passive participant. That means real investment in stock assessment and monitoring, especially for declining Chinook systems, and enforcement of the bottom trawling ban we already have on the books – it’s not optional.
    
    Coastal management is bigger than fish alone. European green crab have reached Metlakatla, ground zero for an invasive species threat that Southeast communities are fighting with too little state support. I'll fund mitigation before it spreads further. I'll back the Alaska Ocean Observing System and Alaska Sea Grant's work tracking ocean acidification and harmful algal blooms, because subsistence and commercial harvesters need that data now, not after a crisis. And I'll grow mariculture, shellfish and kelp farming that diversifies coastal economies without competing against wild stocks. I will also seek to reestablish our Coastal Zone Management program. 
    
    Tourism has to fit the place, not overwhelm it. Growth should strengthen communities, not strain housing and services past what residents chose.

    KEYWORDS: sustainability, monitoring, coexistence

- candidate_first_name: Tom # this is Bryce's cat. titles and middle names go here
  candidate_last_name: Begich # used for alphabetical sorting
