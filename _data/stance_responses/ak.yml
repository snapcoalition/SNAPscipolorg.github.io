    I believe Alaska’s energy future must focus on affordability, reliability, and long-term sustainability. My 25-Year Plan supports developing our traditional energy resources while expanding geothermal, hydroelectric, solar, wind, and energy storage technologies.

    I am particularly interested in geothermal energy for residential neighborhoods. Imagine 50 homes sharing a geothermal heating system, reducing dependence on expensive heating fuels. I support exploring property tax incentives for homeowners who invest in energy-efficient improvements, including geothermal systems.

    Alaska’s rural communities face some of the nation’s highest energy costs. We must invest in locally appropriate renewable energy projects, battery storage, and modern infrastructure to reduce those expenses.

    I support increased University of Alaska research into cold-climate energy technologies, geothermal feasibility, and energy efficiency. We should encourage public-private partnerships while requiring transparency, environmental responsibility, and measurable benefits for Alaskans.

    I also believe large industrial energy users, including data centers, must contribute fairly toward infrastructure costs rather than shifting expenses onto families.

    Our goal should not be choosing between traditional and alternative energy. It should be building an affordable, diversified energy system that serves Alaskans for the next 25 years and beyond.

    KEYWORDS: Affordability, Energy Independence, Sustainability

