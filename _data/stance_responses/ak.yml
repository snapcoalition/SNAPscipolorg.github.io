    I support the responsible conservation, development, and sustainable use of Alaska’s coastal resources for the maximum benefit of Alaskans. Our fisheries, marine ecosystems, and coastal communities are vital to Alaska’s economy, food security, cultural heritage, and future generations.
    
    My policy is Alaska First: Conservation through responsible management, not unnecessary government regulation.
    
    I support science-based fisheries management, continued research and monitoring, protection of fish habitats, responsible harvest levels, and stronger measures to reduce wasteful bycatch. Commercial, sport, personal-use, and subsistence fisheries must be managed fairly, recognizing their economic and cultural importance.
    
    I believe coastal communities, fishermen, Alaska Native organizations, scientists, and industry stakeholders deserve a meaningful voice in resource management decisions. Federal involvement should respect Alaska’s expertise, economic interests, and management authority.
    
    I also support responsible coastal infrastructure, seafood processing, tourism, and maritime development that create Alaska jobs without compromising long-term sustainability.
    Protect our resources, preserve access, strengthen Alaska’s economy, and ensure Alaskans, not distant bureaucracies, have a strong voice in determining our future.

    KEYWORDS: Alaska First, Responsible Conservation, Sustainable Resource Management, Environmental Stewardship,  Coastal Resource Protection,Fisheries Sustainability, Habitat Preservation, Bycatch Reduction, Commercial Fishing, Subsistence Rights, Recreational Fishing, Economic Development • Food Security, Local Control, Alaska Native Participation, Balanced Regulation, Resource Development, Scientific Research, Environmental Accountability, Private-Sector Partnerships, State Sovereignty, Fiscal Responsibility

