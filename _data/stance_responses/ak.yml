  response: |
    My standard is cost and reliability first, with environmental safeguards, and I evaluate projects rather than categories.

    For Interior baseload, firm natural gas is the answer. I testified on HB 381 and SB 280 and built the revenue modeling behind that testimony, because getting gas up the Intertie is the single largest available lever on what Interior households pay to heat and power a home.

    Alternative sources have a real place where the engineering supports it. Battery storage is already improving Railbelt reliability. Hydropower is proven here. Geothermal has genuine potential at Interior sites. Solar is a seasonal supplement in a place where demand peaks in December darkness, and saying so is not hostility, it is latitude.

    I support the Renewable Energy Fund evaluated project by project, and I will not promise a fixed annual appropriation. What I will commit to is process discipline, because stranding a funded project midstream wastes more money than never starting it.

    I support the micro-reactor at Eielson Air Force Base, subject to environmental review. Small modular reactors suit a cold, isolated grid.

    Transmission belongs in the same capital tier as roads and ports, funded to build and funded to maintain.

    KEYWORDS: firm baseload, project-by-project evaluation, transmission investment

