    I strongly support developing Alaska’s abundant oil and natural gas resources as the foundation of our energy security, economic growth, and affordable electricity. However, I recognize that alternative energy sources can play a valuable supporting role, particularly in rural Alaska, where diesel-generated electricity and fuel transportation costs are exceptionally high.
    
    I support an Alaska-first, diversified energy strategy driven by affordability, reliability, and demonstrated economic benefits, not political mandates or costly experimentation.
    Hydropower, geothermal, wind, solar, and emerging energy technologies deserve consideration where geographic conditions and proven cost-benefit analyses justify investment. Rural communities may especially benefit from locally produced energy that reduces dependence on expensive imported diesel.
    
    I support limited, accountable research, private-sector investment, public-private partnerships, and competitive grants for projects demonstrating measurable long-term savings.
    However, I oppose excessive government subsidies, wasteful spending, and regulations that undermine traditional energy production or increase utility costs for Alaskans.
    
    My guiding principle is straightforward: Develop Alaska's resources first, embrace innovation where economically justified, and never sacrifice reliable, affordable energy for political agendas.

    KEYWORDS: Lowers costs, not subsidizing it simply because it is renewable.

