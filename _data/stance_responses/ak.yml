  response: |
    "Alaska's constitution requires management on the sustained yield principle, and that standard has largely worked. I would keep management with the state wherever federal authority allows it, because the people who depend on a resource govern it better than an agency two thousand miles away.

    Where the system is weakest is measurement. We manage salmon with decades of escapement data and we manage trawl bycatch with partial observer coverage, which produces numbers that get argued about for years instead of acted on. I support full observer and electronic monitoring coverage of the trawl fleet, hard bycatch caps on chinook and chum that are not adjusted upward as the fleet approaches them, and accountability assessed by vessel rather than by fleet.

    On intercept fisheries such as Area M, I support restrictions based on what the science says about which stocks are being taken and where they were bound, rather than restrictions based on which region carries the most political weight. That standard cuts in directions both sides dislike, which is usually a sign it is the right one.

    Alaska's seats on the North Pacific Fishery Management Council should be held by people accountable to Alaskans who fish.

    KEYWORDS: sustained yield, bycatch monitoring, state management

