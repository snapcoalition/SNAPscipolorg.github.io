    I believe artificial intelligence can improve education, healthcare, government efficiency, and economic development. However, technological advancement must benefit working families, not come at their expense.

    My 25-Year Plan proposes an automation tax on businesses that replace workers with AI or automation. Revenue would be divided equally between protecting Alaska’s Permanent Fund Dividend and supporting essential government services. We must also invest in workforce retraining and education to prepare Alaskans for changing job opportunities.

    I support responsible data center development, but corporations must pay their fair share of infrastructure, electricity, and water costs. Alaska families should never face higher utility bills to subsidize corporate profits. Environmental protections, cybersecurity, data privacy, and transparency must be priorities.

    My position is informed by research into automation’s effects on employment, the growing energy demands of data centers, and the importance of long-term economic planning. Reports from the U.S. Department of Energy, International Energy Agency, and research on workforce automation provide important evidence.

    Innovation should strengthen our economy while protecting workers, consumers, and future generations.

    KEYWORDS: Accountability, Innovation, Worker Protection

