    Alaska's vast, rugged terrain and harsh weather require both resilience and innovation. While we will continue to support and maintain our current transportation infrastructure like ports and highways, we must integrate helium airships into our logistics network. Modern cargo airships are environmentally friendly, carry heavy payloads, and require minimal infrastructure—needing no roads or landing fields to operate. They have multiple applications for Alaska, from delivering freight and medical supplies to interior communities to supporting remote resource development. Furthermore, I propose establishing a state airship construction company, which would bring a new high-tech manufacturing sector to Alaska and create excellent jobs. By blending the maintenance of our existing systems with the cutting-edge capability of helium airships, we can finally solve the unique access challenges facing our remote communities.

    KEYWORDS: Airships, Connectivity, Innovation

