  response: |
    I hold an FAA System Planning Certification, and I have spent years in the public comment record on Interior transportation projects. I authored the technical white paper opposing the proposed Nordale and Peede Road roundabout, and I have worked through the Greater Fairbanks Chamber on NEPA permitting burdens affecting hangar construction at Fairbanks International Airport.

    My central position is that Alaska has a maintenance problem disguised as a capital problem. We are good at building things and poor at budgeting to keep them. Our ports are the clearest case: they age, the repair is deferred because deferral is invisible in a single budget cycle, and the eventual bill is larger than the maintenance would have been. I want lifecycle maintenance costed at the front end of every project, before approval, not treated as a future legislature's problem.

    Second, design to the actual conditions. Cold-weather engineering, permafrost degradation under existing roadbeds, and seismic resilience are site-specific questions that deserve site-specific evidence rather than standards imported from the Lower 48.

    Third, Interior connectivity is an economic question. Communities off the road and rail network pay a permanent freight penalty that shows up in the price of everything.

    KEYWORDS: lifecycle maintenance, cold-weather design, Interior connectivity

- candidate_first_name: Barbara
  candidate_last_name: Haney
  state: ak
  race: State House of Representatives # must match one of the options!
  district: 33
  party: Republican # must match one of the options!
  question: ak-q6
  date: 2026-10-20 # optional
  primary_candidate: false # optional, default false; true = ran in the primary but did not advance. Must be the same on every row for a given candidate
  response: |
    I am an economist with a doctorate, and my dissertation was a Monte Carlo simulation of federal and state fiscal measures. I built models for a living. That is the source of both my respect for scientific work and my care about how it gets used in a legislature.

    I read primary sources rather than summaries of them. When an agency gives me a conclusion, I ask for the data, the method, and the uncertainty. I have filed records requests when an agency would not answer plainly.

    The distinction I hold most firmly is between measurement and projection. Measurement deserves deference: if the data show permafrost degrading under a roadbed, I am not going to argue with the instrument. Projection deserves scrutiny, because a model's output depends on its assumptions, and the people presenting a projection are not always the people who chose those assumptions.

    I would seek out scientists directly, including ones who disagree with me, and I would weight discipline-specific expertise accordingly. A fisheries biologist should be heard on escapement. The same biologist is a citizen, not an authority, on what a bill should cost.

    KEYWORDS: primary sources, measurement versus projection, disciplinary expertise

