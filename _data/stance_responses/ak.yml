  response: |
    Transportation in Alaska is a lifeline, and we will manage it that way. We support full, stable funding for the Alaska Marine Highway System as essential infrastructure; coastal communities deserve reliable, year-round ferry service. We will prioritize deferred maintenance at our aging ports, including the Port of Alaska, and pursue every available federal infrastructure dollar. As the Arctic opens, Nome's deep-water port will anchor America's Arctic future, and we will champion a high-speed rail connection linking Nome to the state's rail network, opening interior communities, moving goods, and positioning Alaska as the continent's Arctic gateway. Rural connectivity investments will follow what communities actually ask for: upgraded airstrips, ice road and trail maintenance, and safe river infrastructure, guided by Tribal consultation and subsistence protection. Megaprojects must earn their way on rigorous cost, consent, and subsistence-impact standards. Climate change is rewriting our engineering assumptions, so we will build to it: permafrost-aware design, seismic resilience, erosion response, and support for communities facing relocation. We will grow Alaska's cold-weather innovation leadership, including drone inspection, through University of Alaska research and workforce pipelines. Every Alaska community deserves a way in and a way out.

    KEYWORDS: Alaska Marine Highway System, ferry service, deferred maintenance, Port of Alaska, federal infrastructure funding, Nome deep-water port, Arctic gateway, high-speed rail, rural connectivity, airstrips, ice roads, Tribal consultation, subsistence protection, megaproject standards, permafrost-aware design, seismic resilience, erosion response, community relocation, cold-weather innovation, drone inspection, University of Alaska, workforce pipelines

