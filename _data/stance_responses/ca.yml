  date: 2026-10-01
  primary_candidate: false
  response: |
    "I will confront climate change and the Trump administration's environmental rollbacks with bold action that centers environmental justice.
    That starts with our coastline. I oppose the administration's push to expand offshore drilling. This district runs from Malibu to the Palos Verdes Peninsula, and the spills in Santa Barbara in 1969 and Huntington Beach in 2021 showed what drilling costs our communities. Even when leases are federal, the State Lands Commission can refuse the pipelines and onshore facilities drilling depends on, and California should use that authority. As a member of the Santa Monica Bay Restoration Commission, I'll bring environmental advocates and local governments together to protect endangered species and fund the restoration of sandbanks and dunes.
    On land use, I'll accelerate wildfire prevention and proactive brush clearance in high-fire-risk areas, expand urban tree canopies, and prioritize equitable access to green space in neighborhoods hardest hit by extreme heat, guided by advocates like Climate Resolve, Sierra Club, and the Los Angeles Neighborhood Land Trust.
    As we move away from fossil fuels, I'll bring environmentalists and energy producers to the same table and make sure oil and refinery workers get job training for green jobs with equal pay and benefits."

- candidate_first_name: John
  candidate_last_name: Erickson
  state: ca
  race: State Senate
  district: 24
  party: Democratic
  question: ca-q2
  date: 2026-10-01
  primary_candidate: false
  response: |
    "I share the concerns about the resource burden, land use, and pollution that come with data centers. These facilities use enormous amounts of water and power, and they run cooling equipment and generators that produce constant noise, increasingly next to homes and farmland.
    We need to be smart about where and how they get built. As a councilmember and president of the California Contract Cities Association, I believe new data center projects should move forward only with local community input and consent. They should pay for their own renewable power, and they should give back to the community by adding to the grid and lowering utility prices for neighbors. Residents should not pay for the infrastructure these facilities need, and the industry should be transparent about the water and energy it uses.
    Siting decisions should rest on a careful review of resource use and environmental impact, with input from the local community.
    California has the workforce and the expertise to lead in innovation without causing harm. Let's keep these jobs here without lowering our standards to those of other states."

