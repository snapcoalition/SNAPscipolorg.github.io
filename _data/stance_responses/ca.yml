    "Rising measles cases and foodborne illness outbreaks show what happens when public health infrastructure and trust erode at the same time. Both problems demand the same core fix. California needs to invest in public health, not just react to crises.

    On vaccination, I support strong, well-funded public health outreach and education campaigns in low vaccination counties, delivered through trusted community messengers like local clinics, schools and faith organizations rather than mandates alone. I also support fully funding county public health departments so they can do real- time disease surveillance and respond quickly when outbreaks emerge, since delayed detection is often what turns a local case into a county wide outbreak.

    On food safety, given that California grows over a third of the nation's fresh produce, I support strengthening state inspection and traceability systems for farms and packing facilities, funded in part by industry fees, so contamination can be traced and contained quickly. Farmworkers should also have real protections and paid sick leave, since workers coming to work sick because they cannot afford not to is itself a public health risk.
    Prevention is cheaper than crisis response, and California's economy and health depend on getting ahead of both threats."

- candidate_first_name: Sarah
  candidate_last_name: Rascon
  state: ca
  race: State Senate
  district: 26
  party: Democratic
  question: ca-q6
  date: 2026-09-29
  primary_candidate: false
  response: |
    "Distrust in science grows when people only hear from researchers after a crisis, not throughout the process. I believe scientists and policymakers need standing, ongoing relationships, not just emergency briefings during outbreaks or disasters.

    As State Senator, I would support embedding scientists and public health experts directly into legislative committee work, not just as occasional witnesses, so policy is shaped by evidence from the start. I also support state funded science communication and public education campaigns delivered by trusted local messengers, including community clinics, schools, and faith organizations, since trust often depends on the messenger as much as the message.

    Given deep federal cuts to NIH, NSF, and other research funding, I support California stepping in to backfill critical research dollars, particularly for public health and disaster research that cannot afford to wait. Protecting the researchers, postdocs, and academic workers who do this work is part of protecting the research itself.

    Ultimately, rebuilding trust requires transparency. Policymakers should explain the evidence behind decisions plainly and consistently, and scientists should be present in community conversations year-round, not only when something goes wrong."

- candidate_first_name: Sarah
  candidate_last_name: Rascon
  state: ca
  race: State Senate
