    "It all comes down to ridership and transit agencies must be laser focused on the rider. There are 27 transit agencies in the Bay Area and for the past 10+ years, I have served and previously chaired two of them: Marin Transit and SMART. Coming out of the pandemic, both SMART and Marin Transit were #1 and #2 in the entire Bay Area for ridership return. How did we do it? The SMART train was still relatively new to passenger service and even with a tight budget and declining fare revenues during the pandemic, I led an effort to introduce free fares for youth and seniors. It was just too difficult and cumbersome to obtain a discounted clipper card and many simply chose not to ride because of the barriers. The free fare program was expected to result in even more lost fare revenue, but we actually saw fare revenues increase and ridership skyrocketed."
    
    KEYWORDS: seamless transit, free fares, SMART Train

