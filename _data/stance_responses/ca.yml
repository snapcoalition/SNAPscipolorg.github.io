  primary_candidate: false
  response: |
    "Data centers are driving up energy demand, straining water resources, and pushing up electricity costs for everyday Californians, all while companies keep their power and water use hidden from the public. I supported AB 1577, the Data Center Energy Accountability Act, because ratepayers deserve transparency into exactly how much energy and water these facilities consume.

    Beyond transparency, I believe no new data center should move forward without meeting strict, enforceable conditions: it must bring new clean energy online rather than draw from an already-strained grid; rely on recycled or non-potable water and prove it won't compete with local drinking water supplies; undergo full environmental review with early community input; and deliver real community benefits such as local hiring, union jobs, and energy bill relief for surrounding neighborhoods.

    Location matters too. These facilities shouldn't be sited in ways that worsen air quality, strain local infrastructure, or burden already-overburdened communities. If a project can't meet these standards, it shouldn't be approved. Data centers shouldn't expand at the expense of ratepayers and the communities around them."

- candidate_first_name: Sarah
