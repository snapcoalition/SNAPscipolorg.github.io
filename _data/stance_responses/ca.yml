    California should invest in proven teacher recruitment and retention programs, including teacher residencies, paid student teaching, and financial assistance for educators who commit to teaching science and math in high-need schools.

    Students also need access to laboratories, up-to-date instructional materials, environmental and outdoor education, project-based learning, and teachers with ongoing professional development. Resources should be prioritized for schools serving low-income and disadvantaged communities. A student’s ZIP code should never determine whether they have access to excellent science teachers, laboratories, or advanced STEM coursework.

    California must also strengthen pathways from K-12 science education to community colleges, universities, apprenticeships, and careers in fields such as health care, clean energy, biotechnology, engineering, manufacturing, and environmental science.

    Finally, the state should regularly measure student progress, evaluate which interventions are producing results, and invest in what works. California cannot remain a global science and technology leader without ensuring its students have the education and opportunities to participate in that future."

