    "California's dual identity as a top oil-producing state and conservation leader means pursuing two goals at once: winding down extraction responsibly while accelerating protection of the land we have left.

    I strongly support accelerating 30x30, with dedicated, ongoing funding for land acquisition and stewardship developed in partnership with Tribal nations, land trusts, and frontline communities - not just remote wilderness, but urban parks and working lands too.
    I support a managed, predictable phasedown of oil and gas, with mandatory setbacks near homes and schools, and remediation of idle wells funded by industry fees, not taxpayers, led by union labor.

    For clean energy, I'd prioritize siting solar, wind, and storage on already-disturbed land - rooftops, parking lots, former industrial sites - before opening protected public lands, paired with streamlined permitting tied to strong environmental and labor standards.
    Land-use investment should flow first to frontline communities that have carried the burden of pollution, through cleanup, tree canopy expansion, and green space.
    Finally, land use should support housing stability by expanding community land trusts to keep land off speculative markets."

- candidate_first_name: Sarah
  candidate_last_name: Rascon
  state: ca
  race: State Senate
