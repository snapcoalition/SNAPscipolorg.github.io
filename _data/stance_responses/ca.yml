    "Only a third of California students meeting science standards reflects a workforce crisis as much as a curriculum one. Districts are hiring under-credentialed teachers in math and science because we haven't made the profession sustainable. I'll fight to increase per-pupil funding to the average of the ten highest-funded states, reduce class sizes, and raise teacher pay and benefits so districts can recruit and retain qualified STEM educators instead of relying on emergency permits.

    I support expanding teacher residency and apprenticeship pipelines, particularly in math and science, with loan forgiveness and mentorship for new educators in high-need districts. I'd also invest in ongoing professional development so teachers already in classrooms can strengthen science instruction rather than leaving the field.

    Beyond staffing, I support the Community Schools model - wraparound health, mental health, and family support services - paired with expanded STEM and career-technical education programs that connect students to real pathways in the green economy and beyond. Evidence shows smaller class sizes and stable, well-supported teachers drive proficiency gains. This has to be the foundation."

