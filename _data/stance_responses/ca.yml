    "California’s land-use policy should be guided by the best available science to conserve natural resources and protect the health and quality of life of current and future generations.

    California should maintain its commitment to conserve 30% of its lands and coastal waters by 2030, with measurable outcomes that protect biodiversity hotspots, wildlife corridors, watersheds, wetlands, and other critical habitats. We should also invest in habitat restoration, wildlife connectivity, and science-based forest and wildfire management, including prescribed and beneficial fire. Management of public lands should include greater partnership with California Native American tribes and incorporate traditional ecological knowledge.

    We must also responsibly address the legacy of oil production. Operators should be required to safely plug idle and orphaned wells and remediate contaminated land so taxpayers and communities are not left paying for environmental damage.

