- candidate_first_name: Ashley
  candidate_last_name: Brown
  state: ca
  race: State Assembly
  district: 55
  party: Democratic
  question: ca-q1
  date: 2026-10-30
  primary_candidate: false
  response: |
    "I believe California's natural resources are a responsibility, not simply an economic opportunity. Our land, water, forests, and coastline must be protected while creating opportunities for our communities and future generations.

    As a member of the State Assembly, I would prioritize five areas:

    Land Conservation: Continue protecting California's forests, coastlines, wildlife habitats, and open spaces.

    Environmental Justice: Ensure every community has access to clean air and safe drinking water, regardless of ZIP code.

    Responsible Energy: Support a thoughtful transition toward renewable energy while considering affordability, workers, and local economies.

    Wildfire Prevention: Invest in forest management, vegetation maintenance, and partnerships with Native American tribes to protect our natural landscapes.

    Community Involvement: Give residents, farmers, tribal communities, and local organizations a meaningful voice in land-use decisions.

    Ultimately, we must balance economic development with environmental responsibility. Our natural resources should benefit Californians today without compromising the opportunities and quality of life available to future generations."
    
- candidate_first_name: Ashley
  candidate_last_name: Brown
  state: ca
  race: State Assembly
  district: 55
  party: Democratic
  question: ca-q2
  date: 2026-10-30
  primary_candidate: false
  response: |
    "Data centers are important to California's technology economy, but their growth must not come at the expense of our communities, water supplies, or environment.

    I would support policies that:
    1. Protect Water Resources: Require transparent reporting of water consumption and encourage recycled water and water-efficient cooling systems.
    2. Protect Ratepayers: Ensure data center companies pay their fair share of electricity and infrastructure costs rather than shifting expenses to working families.
    3. Protect Neighborhoods: Require noise assessments, appropriate zoning, and environmental reviews before approving new facilities.
    4. Promote Clean Energy: Encourage renewable energy and energy-efficient technologies to reduce pollution and dependence on fossil fuels.
    5. Demand Accountability: Require regular reporting of environmental impacts and meaningful community input before approving new developments.
    California should welcome technological innovation while ensuring corporations are responsible neighbors and partners.

    Economic growth should benefit our communities, not leave them paying the environmental and financial costs."
    
- candidate_first_name: Ashley
  candidate_last_name: Brown
  state: ca
