  question: ca-LA-q1
  date: 2026-09-29
  primary_candidate: false
  response: |
    "Metro's ridership growth shows that when service expands, people use it. That should guide how we invest, but expansion has to be paired with safety, affordability, and anti-displacement protections, not treated separately from them.

    As a board member of CicLAvia, I have seen firsthand what happens when streets are opened up for people instead of cars. Our open streets events consistently show that when Angelenos feel safe walking, biking, and moving through public space, they show up by the thousands, and that same principle applies to transit. Reliability and a sense of safety are what actually build ridership, not just new stations.

    On safety, I support an array and alternative approaches that include safety presence, like transit ambassadors, mental health response teams, and better lit, better maintained stations, rather than relying on criminalization. Research and rider surveys, along with what I have observed through CicLAvia's community engagement, show that visible presence and reliability build trust more than policing alone.

    On expansion, delays and cost overruns are often the result of fragmented funding and permitting. I support dedicated, long term operating funding for Metro so projects are not repeatedly stalled or descoped, along with stronger project labor agreements to keep construction on track with good union jobs.

    On displacement, the data is clear that new stations raise nearby rents. I support community perseveration, first right of refusal and prioritizing existing neighbors. Building affordable and social housing near transit before or alongside station openings, expanding community land trusts and tenant protections in station areas, and prioritizing public land for affordable development so residents can benefit from the transit investment in their own neighborhoods, rather than being pushed out by it."

- candidate_first_name: John
  candidate_last_name: Erickson
  state: ca
  race: State Senate
