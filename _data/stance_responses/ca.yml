  response: |
    "I support maintaining a stable and diversified investment in scientific research, particularly research that addresses California’s long-term needs in areas such as health, agriculture, climate resilience, energy, technology, and infrastructure.

    Research funding should come from a combination of state, federal, private, and philanthropic sources. State funding can also help universities attract additional outside research dollars. For example, UC reported approximately $5.8 billion in direct research expenditures in 2023–24, with federal sources accounting for about half of that funding.
    There is also documented evidence that university research and related activities contribute significantly to California’s economy. UC’s most recent systemwide economic-impact analysis found that UC supports more than 500,000 jobs and generates more than $21 in economic output for every $1 invested by the state. These figures measure the broader economic effects of the University and should not be interpreted as a return generated solely by individual research grants.

    I see science research playing a role in California’s economy by supporting innovation, creating skilled jobs, attracting federal and private investment, developing new technologies and businesses, and addressing practical challenges facing the state. Public investment should be accompanied by transparency about how funds are used and measurable outcomes, while recognizing that basic research can take years to produce economic or technological benefits."
    
