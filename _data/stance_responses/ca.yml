    I support funding community health workers, promotoras, and culturally and linguistically specific outreach organizations to lead vaccination campaigns in low-coverage counties, rather than relying solely on top-down mandates. I also support strengthening school vaccination requirement enforcement and closing loopholes that allow low-coverage clusters to persist.

