    "Tech billionaires should not make the rules while working families pay the price. Data centers power our economy, but their growth cannot threaten our water, grid, or communities.

    I oppose new data center construction unless four strict conditions are met:

    **Union Labor:** Facilities must be built entirely with union labor.

    **Water Protection:** No community drinking water or groundwater. Data centers must use closed-loop cooling or recycled water.

    **Ratepayer Protection:** Working families must never subsidize tech energy demands. Data centers must pay their own transmission and infrastructure costs.

    **Grid Enhancement:** Data centers must strengthen our grid by bringing new clean generation and battery storage online and funding local grid upgrades.

    Approvals must also account for cumulative environmental and public-health impacts, including noise, backup-generator emissions, and proximity to homes, with continuous monitoring and meaningful penalties.

    California can lead in technology without sacrificing our resources—but only with strict rules, real enforcement, and consequences for bad actors."

    KEYWORDS: Union Labor, Water Protection, Ratepayer Protection, Grid Reliability, Accountability

