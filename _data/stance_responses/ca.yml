  response: |
    "I believe public transportation is essential to building healthier, more affordable, and economically connected communities. Los Angeles must continue expanding its transit system while addressing safety, affordability, and the impact of development on existing residents.

    As a member of the State Assembly, I would prioritize four areas:

    Public Safety: Increase investment in trained transit safety personnel, improved lighting, emergency response, and mental health outreach to make public transportation safer for everyone.

    Responsible Expansion: Support transparent project oversight, realistic construction timelines, and accountability for cost overruns.

    Affordable Housing: Encourage affordable housing development near transit stations while protecting longtime residents and small businesses from displacement.

    Environmental Benefits: Invest in reliable electric buses, expanded rail service, and improved connections between neighborhoods to reduce traffic congestion and air pollution.

    Research from UCLA on transit-oriented development and USC research on Metro rider safety demonstrate the importance of addressing both the benefits and challenges of public transportation.

    My goal is to ensure Los Angeles residents have access to safe, reliable, affordable transportation without being displaced from the communities they call home.

    Public transportation should connect communities, create opportunities, and improve quality of life for all Californians."

