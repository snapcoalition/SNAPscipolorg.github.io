  question: ca-q3
  date: 2026-10-30
  primary_candidate: false
  response: |
    "I believe every California student deserves access to quality education, regardless of their ZIP code or family income. With only about 33% of students meeting or exceeding state science standards in 2025, we must make science education a statewide priority.

    As a member of the State Assembly, I would focus on four areas:

    Invest in Teachers: Expand teacher residency programs, scholarships, mentorship, and financial incentives to recruit and retain fully credentialed math and science teachers, particularly in underserved communities.

    Hands-On Learning: Increase access to science laboratories, technology, gardening, environmental education, and real-world STEM projects that make learning engaging and relevant.

    Equitable Resources: Direct additional funding toward schools with teacher shortages and limited access to science equipment, technology, and enrichment programs.

    Community Partnerships: Build partnerships with universities, local businesses, scientists, and community organizations to expose students to STEM careers and mentorship opportunities.

    I believe we must invest in both our educators and our students. Improving science proficiency requires qualified teachers, engaging curriculum, and equal access to educational opportunities.

    Our children's future depends on the opportunities we create for them today."
    
- candidate_first_name: Ashley
  candidate_last_name: Brown
  state: ca
  race: State Assembly
  district: 55
  party: Democratic
  question: ca-q4
  date: 2026-10-30
  primary_candidate: false
  response: |
    "I believe healthcare should be accessible, affordable, and centered on the needs of patients and families. Medi-Cal provides essential coverage to millions of Californians, but having insurance does not always mean having access to a doctor.

    As a member of the State Assembly, I would prioritize four areas:

    Protect Healthcare Access: Strengthen Medi-Cal and community health clinics while reducing barriers that prevent eligible families from receiving care.

    Invest in Healthcare Workers: Expand scholarships, training, and incentives to recruit and retain doctors, nurses, and mental health professionals, particularly in underserved and rural communities.

    Address Affordability: Support policies that reduce prescription drug costs, increase price transparency, and protect families from excessive healthcare expenses.

    Expand Preventative and Mental Healthcare: Invest in early intervention, mental health services, telehealth, and community-based healthcare programs.

    I also believe environmental health must be part of healthcare policy. Communities deserve clean air, safe drinking water, and protection from environmental hazards.

    Healthcare should not be determined by someone's income or ZIP code. My goal would be to strengthen California's healthcare system so families can receive quality care before a medical concern becomes a crisis.

    Healthy communities create stronger families and a stronger California."
    
- candidate_first_name: Ashley
  candidate_last_name: Brown
  state: ca
  race: State Assembly
  district: 55
  party: Democratic
  question: ca-q5
  date: 2026-10-30
  primary_candidate: false
  response: |
    "I believe preventing infectious disease outbreaks requires strong public health infrastructure, education, and accountability. California must protect both the health of its residents and the agricultural industries that feed our communities and the nation.

    As a member of the State Assembly, I would prioritize four areas:

    Preventative Healthcare: Expand access to vaccinations, public health education, and community-based clinics, particularly in underserved communities.

    Early Detection: Invest in local health departments, laboratory testing, disease surveillance, and rapid response teams to identify and contain outbreaks.

    Food Safety: Strengthen farm inspections, food handling standards, water-quality monitoring, and produce traceability to prevent contamination.

    Community Partnerships: Build stronger partnerships among schools, healthcare providers, farmers, and public health agencies to educate families and coordinate responses.

    I would also support transparent public reporting so residents receive timely, accurate information during outbreaks.

    Protecting public health should not come at the expense of California's farmers and agricultural workers. We must develop science-based policies that protect consumers while supporting responsible agricultural production.

    Prevention saves lives, protects livelihoods, and strengthens our communities."
    
- candidate_first_name: Ashley
  candidate_last_name: Brown
  state: ca
  race: State Assembly
  district: 55
  party: Democratic
  question: ca-q6
  date: 2026-10-30
  primary_candidate: false
  response: |
    "I believe rebuilding trust in science starts with transparency, education, and open communication. Scientists and policymakers must work together to make research understandable, accessible, and relevant to the everyday lives of Californians.

    As a member of the State Assembly, I would prioritize three areas:

    Community Engagement: Create opportunities for scientists to speak directly with students, families, educators, and community organizations through public forums, school programs, and workshops.

    Transparent Communication: Encourage scientists and government agencies to communicate research findings in clear, accessible language, including acknowledging uncertainties and explaining how scientific evidence informs public policy.

    Education and Investment: Support science education in K-12 schools, partnerships with universities, and continued investment in independent scientific research.

    I also believe policymakers have a responsibility to listen to scientific experts while remaining accountable to the communities they represent.

    Science should not be about political parties; it should be about evidence, discovery, and improving people's lives.

    When scientists, educators, policymakers, and communities work together, we can build informed communities and stronger public trust."
    
