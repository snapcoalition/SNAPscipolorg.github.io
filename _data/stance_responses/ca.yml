    "A ""C"" grade across cost, quality, and access tells me California's healthcare system works reasonably well for some residents but leaves too many others behind, especially in rural areas and low-income communities. I believe the solution has to address both the near-term gaps and the long-term structure.

    I am a proud supporter of CalCare, California's single payer healthcare proposal, because a system where everyone is covered under one standard of care removes the gaps in cost and access that show up so clearly in Medi-Cal's patchwork of coverage today. Since Medi-Cal covers close to half of all Californians, I will fight to protect and expand its funding, oppose any budget that treats it as an easy cut, and push back against federal reimbursement cuts by backfilling state dollars where needed.

    On workforce shortages, especially in rural and underserved areas, I support scholarships, loan forgiveness, and paid clinical placements for nurses and other health workers who commit to practicing in high need communities.

    On environmental health threats, since pollution and toxic exposure drive so much of California's chronic disease burden, I support fully funded toxic cleanups and stronger enforcement in frontline communities, since environmental policy is health policy."

- candidate_first_name: Sarah
  candidate_last_name: Rascon
