  response: |
    Because Delaware is the preferred home of incorporation for dominant tech enterprises—including OpenAI—our Attorney General holds unmatched influence over corporate AI governance. When AG Kathy Jennings issued a Statement of No Objection allowing OpenAI to convert its primary business from a non-profit entity into a for-profit Public Benefit Corporation, it demonstrated how Delaware’s regulatory oversight shapes the global technology landscape.

    However, corporate restructuring must be paired with aggressive civil rights enforcement on behalf of everyday Delawareans. Drawing on my track record fighting technological overreach as Legal Director of the ACLU of Delaware, I will treat AI accountability and data privacy under the Delaware Personal Data Privacy Act as vital civil liberties protections. My enforcement pillars will be:
    1)  Fighting Algorithmic Discrimination: Investigating automated systems and data brokers whose opaque algorithms produce discriminatory barriers in hiring, housing, healthcare access, and credit scoring.
    2) Proactive Compliance Audits: Moving beyond voluntary guidance to actively audit entities harvesting sensitive health, location, biometric, or youth data without explicit, informed consent.
    3) Protecting Digital Civil Liberties: Enforcing strict data minimization standards and safeguarding residents' fundamental rights against unchecked data exploitation. (187 words)
