    My decision framework will proactively evaluate three criteria:
    1) Direct Impact on Delawareans: Actionable harm to our residents, particularly frontline and historically underrepresented communities facing environmental or healthcare barriers.
    2) Scientific & Empirical Consensus: Prioritizing actions grounded in rigorous research, including defending reproductive health equity, protecting climate regulations, and curbing toxic industrial emissions.
