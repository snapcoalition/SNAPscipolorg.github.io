    Environmental justice and corporate accountability will drive our environmental enforcement strategy. While AG Jennings secured settlements against legacy chemical polluters like DuPont and Chemours over PFAS contamination, financial settlements negotiated after damage is done are not enough—especially when overburdened communities in New Castle County and across our state still live next to toxic industrial sites.

    My office will maintain independent prosecutorial authority while coordinating closely with DNREC to shift from reactive settlements to proactive prevention and environmental justice:
    1) Environmental Justice Mandate: Directing dedicated legal staff and investigative resources toward fence-line communities that have historically borne a disproportionate burden of industrial air and water pollution.
    2) Real Community Remediation: Ensuring PFAS and toxic cleanup settlements directly fund local clean water infrastructure and health monitoring in impacted neighborhoods, rather than disappearing into general state coffers.
    3) Strict Deterrence & Injunctive Relief: Seeking aggressive court orders and strict liability penalties against repeat industrial polluters to halt environmental harm in real time. Delawareans deserve an Attorney General who treats clean air and water as non-negotiable civil rights.

