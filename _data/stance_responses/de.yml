    I support investing in resilient infrastructure, including improved stormwater systems, elevating vulnerable roadways, strengthening flood-control projects, and restoring wetlands and natural shorelines that help absorb floodwaters. These investments reduce long-term damage while protecting our environment.

    We should also work closely with local governments, emergency management officials, property owners, and the federal government to secure funding for flood mitigation projects. Delaware should aggressively pursue federal grants to reduce the financial burden on state taxpayers.

