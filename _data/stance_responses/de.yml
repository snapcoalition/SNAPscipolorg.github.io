    I support responsible data-center development, but Delaware families and small businesses should not be forced to subsidize the enormous electricity demands of large technology companies.

    AI-powered data centers can bring investment, construction jobs, and tax revenue. However, their growth must not increase electricity costs or weaken grid reliability for Delaware residents. I believe data centers should be largely self-sufficient by creating or directly securing the energy needed to operate. This could include on-site generation, renewable energy paired with battery storage, or other dependable energy sources that meet Delaware’s environmental and safety standards.

    Data-center operators should also pay the full cost of the infrastructure required to serve them, including substations, transmission upgrades, and other grid improvements. Long-term contracts and substantial upfront financial commitments should protect ratepayers if a project is delayed, reduced, or abandoned.

    Before receiving state approval or financial incentives, every major data-center proposal should undergo an independent review of its effects on electricity rates, grid reliability, water consumption, land use, and local infrastructure.

    Delaware should welcome innovation and economic development, but growth must pay its own way. Those creating extraordinary electricity demand should provide the energy and infrastructure necessary to meet it—not pass those costs on to Delaware families.

