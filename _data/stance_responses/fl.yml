    Florida also needs to strengthen the resilience of its core infrastructure. Communications systems, transportation networks, and logistics must be built and maintained with an all‑hazards approach in mind. Hurricanes, flooding, extreme heat, and other climate‑related threats will continue to affect the state, and our infrastructure must be able to withstand and recover from these events quickly.
