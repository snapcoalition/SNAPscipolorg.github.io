    No. I do not believe Florida has struck the right balance, and I do not support further data center development in our state.
    Florida already faces significant challenges involving electricity affordability, water conservation, infrastructure capacity, and environmental resilience. Continuing to incentivize the construction of resource-intensive facilities places unnecessary pressure on systems that residents and small businesses depend on every day.
    I support eliminating state tax incentives for new data centers and establishing stronger protections to ensure existing facilities are responsible for the infrastructure, electricity, and water demands associated with their operations. Those expenses should not be passed along to working-class households or small businesses through higher utility rates or taxpayer-funded infrastructure improvements.
