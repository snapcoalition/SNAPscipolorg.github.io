    Florida has not struck the right balance between encouraging AI‑driven data‑center development and protecting the interests of local communities. The pace of construction has accelerated, but the public has been given very little insight into how these facilities are planned.  Transparency has been minimal, and meaningful stakeholder engagement has been largely absent.
    This matters because AI data centers are not just another category of commercial development. They reshape land use, energy demand, water consumption, and local infrastructure. They also concentrate enormous economic value. When decisions are made without community input, the result is predictable: the burdens fall on local residents, while the financial gains flow elsewhere.
    To address these problems, I have proposed the Florida AI Bill, which establishes an independent oversight commission and requires structured stakeholder engagement from the local to the global level. More information about the proposed legislation is available here:   https://thorntonforhumandignity.com/legislation-proposed/the-florida-ai-bill/
    The goal is not to halt innovation. It is to ensure that Florida builds an AI future that strengthens communities rather than bypassing them. Responsible governance requires open planning, honest communication, and a commitment to distributing the benefits of AI fairly.
    
    Keywords: Transparency, stakeholders, collaboration 
    
