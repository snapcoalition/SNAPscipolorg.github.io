    I believe Florida's approach to disaster resilience must prioritize preparation and prevention rather than relying so heavily on disaster recovery. Hurricane season comes every year, and our communities should not have to wait until a storm approaches to receive the resources and support necessary to protect themselves.
    I support greater federal investment in stormwater drainage, flood mitigation, coastal restoration, infrastructure improvements, and programs that help homeowners strengthen their properties against natural disasters. Federal, state, and local governments should coordinate year-round to identify vulnerabilities and address them before disasters occur.
    Homeowners' insurance affordability must also be a priority. Families should not be priced out of their homes by rising premiums. I support greater transparency in insurance pricing, accountability for insurers, and ensuring that investments in disaster prevention translate into meaningful savings for policyholders.
    We must also recognize that protecting our environment protects our economy. Investing in natural barriers, resilient infrastructure, and proactive preparedness can reduce property damage, displacement, and long-term recovery costs.
    Our success should be measured not only by how quickly we rebuild after disasters, but by how much damage and financial hardship we prevent in the first place.

    Keywords: Florida Homeowners Insurance, Hurricane Preparedness, Disaster Resilience, Insurance Affordability

