  response: |
    "As a former middle school teacher, I strongly support expanding STEM and STEAM education while ensuring existing funding reaches classrooms and produces measurable results.

    During COVID, I taught digital media to seventh- and eighth-grade students, integrating photography, nature, technology, and artistic expression. Students explored their identities through these projects and used Photoshop to create original works. This reinforced my belief that technology should develop creativity, critical thinking, and independent learning.

    I also envision partnerships between schools, local muralists, and artists where students participate in transforming graffiti-prone walls into meaningful public art. Working alongside professionals, students could learn design, digital technology, project planning, cultural storytelling, and community stewardship while taking pride in their neighborhoods.

    I support hands-on STEM opportunities, extracurricular programs, teacher development, and responsible AI integration that enhances rather than replaces foundational learning.

    With approximately 40% of students demonstrating math and science proficiency, we must evaluate how education dollars are spent in the best areas for the growth of our students.

    As a Honolulu City Council member, I would advocate for partnerships connecting schools, local businesses, artists, and community organizations.

    Our keiki deserve opportunities to become creators, innovators, and problem-solvers, not simply consumers of technology."
    
    KEYWORDS: STEM, STEAM
    
