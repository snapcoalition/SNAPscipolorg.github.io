  response: |
    "I believe that clean, alternative forms of energy that are safe, affordable and sustainable are essential to energy independence. I would support expanding the portfolio of energy diversification in Hawaii to lower energy prices, reduce brownouts/rolling blackouts, and enable the state to be more resilient during storms. Energy security is also important because of the large number of individuals in Hawaii who have chronic diseases, especially chronic kidney disease, who require dialysis. I will work in office to ensure making our energy independence a top priority."
    
    KEYWORDS: Research, development, state-of-the-art, technology, national security, health equity

