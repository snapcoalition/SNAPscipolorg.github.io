- candidate_first_name: Shannon
  candidate_last_name: Matson
  state: hi
  race: Local County Races [All]
  county_race: Hawaii Councilmember  # feel free to remove if not applicable
  district: 5 # string, e.g. 14 or 14A; feel free to remove if not applicable
  party: Non-partisan
  question: hi-q1
  response: |
    "Hawaiʻi’s dependence on imported fossil fuels is something that keeps me up at night, especially with such international instability. Our reliance on gas in such rural communities really leaves our residents vulnerable. Rising energy costs and global market disruptions are extremely real threats that we honestly are completely unprepared for. We must accelerate the transition to affordable, reliable, locally produced clean energy while ensuring that working families already struggling to make ends meet are not left paying the price.

    I support expanding rooftop and community solar, responsibly sited wind projects, battery storage, wave generated power, and exploring geothermal energy if (big IF) cultural, geological conditions, and environmental safeguards make it appropriate. These resources can reduce our dependence on imported fuels, strengthen energy security, and keep more energy dollars circulating in our local economy. We should prioritize projects on existing rooftops, parking structures, and previously developed lands to minimize impacts on agricultural lands, native ecosystems, and culturally significant places.

    County and State policies should streamline permitting for responsible renewable energy projects, renew or expand incentives for household solar and battery systems, and provide targeted assistance to low-income households and renters who might otherwise be excluded from the benefits of clean energy. As the recent storms and hurricanes have shown us this year we also must invest in grid modernization and redundant systems for our crucial grid-tied systems like water, food, and healthcare power needs. 

    Our goal should be a resilient, equitable energy system that lowers utility bills, protects our environment, and moves Hawaiʻi toward energy independence."
    
    KEYWORDS: Solar, Independence, Renewable 
    
- candidate_first_name: Shannon
  candidate_last_name: Matson
  state: hi
  race: Local County Races [All]
  county_race: Hawaii Councilmember  # feel free to remove if not applicable
  district: 5 # string, e.g. 14 or 14A; feel free to remove if not applicable
  party: Non-partisan
  question: hi-q2
  response: |
    "I began the Hawaiian Acres Resilience Hub in 2020, mostly as a response to the pandemic shutdowns, but since that time we have responded to lava concerns, fire, hurricanes, tropical storms, flooding, governmental shutdowns, and addressing general poverty concerns. We cannot expect government to be responsive to these concerns, especially at the County level, as we simply do not have enough personnel and resources to meet the demand during times of recovery/disaster. 

    Right now we are partnering with Vibrant Hawai'i which has a network of Resilience Hubs across Hawai'i County and has been expanding to neighbor islands, and this is a model I would like to see additional funding and support for at both the County and State level. It's tried and true, and most importantly, it works. The more we can have trusted partners and organizations within our communities that are already trained, resourced, and ready to respond, the more resilient we will be and the better our response will be."
    
    KEYWORDS: Resilience, Disaster-Prepared, Hubs

- candidate_first_name: Shannon
  candidate_last_name: Matson
  state: hi
  race: Local County Races [All]
  county_race: Hawaii Councilmember  # feel free to remove if not applicable
  district: 5 # string, e.g. 14 or 14A; feel free to remove if not applicable
  party: Non-partisan
  question: hi-q3
  response: |
    "Our communities welcome technological innovations when they benefit our residents, create quality local jobs, and strengthen our economy. However, we do not welcome innovation at the cost of our water security, increased electricity costs, damage to culturally or environmentally sensitive ecosystems, or undermine community priorities.

    I support requiring proposed data centers to undergo transparent, site-specific reviews addressing electricity demand, water consumption, wastewater management, noise, backup generators, emissions, and cumulative environmental impacts. Developers should demonstrate that projects will not shift infrastructure costs onto residential ratepayers or compromise essential services during droughts, emergencies, or periods of peak electricity demand.

    Counties should have clear authority to regulate these facilities through zoning, permitting, and enforceable environmental standards. Hawaiʻi County’s proposal to distinguish AI data centers from conventional data processing facilities raises important questions about differences in energy demand, cooling requirements, and community impacts. Other counties should evaluate similar safeguards and consider if bans would be beneficial statewide. 

    Our land and water are finite and essential to our communities. Economic development must respect those limits. We can pursue technological progress without sacrificing environmental sustainability, reliable infrastructure, or the well-being of future generations."
    
    KEYWORDS: Water-usage, Electricity-usage, Sustainability

