  party: Non-partisan
  question: hi-q4
  response: |
    "Disclaimer- most of the following applies more to State candidates, as County Council Members really don't have much say in the way of policy or funding for DOE. 

    As a parent of keiki in a Native Hawaiian Immersion Public Charter School I am supportive of more funding going towards these types of "alternative" learning environments. I believe everyone learns differently and having diverse options is extremely important. I support increasing and sustaining public investment in qualified teachers, smaller instructional groups (whenever feasible), updated learning materials, modern science laboratories, reliable technology, and professional development. Rural and neighbor-island schools should receive resources that reflect their unique challenges, including teacher recruitment, transportation, broadband access, and limited opportunities to offer specialized courses.

    We should expand hands-on STEM education through robotics, coding, environmental science, agricultural technology, internships, and partnerships with the University of Hawaiʻi, community colleges, and local employers. After-school programs, tutoring, summer learning, and extracurricular activities should be affordable and accessible to families who cannot pay additional fees.

    AI has become so prevalent, I think the role of educators should be one of discernment- how are we helping our students recognize and adapt to a world filled with technology and AI? Are they learning clear boundaries, and safety measures? While AI may help teachers personalize instruction, provide additional practice, and improve accessibility for students with different learning needs, it should be used to support, not replace, teachers and meaningful student engagement. Any AI use in the classroom must protect student privacy, address bias, and ensure equitable access to technology.

    I would support transparent reporting of achievement and opportunity gaps so schools can direct resources where they are most needed. Educational success should not depend on a family’s ability to purchase enrichment or a school’s geographic location. Investing in our schools, teachers, and students strengthens Hawaiʻi’s workforce, communities, and long-term future."

    KEYWORDS: Alternative learning, investment, equity
    
