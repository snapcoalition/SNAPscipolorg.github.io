  party: Non-partisan
  question: hi-q5
  response: |
    "We need a transportation system that reduces emissions and traffic, especially in our rural communities on Hawai'i Island. Residents should not have to choose between affordable transportation and protecting our environment.

    I support investing in reliable public transportation, including expanded bus service, improved inter-island and rural connections through our para-transit systems, safer pedestrian routes, and protected bicycle lanes. Transportation planning should prioritize access to jobs, schools, healthcare, grocery stores, and essential services.

    We should accelerate the transition to electric buses and government fleets, expand charging infrastructure, and provide targeted incentives that help low- and moderate-income households transition to cleaner vehicles. Incentives must account for rural communities where charging infrastructure remains limited. 

    Our ports, airports, roads, and transit systems must also be built with redundancy to mitigate against flooding, coastal erosion, lava, extreme weather, and other climate risks. I support pursuing federal funding and public-private partnerships with strong public accountability whenever possible. The Puna Alternate Route planning is underway and while it is long overdue, I am grateful for some of the volunteers that are serving on this committee as they are truly savvy members of our community who have long-term knowledge of the plans that already exist and connectivity routes that badly need to be prioritized. 

    Ultimately, sustainable transportation must be practical and equitable. We should reduce dependence on fossil fuels without making everyday travel more expensive or leaving rural and lower-income residents behind."

    KEYWORDS: Connectivity Routes, Infrastructure

