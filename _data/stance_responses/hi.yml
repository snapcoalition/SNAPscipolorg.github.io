- candidate_first_name: Adrian
  candidate_last_name: Akina
  state: hi
  race: Local County Races [All]
  county_race: Office of Hawaiian Affairs At-Large Trustee  # feel free to remove if not applicable
  party: Non-partisan
  question: hi-q1
  response: |
    "We need energy independence, but not at the cost of our ʻāina and wai. Solar and wind are fine if they do not destroy sacred sites or water sources. Geothermal has a legal wrinkle. The 1856 statute reserved minerals to the King, but the 1859 Civil Code left it out, and the courts ruled that omission repealed it. So mineral ownership is ambiguous. I would support geothermal only with free, prior, and informed consent, independent monitoring, and royalties flowing directly to the lāhui."
    
    KEYWORDS: Wai (Water), ʻĀina (Land), Lāhui (People)
    
- candidate_first_name: Adrian
  candidate_last_name: Akina
  state: hi
  race: Local County Races [All]
  county_race: Office of Hawaiian Affairs At-Large Trustee  # feel free to remove if not applicable
  party: Non-partisan
  question: hi-q2
  response: |
    "My plan is grounded in Kingdom law. The 1840 Constitution said water is free to all. The 1845 Land Commission reserved water for the people's common good. The 1876 Forestry Act protected watersheds to conserve water. We need to follow the 1860 Water Commission model: local knowledge, place-based governance.
 
    We must protect wai first. No development gets to consume water that belongs to the people. We prepare for coastal and climate impacts on housing, agriculture, and cultural sites. We invest in resilience for beneficiary communities, not just OHA assets. When disaster hits, we respond together. That is our kuleana to future generations."
    
    KEYWORDS: Wai (Water), Kaiāulu (Community), Kuleana (Responsibility)
    
- candidate_first_name: Adrian
  candidate_last_name: Akina
  state: hi
  race: Local County Races [All]
  county_race: Office of Hawaiian Affairs At-Large Trustee  # feel free to remove if not applicable
  party: Non-partisan
  question: hi-q3
  response: |
    "Data centers consume enormous energy and water. Under the 1840 Constitution and 1845 Land Commission Principles, water is reserved for the people. Under the 1876 Forestry Act, watersheds are protected for water, not industry. I support the intent of Bill 170. AI data centers should not drain our limited resources.
 
    Any data center in Hawaiʻi must use renewable energy without raising ratepayer costs. It must use closed-loop cooling so it does not consume public water. It must pay its own infrastructure costs. It must hire locally and provide enforceable community benefits. OHA's data must live on lāhui-controlled infrastructure. We need data sovereignty. We cannot let outside corporations control our records and our story."
    
    KEYWORDS: Wai (Water), ʻIke (Knowledge/Data), Pono (Balance)
    
- candidate_first_name: Adrian
