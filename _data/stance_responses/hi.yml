    "Transportation is a lifeline for our islands. We need sustainable options like electric vehicles, hybrid buses, and public transit. But we must ensure equity for rural communities and neighbor islands. We cannot just focus on Honolulu rail and forget Molokaʻi or Lānaʻi. Sustainable aviation fuel is good, but it must not come at the cost of our ʻāina and wai. Ports must be resilient to climate change.
 
