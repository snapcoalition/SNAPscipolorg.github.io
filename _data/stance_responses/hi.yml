- candidate_first_name: Tara Malia
  candidate_last_name: Gregory
  state: hi
  race: Local County Races [All]
  county_race: Honolulu Councilmember  # feel free to remove if not applicable
  district: 4 # string, e.g. 14 or 14A; feel free to remove if not applicable
  party: Non-partisan
  question: hi-q1
  response: |
    "I believe environmental stewardship, scientific innovation, energy affordability, and reliability must work together. I agree with SNAP's emphasis on science-informed policymaking and evaluating energy technologies through credible research and measurable outcomes.

    My priority is expanding decentralized energy systems, including rooftop solar, battery storage, community microgrids, and energy-efficient infrastructure, while maintaining a stable, modernized electrical grid. Hawaiʻi needs reliable backup power and resilient infrastructure, particularly during emergencies.

    I support continued research into wind, geothermal, ocean energy, and emerging technologies, evaluating their environmental impacts, affordability, reliability, and compatibility with Hawaiʻi's cultural and natural resources.

    Regarding liquefied natural gas (LNG), I have not conducted sufficient research to take a definitive position. I believe responsible leadership requires examining scientific evidence, environmental consequences, and long-term costs before making policy commitments.

    As a Honolulu City Council member, I would advocate for renewable energy on municipal properties, responsible permitting reform, resilient essential services, and greater transparency in infrastructure spending.

    Our energy future should reflect the principles of the ahupuaʻa: responsible stewardship, local resource management, and community self-reliance. Ultimately, success must be measured by lower electricity costs, fewer outages, greater resilience, and meaningful protection of our ʻāina for future generations."

    KEYWORDS: SNAP, LNG, Lower Costs
    
- candidate_first_name: Tara Malia
  candidate_last_name: Gregory
  state: hi
  race: Local County Races [All]
  county_race: Honolulu Councilmember  # feel free to remove if not applicable
  district: 4 # string, e.g. 14 or 14A; feel free to remove if not applicable
  party: Non-partisan
  question: hi-q2
  response: |
    "I believe climate resilience begins long before disaster strikes. We must shift from reacting to emergencies toward proactively protecting our communities, infrastructure, natural resources, and vulnerable residents through science-informed planning and measurable preparedness.

    I support strengthening accountability under Hawaiʻi Revised Statutes Chapter 127A, particularly §127A-14(c), which designates the Governor or Mayor as the "sole judge" of circumstances justifying emergency declarations. I believe emergency authority should include documented evidence, transparency, legislative oversight, and meaningful judicial review without compromising immediate lifesaving responses.

    As a Honolulu City Council member, I would prioritize flood mitigation, coastal protection, wildfire prevention, improved emergency warnings and evacuation systems, and reliable backup electricity and water for essential services.

    I also believe we must critically examine whether our existing emergency shelters provide adequate protection during major disasters. Rather than automatically investing in additional community resilience hubs, I would advocate for independent assessments of shelter capacity, structural safety, and emergency infrastructure.

    We should seriously evaluate hardened public shelters, underground protective facilities where geographically appropriate, and multipurpose structures capable of withstanding extreme weather. Why should access to robust emergency protection depend on someone's financial resources? Any investment must be supported by scientific risk assessments, engineering feasibility, environmental considerations, and transparent cost-benefit analysis.

    Drawing from traditional ahupuaʻa principles, I would advocate for watershed protection, local food production, and community self-reliance.

    Finally, I would push for transparent emergency preparedness spending, regular infrastructure assessments, and measurable readiness benchmarks.

    Effective climate resilience requires sound science, proactive planning, community participation, and government accountability."

    KEYWORDS: Chapter 127A, Ahupua'a, emergency preparedness
    
- candidate_first_name: Tara Malia
  candidate_last_name: Gregory
  state: hi
  race: Local County Races [All]
  county_race: Honolulu Councilmember  # feel free to remove if not applicable
  district: 4 # string, e.g. 14 or 14A; feel free to remove if not applicable
  party: Non-partisan
  question: hi-q3
  response: |
    "I support prohibiting new industrial-scale AI data centers in Hawaiʻi. Our islands have limited land, freshwater resources, and electrical infrastructure. Protecting these resources and the well-being of our residents must take precedence over large-scale industrial expansion.

    I support scientific research and responsible technological innovation. However, supporting technology does not mean accommodating every industrial facility, particularly when large data centers can place significant demands on electricity, cooling systems, water resources, and existing infrastructure.

    I support the intent of Hawaiʻi County's Bill 170 and would advocate for similar protections in Honolulu, with clear definitions distinguishing industrial-scale AI data centers from essential telecommunications, smaller research facilities, and conventional data-processing operations.

    As a Honolulu City Council member, I would pursue appropriate zoning restrictions, environmental safeguards, and transparent assessments of infrastructure capacity, resource consumption, and potential public costs.

    I believe technological progress should be evaluated through scientific evidence, environmental sustainability, and measurable community benefits, not simply economic promises.

    Our land, water, and energy are finite resources. My priority is protecting our ʻāina, maintaining reliable utilities, and ensuring technological innovation serves Hawaiʻi's people without imposing unnecessary environmental or financial burdens."

    KEYWORDS: AI, protect our ʻāina
    
