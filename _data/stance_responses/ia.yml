  response: |
    As a member of the House Appropriations Committee, I have been an advocate for supporting funding for high-quality research to support lifesaving treatments, screening, and prevention. I look forward to doing the same in future Appropriations cycles, including robust funding for cancer research at the NIH, CDC, and National Cancer Institute. 

    I also recently introduced the Cancer Research Trust Fund Act, which would direct a portion of federal funds collected on imported tobacco products to fund cancer research, with a focus on pediatric and rare cancers. Just this year, that would have amounted to $24 million in funding for cancer research.

    Bringing resources back to Iowa for cancer research will continue to be my mission in the U.S. Senate. 

    I have also raised concerns about proposed changes to the federal financial assistance system that could harm the rural communities I represent and the valuable research coming out of Iowa’s universities.

