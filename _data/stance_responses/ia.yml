  date: 2026-10-09
  primary_candidate: false
  response: |
    The cancer rate in Iowa is far too high. It is our job to address and reverse this trend so we can keep all Iowans healthy.  

    I support dedicating funding and resources to improve cancer care regardless of Iowans’ zip code or financial status, this is why I worked across the aisle to introduce the CATCH IT Act. This bill would increase federal support for rural healthcare projects involving preventative health equipment to improve rural access to equipment, like mammogram machines, mobile cancer screening units, early detection tools, CT scanners, and diagnostic ultrasound equipment.

    I also supported the $50 billion that we delivered for rural healthcare in the Working Families Tax Cuts - the largest investment in rural healthcare ever - and am committed to protecting this investment. $209 million has already been deployed in rural Iowa, ensuring that rural families, veterans, and seniors can access the high-quality healthcare they deserve. 

    I am also fighting to improve access for cancer patients to innovative treatments by breaking down financial and geographic barriers to participation in clinical trials; again, your zip code should not determine the quality of care you receive.

- candidate_first_name: Ashley
