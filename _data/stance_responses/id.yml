  question: id-q3
  date: 2026-11-03
  primary_candidate: false
  response: |
    "It’s frustrating to watch Idaho leaders act surprised by wildfire season year after year. Since 2020, it feels like every summer has been a living embodiment of an ashtray. At what point do the adults in the room start proactively planning instead of repeatedly reacting?

    Wildfires impact families, homes, farms, ranches, businesses, air quality, and our natural resources. I would support investing in prevention, responsible forest and rangeland management, fuel reduction, controlled burns when conditions allow, and better coordination between state, federal, and local agencies.

    Research and monitoring should guide those decisions. We need reliable data to identify high-risk areas, understand changing conditions, evaluate what prevention efforts are working, and direct resources where they will have the greatest impact.

    I also believe funding and resources need to reflect the reality of the risks we face. We cannot continue waiting for a crisis to determine whether we are prepared.

    Preparedness isn’t something we should debate after the damage is done. It’s a responsibility of leadership."

- candidate_first_name: Letishia
  candidate_last_name: Silva
