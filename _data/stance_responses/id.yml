  primary_candidate: false
  response: |
    "I don't know if the existing model for Data centers is correct. Just like how IBM mainframes were eclipsed by the Personal Computer, why not look towards distributed computing options? Remember the SETI project, where individual PC users let their computers run overnight handling data, while they were not being used? How come we do not have this distributed computing option discussed anywhere? Moreover, under this system, why not pay the distributed computer users participating? That way average Idahoans have a financial incentive to be pro AI/data center. The tax incentive is ridiculous, just like the small farmer, business owner, etc. The Data centers need to compete in the "free market", if they can't make these project work without Public dollars, then they probably are not viable. Because water is so key, I don't understand why Data Centers are built around the Great Lakes, on in Cities like Detroit? They have urban spaces in desperate need of redevelopment."

