    "Medicaid is the biggest supporter of rural hospitals, we must keep it funded. Some small hospitals may even need grants, or help applying for them. There is a shortage of doctors of all specialties and of nurses and technicians. We should be supporting in-state medical education at all levels. Doctors are reluctant to move to Idaho because of our anti-science, anti-health attitudes. Laws can be changed but it will take a lot more work to change attitudes."
