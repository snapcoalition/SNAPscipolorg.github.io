    "The City of Santa Monica discovered that the number 1 use of water for single family homes is watering the lawn. The created native landscaping guidelines as well as a $5000 grant to remove traditional lawns to this variety or allowing plastic artificial grass, etc. It worked quite well and considering that the dessert climate of Boise is similar, the same program can work here too. Zero flush urinals' and other conservation measures are other options. Because of the strain on water, there needs to be limits on future projects, like both Utah and Arizona have done. Requiring Data centers to recirculate their water in closed loop systems is another policy option."

