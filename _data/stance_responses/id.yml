    "My cousin was a survivor of 3 Nazi concentration camps, and there existed both forced vaccinations and medical experiments. Body autonomy is foundational to being a free individual.  What we saw during covid, reminded me of the Hiv/AIDS pandemic, where by people faced real loss of civil rights due to HIV status. Some great legislation and other protective measures were created to prevent this happening again, and unfortunately, under Covid we repeated the same mistakes from the HIV era. The Amish people are some of the most healthy, disease free people in America and there avoidance of toxic foods and chemicals, including big pharma is the reason why. They are the ultimate control group, which our government is attempting to destroy through prosecution of Amos Miller. He sells natural products, including Raw Milk and big agriculture does not want him to exist because his recall rate is almost nothing. I worked in food packaging for many decades, and after seeing how sausage is made, lunch meat, etc, I became a vegetarian for 6 years."

