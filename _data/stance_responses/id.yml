    "Why not use available technology, such as drones for better monitoring and actual suppression? You could also live stream the coverage the way KTLA does for every major disaster in LA does. I loved watching this because the channel would have on fire experts explaining what is happening and educate you about actions you can take to be better prepared to prevent this disaster. We need to allow for logging and harvesting of forests to prevent out of control fires, and proper abatement around power transmission lines(unlike California). Moreover, I have told the current Attorney General of Idaho to sue California, Washington, and Oregon for the poor air quality we suffer due to their poor forest management. Because of shared resources, we are paying to cover the places, which are not meeting baseline standards.  Another important factor is to limit people from building into chaparral areas. Because of the increasing risk of fire, insurance options is correcting building in the woodland areas anyway. The last thing we need is some state insurance program to facilitate more building here. I know a person in Alabama, who built on Dauphine Island, a hurricane wrecked his house, but he had federal government insurance, so he rebuilt again, and the same thing happened a second time. Rather that have this happen a 3rd time, the Federal Government restricted him from getting insurance if he choose [sic] to build in this high risk area."

