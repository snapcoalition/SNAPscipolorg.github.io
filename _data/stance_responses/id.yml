  primary_candidate: false
  response: |
    "We live in an age of advanced science and technology, yet we’re seeing preventable diseases like measles make a comeback. I absolutely believe individuals and parents should have the freedom to make informed decisions about vaccination. That freedom matters. However, when individual decisions create risks for others, particularly children, immunocompromised individuals, and those who cannot be vaccinated, we have a responsibility to consider the broader public impact.

    I believe we need reasonable, responsible policies grounded in medical research, transparency, and public health data. We should engage communities with concerns, listen without judgment, provide access to credible information, and make sure families understand both the benefits and risks.

    I’m not interested in shaming parents or creating unnecessary government interference. I am interested in protecting communities and preventing avoidable outbreaks.

    Individual freedom and public responsibility are not mutually exclusive. We should be able to respect personal choice while taking reasonable steps to protect the health and safety of others."

- candidate_first_name: Letishia
  candidate_last_name: Silva
  state: id
