  response: |
    "St. Luke's is the largest employer in Idaho and has a damn near monopoly on health care, they need to be investigated for anti-trust and we need more competition. Moreover, I would ban private equity from participating in the Health care sector in Idaho. They have been found purposely closing down hospitals to create scarcity and charge more. If you watch the documentary, "Smartest guys in the room", about Enron. There is a extra clip, where a state official proves Enron is creating market distortions on purpose and that the state of California had the power to turn the power back on, but the Governor chickened out. If there is a crisis or lack of coverage, I would allow an exemption for Vet Hospitals and Clinics to treat humans too.  Most of the drugs the vet uses are the same damn drugs we use (I have been to their factories as part of my packaging work), so this could be a stop gap measure to create more competition in the market place. My Uncle Mark Bloomberg, was the 1991 Florida State Vet of the year and he was also a tenured full professor of Vet Medicine at the University of Florida. He suggested this concept to me, and it is sad how little respect we have for Vets, they have to know so many systems and animals, so they are better than most general practice doctors."

