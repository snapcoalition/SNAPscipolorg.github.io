  response: |
    "Water rights impact Idahoans differently, so I would think decisions about our aquifers must be based on research, reliable data, and measurable outcomes not assumptions.

    I support decisions grounded in research, reliable data, and measurable outcomes. Before changing policies or making new agreements, we need to understand what we have, what is working, what isn’t, and what the long-term consequences will be.

    Agriculture, growing communities, businesses, and the environment all have a stake in this. We need to listen to the people directly affected, evaluate the available science, and find practical solutions that balance those needs rather than automatically putting one interest ahead of another. 

    At the end of the day, this isn’t about picking political sides or industries. It’s about making responsible decisions with the information available, protecting Idaho’s resources, and ensuring the people who call Idaho home aren’t left carrying the consequences of poor planning."   

- candidate_first_name: Letishia
  candidate_last_name: Silva
  state: id
  race: State Senate
  district: 13
  party: Democratic
  question: id-q2
  date: 2026-11-03
  primary_candidate: false
  response: |
    "What frustrates me is that Idaho has been dealing with drought, water shortages, and increasing demands on our resources for years, yet we continue approving major developments without fully accounting for the long-term consequences.

    Like I understand the economic appeal. These projects bring investment, jobs, and opportunities for Idaho’s workforce. I want Idaho to grow, but we have to ask ourselves: at what cost, and who ultimately pays for that growth?

    I don’t believe taxpayers, homeowners, or existing businesses should subsidize the infrastructure, electricity, or water demands of large private developments. Developers should bear the full cost of their resource consumption and the infrastructure needed to support their projects. I would also support reviewing existing tax incentives and requiring measurable public benefits before offering subsidies.

    I’m not opposed to development or economic opportunity. I’m opposed to moving forward without responsible planning, transparency, and accountability.

    We cannot sacrifice our long-term sustainability in hopes of getting ahead economically, only to put Idaho further behind.

    Growth should benefit Idahoans, not come at our expense."

- candidate_first_name: Letishia
  candidate_last_name: Silva
  state: id
  race: State Senate
