  primary_candidate: false
  response: |
    Kentuckians deserve clean drinking water, and protecting that basic necessity should never be a partisan issue.

    I support stronger enforcement of existing water quality regulations, increased monitoring of groundwater contamination, and holding corporations financially accountable for pollution caused by their operations. I would also advocate for investments in cleaning up abandoned mine sites, addressing coal ash contamination, and modernizing aging water infrastructure.

    Our communities should not be forced to choose between economic opportunity and environmental safety. We can respect Kentucky’s coal mining heritage while recognizing our responsibility to protect the health of our families and preserve our natural resources for future generations.

