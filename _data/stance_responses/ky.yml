    Prevention isn’t just smart; it’s essential, especially in a state with some of the country's highest diabetes rates. Public service campaigns and trusted local clinics can go a long way in spreading the word, but they’re even more powerful when paired with policies that make healthy choices easier.
    For example, we could fund more community health workers who meet people where they are—not just in clinics, but at churches, schools, and farmers' markets—to help with blood sugar checks or nutrition coaching.
    We could also incentivize grocery stores and mobile markets to open in neighborhoods without fresh food, and make sure insurance covers nutrition counseling the same way it covers prescriptions.

- candidate_first_name: Jay
  candidate_last_name: Bowman
  state: ky
  race: US House of Representative
  party: Independent
  question: ky-q2
  primary_candidate: false
  response: |
    Clean water isn’t a luxury; it’s a baseline. And in Kentucky, where coal’s legacy runs deep, fixing water quality means tackling both the pollution and the weakened oversight that lets it linger. Restoring the EPA’s authority to step in when states don’t act is a critical move — because no community should have to wait for permission to get safe water.
    Beyond that, I’d push for full transparency: make every coal ash site publicly mapped with real-time water testing data, so people can see what’s in their streams. Pair that with dedicated cleanup funding tied to performance, not promises, and support local water monitors — folks who know their watersheds best — to help track progress. It’s not just about enforcement; it’s about trust.

- candidate_first_name: Jay
  candidate_last_name: Bowman
  state: ky
  race: US House of Representative
  party: Independent
  question: ky-q3
  primary_candidate: false
  response: |
    Building data centers isn't the question, it's how we build them.
    1. Community veto power: Decisions about large data centers must stay local. If local citizens and leaders say no, the answer is no.
    2. Pause and evaluate regulations: Enact a moratorium on new builds. Review how these centers affect local water use and electric bills.
    3. Public hearings: Hold open meetings so the public knows what is happening.
    4. Fair share on taxes: Stop giving massive tax breaks to multi-billion-dollar companies.
    5. Pay for upkeep: Require data centers to pay for the roads, water, and power lines they use.
    6. Smart green technology: Require solar power, battery storage, and closed-loop cooling systems
    7. Grid support: Use smart AI controls so data centers help power the grid instead of draining it.
    8. Decommissioning bond: Require a financial guarantee that ensures the site will be responsibly taken apart and cleaned up when it’s no longer in use. This protects the community and local government from being stuck with the cost if the company walks away.
    9. We need a national plan: Congress must step in with clear rules, and a unified approach: connect local, state, and federal policies to protect every neighborhood.

- candidate_first_name: Jay
