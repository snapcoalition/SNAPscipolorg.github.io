- candidate_first_name: "Megan"
  candidate_last_name: "Wingfield"
  state: ky
  race: US House of Representatives
  district: "2"
  party: Democratic
  date: 2026-08-18
  question: ky-q1
  response: |
    Improving community and preventative health is a top priority, starting with a tiered approach that addresses immediate nutritional needs and long-term healthy habits. To combat rising rates of obesity and diabetes in Kentucky, I support the following evidence-based policies:

      - Ensuring Nutritional Security: We must fully fund essential programs that provide healthy foods to our residents, including SNAP, WIC, and the USDA food programs.
      - Investing in Youth Health: I advocate for increased funding for both research and community programs specifically designed to help school-aged children form healthy habits early in life.
      - Expanding Healthcare Access: I support advancing "Medicaid for All" to ensure every worker can access preventative care without financial hardship. We must also protect rural healthcare infrastructure, as current proposed cuts put 35 rural Kentucky hospitals at risk of closure.
      - Improving Community Accessibility: Our strategy must ensure that all households in need have physical and financial access to both nutrition and community health programs.

- candidate_first_name: "Megan"
  candidate_last_name: "Wingfield"
  state: ky
  race: US House of Representatives
  district: "2"
  party: Democratic
  date: 2026-08-18
  question: ky-q2
  response: |
    Addressing Kentucky’s water quality degradation, particularly the contamination from coal ash dumps and acid mine drainage, requires a commitment to evidence-based governance and technical precision. My policy approach centers on the belief that we must ensure we have dedicated experts in these fields on staff to manage these complex environmental threats. While I am clear on the end result we must accomplish—clean, safe groundwater and streams for every Kentuckian—I recognize that achieving this requires a team of specialists to ensure we are giving our Commonwealth the best possible chance at a successful recovery.

    To effectively address these challenges, I would implement the following policy framework:

      - Expert-Led Oversight: I will prioritize the recruitment and retention of environmental scientists and hydrologists within our state agencies to oversee the remediation of coal ash sites and acid mine drainage.
      - Accountability for Polluters: We must ensure that those responsible for environmental degradation are held accountable. This includes strengthening protections against coal companies that have historically been permitted to ignore safety rules or bypass critical environmental safeguards.
      - Infrastructure Investment: I support leveraging federal and state resources to modernize water treatment facilities and implement advanced filtration systems in communities currently impacted by legacy mining contaminants.

    Ultimately, protecting our water is about protecting the health and economic future of Kentucky families. By empowering a team of experts to guide our regulatory and restoration efforts, we can move past political rhetoric and deliver the practical, science-based solutions our communities deserve.

- candidate_first_name: "Megan"
  candidate_last_name: "Wingfield"
  state: ky
  race: US House of Representatives
