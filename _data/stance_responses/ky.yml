    I support responsible economic development and recognize the opportunities that emerging technologies can bring to Kentucky. However, those opportunities should never come at the expense of our communities, natural resources, or taxpayers.

    I support requiring independent environmental impact assessments, transparent reporting of water and energy consumption, and meaningful opportunities for public input before major data center projects are approved. Developers should also be responsible for the infrastructure costs their facilities create, rather than passing those expenses along to Kentucky families through higher utility bills.

    Additionally, I believe any public tax incentives should be tied to measurable benefits, including permanent local jobs and enforceable commitments to our communities.

    Economic development must benefit the people who live here, not simply the corporations investing here.

