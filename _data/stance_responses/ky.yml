  response: |
    I believe vaccine hesitancy is partly a reflection of the loss of trust in our government and public institutions, and that is very sad to me. We need to begin rebuilding that trust with our people.

    Social media makes it easy to receive an overwhelming amount of information at once, and it can be difficult to know what to trust. People deserve accurate information so they can make informed healthcare decisions alongside their medical providers. We should address their concerns honestly, rely on established medical evidence, and work to rebuild public trust rather than dismiss people who have questions.

    At the same time, when pharmaceutical companies charge outlandish prices for medications people depend on to live, we cannot ignore why people may be skeptical of the healthcare system. Affordability and transparency are so important to ensuring Kentucky is healthy.

    I would encourage more community town halls where people feel comfortable expressing their concerns and can hear directly from qualified medical professionals. I would also support community vaccination clinics that make recommended vaccines more accessible to families, seniors, and residents in rural communities. Rebuilding trust takes time, honest communication, and a willingness to listen.

