  date: 2026-08-06
  primary_candidate: true
  question: ky-q1
  response: |
    Obesity is no doubt, a combination of diet, exercise, DNA. Much can be said about diabetes and heart disease too. On the one hand, I firmly disagree with the RFK Junior’s school of thought that pedals every imaginable snake oil to solve medical problems. The human body is a chemical engine. Therefore, we must understand all of its parts from a scientific point of view as well as how they relate with each other. Personally, I prefer to see more farmers markets, more fresh fruits, and vegetables, grown in Kentucky, landing on our meal plates. Less processed food is no doubt the better road to travel. Kentucky has a very unique mountain culture from the 37 eastern counties. Our ancestors maximized the use of the land for centuries and funny enough that diet was extremely healthy. Our modern diet might taste good because it’s loaded with sugar, but health wise it totally sucks. More to the point one of my main campaign pillars is that I advocate for a new medical approach addition to our nationwide system of healthcare. We need free preventive healthcare screening for all of our citizens. This can be paid for by Medicare, Medicaid and insurance policies, but ultimately the federal government has to look after the health of our citizens. My program basically says let’s get anyone who has any reason to believe whatsoever that they have an issue to go see a doctor for an examination and diagnosis which will be free. Why? If we catch disease early and can prevent it and or cure it, which is much more likely at an early stage then all of the really bad and expensive ramifications on the backend can be avoided. The basic example is changing the oil in your car. If you do not change that oil and or add oil at some point that engine is gonna freeze up, perhaps explode and turn a $20-$30 oil job into a total loss for that automobile. The human body is no different. So in scientific terms, the answer is, we must follow the evidence that all of our scientific avenues are able to turn up regarding the human body and this maintenance. The most common example on this free preventive healthcare question is of course something like cancer. Cancer is caught at stage one chances of beating that cancer and living at least the normal average lifespan is pretty certain however, if that cancer is not called early say not until stage three or four then often the patient has a few months to live. The system must be retold to prevent harm and not just to try to hopelessly repair harm that has already taken its toll.

