    Education and access go hand in hand. Right now, with only 43.8% of adults in Kentucky getting the flu shot, we’re leaving too many people exposed. Free, no-barrier clinics are a start — like offering vaccines at food banks, transit hubs, or community centers — but we can’t just wait for people to show up. We need trusted voices, like local pharmacists, faith leaders, or school nurses, to help explain how the shot works and why it’s safe, in plain language.
    We could also make it easier to act by sending text reminders with a one-tap option to schedule a shot nearby — not a pushy ad, but a simple “Your spot’s ready” from a source people already trust.

