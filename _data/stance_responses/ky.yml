    I believe preventative healthcare should be a priority in Kentucky. We cannot expect healthier communities if families cannot afford medical care, nutritious food, or routine screenings.

    I support expanding access to affordable preventative care, strengthening community health departments, and increasing funding for diabetes education, early detection, and nutrition programs. I also support improving access to healthy foods and safe recreational spaces, particularly in rural communities.

    Preventing illness is not only about improving quality of life; it also reduces long-term healthcare costs. My goal is to make it easier and more affordable for Kentucky families to stay healthy rather than waiting until they become sick to receive care.

