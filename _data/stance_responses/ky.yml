    I have a page on my campaign website, devoted to data centers. It would be a wise idea to at least listen to the short video on that particular page. But the basic idea is Kentucky is the wrong place for data centers. They don’t produce lasting jobs. They consume huge amounts of water and electricity. Animal populations are badly impacted. This whole data center industry is the main reason why utility bills are going through the roof across the country. Data centers can be made smaller. Every home computer can be turned into a micro data center. See my video link for more analysis. https://www.robertquigleyforcongress.com/data-centers

- candidate_first_name: "Robert"
  candidate_last_name: "Quigley"
  state: ky
  race: US House of Representatives
  district: "6"
  party: Write-In
  date: 2026-08-06
  primary_candidate: true
  question: ky-q4
  response: |
    First RFK Junior is a total whack job. Generally speaking, why would anybody not use modern advances in medicine a.k.a. vaccines and treatments to improve the chemical engine that we call the human body. It makes no sense to me. I think there’s a great deal of recent confusion because of Covid. Let me explain.

    In 2020 just as Covid was raging in China and beginning its spread around the world I was at a business meeting with one of my associates, whose family owns a fireworks factory just outside of Wuhan. Within a few days me and a couple of friends that hung out after the meeting came down with the worst flu that we had ever had in our entire lives. To make a long story short, we had contracted Covid. I also contracted it two more times over the next seven or eight months with the Infection being about 50% less severe then the previous infection. Then all of a sudden there was no more infection. During this whole time neither my wife nor our four dogs nor the inside cat nor the dozens of outside community cats came down with Covid. We never took the vaccine, but in our case, the issue was very simple. Why take a vaccine when our natural bodies were able to handle the virus? My wife never even had a sniffling nose nor a cough or a sneeze so some people have natural immunity and others do not. As it turns out people who died almost without exception, had a compromised immune system in some form or fashion or another. Or they just simply had the wrong DNA in relation to that virus.

    Now this happened to millions of people and we know that the human body has the potential to carry defenses to covid.

     The problem is taking this one example and then saying all vaccines are bad is ridiculous. Both the geological DNA evidence as well as all of the data that was collected around the world during the latest outbreak tells us a science based story.

    It also didn’t help matters that the Covid vaccine seemed to have been rushed through a process that normally takes 20 years and it was pressed into service in a few months. So on the one hand it is very natural to understand the publics suspicion of modern medicine. But the reality is, we should have faith and confidence in our medical institutions. They might be too expensive and they might be provided with incorrect delivery processes, but they are making great progress managing our chemical engines a.k.a. our bodies.

    In terms of policy choices then the group of vaccines that I took as a young boy born in 1966 should absolutely be mandatory. Of course, once a person turns 18 it is their life and hence their decision. But the evidence of our own lives shows that childhood vaccines have extended life and prevented a huge amount of illness.

