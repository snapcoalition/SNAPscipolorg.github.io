    I finally believe that we must reforest and re-wild the land that we call Kentucky. Nature has blessed us with some of the best natural resources in the country, but they either go unnoticed, abused, or simply not looked after in a proper way. So the simple answer is we must use federal resources to clean up all waterways, all forests and all parts of the state specifically. Why? The list of benefits from a healthy land touches every part of our lives. It would take all day to list the benefits derived from reforesting, rewilding  and cleaning up the natural environment, but it only takes one or two sentences to describe what happens if we don’t. Look around the galaxy and the universe. Do we see life on barren planets? Obviously no so the fate of our environment and planet is the fate of humanity. Clean it or lose it.

