    We need to focus on the actual issues behind the data center conversations, and that starts with a commitment to open and transparent governance when it comes to data center contracts. These projects often involve foreign interests and massive corporate giveaways that have been forced into Kentucky communities without ratepayer protections or public input.

    I support policies that prioritize community-led decision-making and mandatory disclosure regarding what these data centers are for. We are not anti-technology, but we are pro-communities making their own decisions about their resources. For too long, the people who have to live with these projects, our workers, farmers, and local leaders, have been excluded from the process. These policies are right for Kentucky because they shift the focus back to public interest and ensure that any development deliver real benefits, respect our community, and improve our quality of life rather than just serving special interests.

