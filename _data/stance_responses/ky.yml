     I believe healthcare is a fundamental right. To combat falling vaccination rates and manage infectious diseases effectively, my policy platform focuses on expanding healthcare access and restoring trust through equitable, community-driven care. If elected to Congress, I would advocate for the following:

      - Expanding Access to Care: I advocate for Medicaid for All to eliminate financial barriers to routine preventative care, including vaccinations. This is critical as current proposals threaten to cut Medicaid funding, which would place over 200,000 Kentuckians at risk of losing coverage.
      - Protecting Rural Healthcare Infrastructure: Addressing vaccine hesitancy requires stable local medical infrastructure. Current budget projections show that proposed cuts place 35 rural Kentucky hospitals and 20,000 healthcare jobs at risk; I am committed to protecting these facilities to ensure localized access to medical treatments and public health education.
