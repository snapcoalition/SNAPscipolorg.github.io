    Trust was not lost. It was spent.

    During COVID, guidance changed without anyone explaining why it changed, disagreement got treated as heresy, and value judgments about tradeoffs were announced as though they were scientific findings. People noticed. You do not win that back with a better communications strategy.

    You win it back three ways. First, honesty about uncertainty. “This is our best estimate, and here is what would change it” holds up over time. “The science is settled” does not, and when it turns out it was not, you have spent credibility you needed later.

    Second, a clean line between what the evidence shows and what we ought to do about it. The first is the researcher's work. The second is a political judgment belonging to officials who answer to voters. In my experience, scientists are more persuasive, not less, when they respect that line.

    Third, local messengers. People in Cabarrus County trust their family doctor, their county extension agent, and the researcher who lives down the road far more than they trust a federal agency. I would rather fund ten of those relationships than one more national campaign.

    And I would be glad to sit down with the researchers in Kannapolis. Showing up is most of it.

