    North Carolina's greatest economic asset is its people. If we want to remain a national leader in biotechnology, life sciences, and technology, we need to start preparing students for those opportunities well before they reach college.

    I would support stronger partnerships between K–12 schools, community colleges, universities, and local employers to expand STEM education, career and technical education, internships, apprenticeships, and hands-on learning. Community colleges, in particular, can serve as a bridge between students and the high-demand jobs being created across our state. I believe they will play a vital role in workforce preparedness for our younger generations.

    At the local level, Raleigh can help bring schools, employers, nonprofits, and higher education institutions to the same table and make sure students from every neighborhood — including students who may not see themselves as future scientists or technologists — have access to these opportunities.


    We should make sure that North Carolina's innovation economy creates pathways to the middle class and robust opportunities for North Carolinians who are growing up here.

- candidate_first_name: Clark
