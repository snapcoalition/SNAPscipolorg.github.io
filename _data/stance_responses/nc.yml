    North Carolina is one of the top data center destinations in the country right now, and Duke Energy has been asking regulators for double-digit rate hikes — as high as 18% at one point — while projecting billions in new grid investment driven largely by data center demand. Families in this district are being asked to subsidize infrastructure for companies that can well afford to pay their own way. Complicating the issue is that we don’t fully understand the long term impacts to the health of those living in the vicinity of data centers, but the possibilities - which include impacts on cardiac health, breathing issues, cognitive difficulties and more - are too extreme to be acceptable. Finally, we are fortunate to live in a beautiful state, but data centers pose real threats to our water systems, our air quality, our wildlife and our land.

    Any new data center permitted should have to clear three tests: What's the water impact on local systems, especially in counties already managing supply constraints? What's the actual net job and tax benefit to the community versus the infrastructure and health costs it imposes? So far, data center developers have had trouble accurately and in some cases honestly answering those questions, and I think individual counties should impose strict requirements for these answers before even considering a data center proposal. I also support moratoriums on new data center construction as needed in order to prevent corners from being cut and to allow local residents to voice concerns.

