  date: 2026-09-09
  primary_candidate: false
  response: |
    Government has a responsibility to protect public health, particularly when individuals and communities are exposed to risks they cannot reasonably control on their own. Environmental health is a major part of that responsibility.

    I support strong laws and enforcement standards that protect communities from PFAS contamination, asbestos exposure, unsafe drinking water, air pollution, and other environmental hazards. Economic development should never come at the expense of the health and safety of the people who live nearby. Businesses and developers should be held accountable for preventing environmental harm, addressing contamination they cause, and helping cover the cost of remediation rather than shifting those costs to taxpayers.

    I also support maintaining access to vaccines, disease-prevention programs, public-health education, and emergency-preparedness resources so families can make informed decisions and communities are prepared to respond to outbreaks, natural disasters, and other public-health emergencies.

    At the legislative level, I would support stronger environmental safeguards, routine testing and public disclosure of health risks, adequate funding for state and local public-health agencies, and meaningful penalties when businesses violate health or environmental standards. Protecting public health and supporting economic growth should not be competing priorities. We can encourage development while still requiring companies to operate responsibly and protect the communities in which they do business.

