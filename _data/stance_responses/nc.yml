    I will advocate for adequate funding for County Health and Human Services, emphasizing disease prevention (free immunizations, needle exchanges, public education about hygiene and available programs) and early intervention (improved access to health clinics) to reduce costs. I will evaluate if we can increase the number of regional clinics and expand telehealth options so that a sick person doesn’t suffer unnecessarily or infect others at work, school, or in a bus. Further, I will ensure that appropriate funds are allocated to services such as maternal and child health, and immunizations, with a focus on helping those in greatest need, such as low-income residents. For immigrant communities, I will ensure that there is adequate language support and that these services are suitably advertised (e.g., through radio and social media, partnerships with ethnic stores and places of worship) so that everyone receives public health information and partakes of the available services. I will institute data gathering and analysis protocols to continually track demand for health services to enable dynamic reallocation of resources across the County.

    I will advocate setting up a network of social workers (and volunteers) in each community. This network can help spread the word about the available public health services and encourage participation in them, while also helping individuals with their specific needs, including administrative help in signing up for programs such as Medicaid and CHIP. Federal cuts have made qualification harder but if we can make sure that all who qualify are enrolled, that will benefit them and produce revenue for the County.

    Mental health and substance abuse crises are social work and community challenges rather than police challenges. I will advocate for instituting a system of community social workers. People who need mental health and substance abuse help often need it more than once. Thus, we can acquire data about their specific case along with the social worker adding social knowledge, e.g., about whether they are going through job loss or a divorce. This knowledge can help improve targeting of the services for each incident, including routing mobile crisis calls better, and before an incident occurs, bringing up softer interventions such as alerting a peer volunteer to chat with an at-risk person to ease their anxiety or remind them to take their medication. The idea is to support a 24x7 service while minimizing the involvement of traditional police and healthcare.

    I will support County programs such as One Water that seek to ensure sustainable and safe water options (including PFAS testing). I will work with County Soil and Water supervisors to make sure they have the resources they need and maintain transparency about water quality and supply.

    We need better preparedness for the variety of emergencies that might arise. Hurricanes and tornados can mess with transportation, power, and water, and overwhelm the healthcare system. Heat emergencies are increasingly common; we have cooling stations for people who need them but they may not be adequate and our public communication leaves room for improvement. In addition, the Harris nuclear power station is based in Wake, and we need to be ready for any emergency there.

    I will make sure our emergency services are well-equipped and well-staffed. County services need to adequately coordinate with the services provided by the constituent municipalities.

