- candidate_first_name: Shannon
  candidate_last_name: Bray
  state: nc
  race: US Senate
  party: Libertarian
  question: nc-q1
  primary_candidate: false
  response: |
    North Carolina should welcome technological investment, including data centers and the infrastructure supporting artificial intelligence, but economic development should not depend upon transferring infrastructure costs to families and small businesses.

    Data centers can bring investment, tax revenue, construction, and technology jobs to communities. They can also consume substantial electricity and water and place additional demands on transmission, generation, and local infrastructure. Those costs and benefits need to be evaluated transparently.

    Before major projects receive public incentives or special consideration, communities should have access to credible estimates of electricity demand, water consumption, infrastructure requirements, environmental impacts, and the expected public costs and benefits.

    Where a project creates extraordinary new infrastructure requirements, the entity creating that demand should bear an appropriate share of those costs rather than quietly shifting them onto existing ratepayers.

    I also support encouraging technologies that reduce the resource footprint of computing, including advanced cooling systems, water reuse, energy-efficient hardware, waste-heat recovery where practical, distributed energy resources, and new generation technologies.

    The objective should not be to stop innovation. It should be to make sure North Carolina can support innovation sustainably while protecting residents, natural resources, and the reliability and affordability of essential services.

- candidate_first_name: Shannon
