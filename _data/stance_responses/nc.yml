  response: |
    North Carolina has an extraordinary combination of universities, community colleges, research institutions, biotechnology companies, technology companies, agriculture, healthcare systems, and advanced manufacturing. Our education system should connect students much more directly to that ecosystem.

    I support strengthening STEM education while expanding practical pathways into science and technology careers.

    That includes partnerships between employers, community colleges, universities, and K–12 schools; apprenticeships and internships; dual-enrollment programs; laboratory and technical education; cybersecurity; biotechnology; advanced manufacturing; artificial intelligence; data science; and industry-recognized credentials.

    Community colleges are particularly important because they can respond quickly to regional workforce requirements without requiring every student to pursue a traditional four-year degree.

    We should also recognize that scientific literacy is becoming important outside traditional scientific occupations. Students entering healthcare, agriculture, manufacturing, information technology, public safety, cybersecurity, or government increasingly need to understand data, statistics, scientific reasoning, and emerging technologies such as artificial intelligence.

    The goal should be multiple pathways to meaningful careers and lifelong learning rather than a single educational model.

- candidate_first_name: Shannon
  candidate_last_name: Bray
