    I have noticed that too many elected officials avoid taking clear positions. When forced to do so, they may express concern (about water quality, privacy, …) without endorsing any specific course of action. Some politicians can get away with boasting that they are not scientists.


    Elected officials owe it to their constituents to make an effort to understand societal problems and the trade-offs between alternative solutions, and to take public positions for which they would hold themselves accountable. If they were to do so, they would need to be virtually forced to bring forth evidence and not rely on magical thinking or vague platitudes.


    Many real situations don’t provide immediate and personal rewards or harms. And, science is not a one-and-done enterprise, so what to scientists is the best feature of science (its ability to self-correct) appears to lay people as a weakness because of its lack of immutability. Thus, interventions such as vaccines or face masks or even Pasteurization can appear unnecessary and this uncertainty can be exploited by anti-science social media personalities to promote snake oil solutions. Public officials can help combat nonsense by highlighting the scientific evidence behind their proposals, while indicating the gaps in current knowledge and how additional knowledge may lead them to withdraw current recommendations.


    A scientific attitude with its emphasis on evidence can apply even to everyday decisions. I am an advocate of people-driven governance and of community engagement. I will investigate online tools that the County can host to help neighborhood communities to deliberate on problems that matter to them and exchange ideas about alternative solutions. When these problems and solutions affect larger regions within the County, they can provide a good starting point for further discussion, e.g., in public meetings. An important component here would be the involvement of scientists with the relevant expertise to provide advice based on the underlying science and help the public understand the consequences of various proposals. This would be a bottom-up approach of rebuilding public trust in science.

