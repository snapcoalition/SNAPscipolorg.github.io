    Data centers can bring investment and economic activity to a community, but those benefits should not come at the expense of residents through higher utility bills, strained water supplies, or environmental and public-health impacts.

    When considering new data centers, I would follow a simple principle: growth should pay for growth. Before approving a project, we should have a transparent accounting of its expected electricity and water demand, the infrastructure required to serve it, its environmental and public-health impacts, and who will ultimately pay those costs. Data centers should be responsible for the infrastructure and resource costs attributable to their operations rather than shifting those expenses onto residential customers and small businesses.

    I would support requiring applicants to disclose projected energy and water consumption, demonstrate water- and energy-efficiency measures, and provide financial assurances for infrastructure built specifically to serve their facilities. Where appropriate, large-load utility rates, impact fees, or other cost-recovery mechanisms should ensure that these exceptionally large users pay their fair share.

    I am also interested in examining whether companies that derive significant economic value from collecting, storing, processing, or monetizing data should contribute additional revenue to the communities that host the physical infrastructure making that activity possible. Any such policy would need to be carefully designed so that it is enforceable and does not simply pass costs back to consumers.

    My goal would not be to prohibit data-center development, but to make sure development is responsible, transparent, and economically beneficial to the community as a whole while protecting affordable electricity, clean and reliable water, public health, and our natural resources.

