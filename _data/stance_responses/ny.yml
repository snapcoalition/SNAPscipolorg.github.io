    I believe New York should outright ban local governments and police departments from contracting with private surveillance companies like Flock.

    Nobody should have their everyday movements tracked and turned into corporate profits just for driving to work, the grocery store, or the doctor. Handing our public infrastructure over to private, out-of-state tech corporations to build an unchecked mass-surveillance network is a direct violation of our basic right to privacy.

    If a municipality uses any public camera systems, they must be publicly owned, locally accountable, and subject to strict rules:

    -Warrants required: Police must have a judge-signed warrant showing probable cause to access any license plate data. No snooping or fishing expeditions.

