  response: |
    New York must protect both public health and farmers’ ability to produce an affordable, reliable food supply. Decisions about pesticides should be based on the strength of scientific evidence rather than political pressure or assumptions that every pesticide is either completely safe or inherently unacceptable.

    I would evaluate independent toxicological research, exposure levels, long-term health studies, environmental persistence, effects on pollinators and other wildlife, and the risks to farmworkers and nearby communities. Regulators should consider the dose, method of application, frequency of exposure, and whether safer effective alternatives are available.

    Where evidence identifies significant risks, New York should restrict or phase out particularly harmful products while helping farmers transition to safer alternatives. Where uncertainty remains, the state should invest in independent research, transparent monitoring, and regular reassessment as new findings emerge.

    Farmers should have access to integrated pest management, technical assistance, and affordable alternatives that protect crop yields. Regulations should be enforceable and understandable, and the public should have access to relevant safety information.

    Fair policy protects consumers, workers, farmers, and the environment together. Food security must never be used as an excuse to ignore credible health risks.

    KEYWORDS: Public health, pesticide safety, food security, independent research.

