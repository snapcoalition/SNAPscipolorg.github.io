    When evaluating restrictions or regulations, I would look to independent scientific research, real-world field data, recommendations from agricultural universities and extension services, and assessments from state and federal regulatory agencies. I would also want input from the farmers who use these products every day and understand the practical impacts of policy decisions.

    If evidence shows a pesticide poses an unacceptable risk, we should take appropriate action. But if restrictions would significantly reduce crop yields, increase food costs, or put family farms at a competitive disadvantage, those impacts must also be considered.

    As an Independent, I support a balanced, science-based approach that protects public health while ensuring New York farmers have the tools they need to remain productive, competitive, and sustainable.

    KEYWORDS: Science-Based Decision Making! Protect Family Farms! Balance! Safety and Food Security! Farmer Input Matters!

