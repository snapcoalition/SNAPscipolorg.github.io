    I support a balanced approach: welcome data centers that provide a clear benefit to the community while requiring developers to bear the costs they create. Companies should pay for needed infrastructure upgrades, meet strong environmental standards, and demonstrate measurable local benefits such as jobs, tax revenue, and community investment.

    I'm also cautious about broad tax exemptions for large, profitable corporations. Any incentives should be transparent, performance-based, and tied to benefits for local residents. If taxpayers are asked to support a project, they deserve a clear return on that investment. New York is currently considering repealing certain data center tax exemptions because of these concerns.

