    Governor Hochul pushing our climate law deadlines back to 2028 is a massive mistake. Working families in our district are already getting hammered by sky-high electric and gas bills. Delaying our clean energy goals doesn't save ratepayers a dime—it just protects corporate fossil fuel profits while our air quality gets worse.

    We need to move as fast as humanly possible. My priority is rapidly scaling up wind, solar, and geothermal right now, keeping our zero-emission hydro and nuclear running so the grid stays reliable, and shutting down dirty plants in working-class neighborhoods. We also need to pass the NY HEAT Act immediately to cap utility bills for working families and stop forcing us to subsidize new gas pipelines we don't even want.

    The evidence guiding my decisions won't come from utility lobbyists protecting their monopolies. It will come from independent climate scientists and grid engineers. Moving to clean energy isn't just about the planet—it’s about breaking up energy monopolies, creating good local union jobs, and actually lowering bills for everyday New Yorkers.

    KEYWORDS: NY HEAT Act, Break Up Monopolies, Public Renewables, Working-Class Jobs

