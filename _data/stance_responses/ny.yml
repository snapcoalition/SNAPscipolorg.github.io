- candidate_first_name: Laurie # this is Bryce's cat. titles and middle names go here
  candidate_last_name: Ryan # used for alphabetical sorting
  state: ny
  race: State Assembly # must match one of the options!
  district: 95 # string, e.g. 14 or 14A; feel free to remove if not applicable
