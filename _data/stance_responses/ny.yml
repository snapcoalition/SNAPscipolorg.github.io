    [Disclosure: I used to serve on an independent ethics advisory council for Axon, one of the companies in this market. That’s exactly why I believe the rules have to bind every vendor, including the ones I’ve advised.]

    License plate readers can help find a stolen car, a missing child, or a hit-and-run driver. That’s real public safety value. But the same cameras also log the movements of every law-abiding driver who passes. In Syracuse, residents learned that their driving data had been searched by agencies across the country, including for immigration enforcement. The city never decided to allow that. The problem in Syracuse wasn’t one vendor. It was the absence of rules. Switching companies doesn’t fix that. Laws do.

    This is what I would support:

    - Short retention. Data that doesn’t match an active investigation should be deleted within days, not stored for years.
    - Narrow, documented uses. Searches should be limited to serious crimes and missing persons, and each one should be tied to a case number. No use for immigration enforcement, monitoring protests, or tracking people seeking reproductive health care.
    - No back-door sharing. Out-of-state and federal agencies should get access only with a warrant. National data-sharing networks should be off by default, and vendors should be barred from selling or pooling data.
    - Audits and public reporting. Every search should be logged and auditable. Agencies should publish annual reports on how many plates were scanned, how many matched, and what the system actually helped solve. Violations should carry real penalties, and;
    - Local consent. No new surveillance system should go up without public review and a vote by elected officials.

    New York’s Legislature already has bills that would set statewide standards, and I’d urge them to pass.

    In Congress, I’d work to require a warrant before federal agencies can obtain Americans’ location data, whether from police or from data brokers. That idea has drawn support from both progressives and libertarian-minded conservatives. Privacy isn’t left or right. It’s American. I’d also attach these same safeguards to any federal grant money used to buy surveillance technology.

    My career has been about making technology accountable to the people it affects. The test is simple: if a tool keeps us safe, it can survive rules that keep us free.

