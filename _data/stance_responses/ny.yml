    In June 2023, New York City’s sky turned orange and asthma emergency visits spiked across all five boroughs. The research since then gives us a clear lesson, and an honest one.

    Researchers have found real short-term harm: a sharp rise in asthma-related emergency visits on the worst smoke days. Other researchers found that this spike was only slightly higher than on a bad spring pollen day. And no one yet knows the long-term effects. I take both findings seriously. That points to a strategy of smart preparation, not panic: invest in measures that protect people from smoke, and that also pay off on high-pollution, high-pollen, and extreme-heat days.

    To address this, I would invest in a few things. First, I would invest in clean air where people spend their days. Upgrade air filtration in public schools, senior centers, and public housing. Better filters protect children from smoke, and also from everyday pollution and respiratory viruses. Second, I would provide help for the most vulnerable households. Provide air purifiers to low-income families with asthma or heart and lung disease, through Medicaid and public health programs. Asthma doesn’t fall evenly on New Yorkers, and our response shouldn’t either. Finally, I would clean air centers, using the cooling center model so people without good ventilation at home have a safe place to go during bad air days.
    Protections for outdoor workers. Delivery workers, construction crews, and sanitation workers can’t stay inside. Clear rules for masks, breaks, and adjusted schedules during hazardous air protect them.

    In Congress, I’d protect the federal systems that make all this possible: air quality monitoring, smoke forecasting, and public health tracking. I’d also support stronger U.S.–Canadian cooperation on wildfire prevention and response. And I’d keep working to cut the emissions that are making fire seasons longer and more severe.

