    Farmers feed us, and they deserve tools that work. Farmworkers and rural families deserve not to be poisoned by those tools. I don’t believe we have to choose. But I do believe that when the evidence points to serious harm, the burden of proof should shift to whoever profits from the risk, not to the people bearing it.

    I would weigh five kinds of evidence. First, health outcomes in the people most exposed, including long-term federal studies that have followed tens of thousands of farmworkers, pesticide applicators, and their families for decades. Second, the regulator’s own record, including where federal reviews are incomplete, delayed, or under challenge in court. Third, what peer nations have decided; when dozens of countries ban a product, that doesn’t settle the question, but it tells us where to look harder. Fourth, real-world alternatives: for each crop, what replaces the product, at what cost, and with what effect on yields. Cornell’s integrated pest management research gives New York a strong base here. And fifth, who carries the risk. The heaviest exposure falls on farmworkers, many of them low-wage and without a strong voice in the policy process, and they should be at the table.

    Applied to paraquat, the case for acting is strong. The bill before the Legislature would ban it starting in 2028. Paraquat is already restricted federally because it is so acutely toxic, and studies link exposure to Parkinson’s disease. It’s banned in the European Union, the United Kingdom, China, and Brazil, and no paraquat products remain registered in Canada. Meanwhile, the federal review has been reopened and could take years. A phase-out with a clear date gives farmers time to adjust, and I’d pair it with technical help and cost-share funding so the transition doesn’t fall on small family farms.

    Going forward, my principle is that every product gets judged on its own evidence, not with blanket bans or blanket approvals. Where the data shows serious harm and workable alternatives exist, phase it out. Where the science is uncertain, fund the research and monitor exposure, so the next decision is better informed. In Congress, I’d fight to protect states’ right to set stronger protections, fund faster and more transparent federal pesticide reviews, and expand USDA support for farmers adopting safer pest management. Concern about pesticide safety now crosses party lines, and that’s a coalition worth building.

