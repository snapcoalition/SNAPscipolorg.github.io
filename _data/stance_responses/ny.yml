  response: |
    As an auto shop manager and renter, I see working families in our district already squeezed by high electric bills, and feel the same pain. We can't allow tech monopolies to privatize profits while dumping their resource and infrastructure costs onto everyday New Yorkers.

    I support immediately repealing state tax exemptions for data center equipment. If any new data center is permitted, it must meet three non-negotiable conditions:

    1. Ironclad environmental guarantees: Facilities must run entirely on dedicated, on-site clean renewable energy with zero strain on local water supplies or New York’s CLCPA climate targets.

    2. Full corporate liability: Owning corporations must be legally and financially liable for 100% of grid upgrades and utility cost increases, ensuring working-class ratepayers never pay a single dime for their power draw.

    3. Community profit-sharing: We must mandate community wealth models where profits and municipal revenues generated from the facility are returned directly to the host municipality and neighborhood residents through local dividend funds and neighborhood improvements.

    True innovation serves the public good, not corporate greed. If tech giants want to build in New York, they must enrich the community, not exploit it.

    KEYWORDS: Ratepayer Liability, Community Wealth Sharing, Environmental Mandates, End Corporate Subsidies

