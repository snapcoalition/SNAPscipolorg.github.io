    Passing the Birds and Bees Protection Act was a great step, because if we poison our pollinators and our soil, our food supply collapses anyway. But we can't just ban things and leave independent family farmers out to dry.

    If science shows a pesticide is too dangerous for our drinking water or our farmworkers, we have to pull it. But the state has to step up and financially support small local farmers so they can afford to transition to safer pest management without losing their livelihoods. We can protect our food supply by backing family farms and listening to real scientists, not by giving giant agribusinesses a free pass to spray whatever they want.

    KEYWORDS: Independent Science, Protect Family Farms, Farmworker Safety, Hold Chemical Giants Accountable

