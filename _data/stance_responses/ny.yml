    The question isn’t whether New York builds the infrastructure of the AI economy. It’s who pays for it and who shares in what it earns.

    Right now the deal is lopsided. Data centers bring real construction work and real investment. But once a facility is running, it employs relatively few people. Meanwhile, families risk paying more on their utility bills for the grid upgrades these facilities need. Our sales tax exemption was written for the dial-up era, and it now subsidizes some of the richest companies in the world. When the profits are private and the costs are public, I call that an extraction economy. We can fix it without shutting the door on innovation.

    I support the Governor’s moratorium as what it is: a one-year pause to set standards. It is not a ban. When it lifts, I’d build on four principles.

    Pay your own way on power. If a facility makes the grid bigger, it pays for the upgrade, not the ratepayer. Michigan already requires data centers to pay higher rates in exchange for its tax break. Its law passed with bipartisan support. That is a working model.

    Replace blanket exemptions with earned incentives. Tax relief should be tied to permanent jobs, prevailing wages, and local hiring. It should come with clawbacks if those promises aren’t kept. Today it is handed out automatically.

    Disclose energy and water use. Communities can’t negotiate a fair deal without facts. Every large facility should report what it consumes.

    Put communities and workers at the table. Hosting communities should get binding benefit agreements, and construction should come with project labor agreements.

    In Congress, I’ll work to put ratepayer protections into federal law, so that large energy users carry the costs they create in every state. I’ll also push for national energy and water disclosure standards, and invest public dollars in public-interest computing rather than private windfalls.

    FDR built the Tennessee Valley Authority so that power would serve the people of the valley. Our standard for the AI buildout should be the same: build it, and make sure New Yorkers share in it.

    KEYWORDS: Ratepayer protection, Pay your own way, Earned incentives, not blanket exemptions, Extraction economy, Public costs, private profits Pause, not a ban, Shared prosperity / share in the gains

