    Prioritize all, but for certain, stop blocking natural gas plants. New gas electric plants are far more efficient and cleaner. Gas plants provide reliable stable electricity to the grid that is essential to grid stability particularly during peak use times. This is the single quickest to market, safest, reliable solution available to us. We should also act quickly to begin development of 2 or 3 nuclear plants. Given long lead times on nuclear, slow development solar and wind, gas is the near term solution. 

    NY ISO reports tell us that NY generation capacity is shrinking, solar and wind cannot be built fast enough, solar and wind do not provide stable electric generation capacity and cannot replace nuclear or natural gas. The reports also tell us NY is on a dangerous path as black-out risk is increasing and destined to get worse. As we slowly and effectively build out solar and wind, we need to develop more gas. fired generation plants as well as add a few nuclear plants. As nuclear plants are opened, older less efficient natural gas plants can be retired. The urgency is mounting and that is probably why Hochul finally decided to delay the CLCPA green implementation timeline. I fear this is not enough as electric generation capacity will continue to decline without new natural gas capacity coming on-line.

    Many states are well on their way to deploying nuclear power via small modular reactor (SMR) technology. NY needs to get on board with this proven nuclear tech as it is the cleanest solution available, portable, scalable, and safer and quicker to market (compared to traditional nuclear).

