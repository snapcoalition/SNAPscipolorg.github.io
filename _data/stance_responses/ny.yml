    New York's climate goals are important, but we can't ignore the reality that families and businesses are already struggling with high energy costs. The transition to a lower-carbon economy must be driven by results, not arbitrary deadlines. The CLCPA set ambitious targets, including 70% renewable electricity by 2030 and 100% clean electricity by 2040.

    I would prioritize preserving and expanding nuclear power, maintaining hydropower, investing in renewable energy where it makes sense, and upgrading our electric grid and energy storage capacity. At the same time, natural gas will continue to play an important role in maintaining reliability until replacement technologies are proven, affordable, and available at scale.

    The evidence guiding my decisions would be straightforward: energy affordability, grid reliability, emissions reductions, and economic impact on families and employers. If a policy reduces emissions but dramatically increases utility bills or threatens reliability, it needs to be reevaluated.

    As an Independent, I believe New York should pursue cleaner energy responsibly, balancing environmental goals with the need for affordable and dependable power that supports economic growth.

