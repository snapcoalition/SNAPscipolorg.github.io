    I get the sense that New Yorkers want three things from their power: (1) that it’s affordable, (2) that it stays on, and (3) that it doesn’t make their kids sick. Those goals only conflict when we plan badly. My test for every energy decision is all three at once, measured by evidence.

    Now through 2028, I do think we need to finish what we started, and keep the lights on. The cheapest, cleanest power is power we don’t waste. So I’d lead with efficiency, weatherization, and demand response, and target them first to low-income households carrying the heaviest energy burdens. At the same time, we should bring online the projects already built or under way, like:

    - the Champlain Hudson line, now delivering Canadian hydropower to the city;
    - offshore wind under construction off Long Island; and 
    - battery storage to replace the dirty peaker plants in neighborhoods like Sunset Park and the South Bronx.

    We should also keep our existing nuclear plants running. And we should retire fossil plants only when the grid operator confirms that replacements are actually online. Closing a plant before then is a promise, not a plan.

    Beyond 2028, I do think we need to start building the backbone. That means new transmission connecting upstate generation to downstate demand. It means new nuclear capacity, which the state has already begun pursuing, as a firm, zero-carbon complement to wind and solar. And it means a cap-and-invest program in place by the 2028 deadline, with revenue returned directly to households so that cutting pollution lowers bills instead of raising them.

    I’d measure every option against four things:

    the grid operator’s reliability margins;
    the full cost per delivered megawatt-hour, including transmission and backup;
    bill impacts on the lowest-income families;
    health outcomes in the communities that have breathed our pollution for decades.

    In Congress, I’d protect permitted offshore wind projects from political stop-work orders. I’d also back bipartisan work on nuclear licensing and transmission permitting. Republicans and Democrats have already found common ground on both.

    KEYWORDS: Affordable energy; reliable power; clean air; grid reliability; energy affordability; clean energy; CLCPA; climate law; cap-and-invest; household rebates; energy efficiency; weatherization; demand response; low-income energy burden; peaker plants; battery storage; Champlain Hudson Power Express; hydropower; offshore wind; nuclear power; existing nuclear; advanced nuclear

