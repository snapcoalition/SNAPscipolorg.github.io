    New York is one of the great talent magnets in the world. Nearly 138,000 international students study here, and most of them study science, technology, engineering, and math. Many stay to start companies, staff our labs, and teach the next generation. When federal policy makes it harder for them to come or stay, New York’s research and innovation economy pays first.

    Security and openness can go together. Rigorous vetting is a legitimate national interest, and I support it. But the new federal rule caps student stays at four years, while most doctoral programs and many postdoctoral appointments run longer than that. A rule that forces our best researchers to reapply in the middle of their work doesn’t make us safer. It makes us less competitive.

    New York should start by helping students navigate the new rules. SUNY and CUNY should give every affected student clear guidance on the new extension process, so no one falls out of status because of a paperwork deadline. The state should also track enrollment, research output, and workforce changes in real time, so policy responds to evidence rather than anecdotes. And we should treat the loss of international talent as a warning about how thin our domestic pipeline has become. New York should expand STEM pathways for first-generation and community college students, especially at CUNY and SUNY, so they are first in line for the opportunities a stronger science economy creates.

    In Congress, I would push to align the four-year cap with the real length of doctoral and research programs, and to require clear standards and a chance to respond before any visa is revoked. I would support bipartisan efforts to offer a path to permanent residence for advanced STEM graduates, because we shouldn’t train the world’s best scientists and then send them to our competitors. And I would reform high-skill visa programs so wages reflect real market rates, so international talent strengthens American jobs rather than undercutting them. That last point matters. Openness to talent and protection of American workers aren’t opposites. Both depend on rules that are fair and enforced.

