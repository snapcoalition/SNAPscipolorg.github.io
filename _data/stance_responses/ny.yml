    Public safety and personal privacy are both important, and we shouldn't have to choose one over the other.

    Automated License Plate Reader (ALPR) technology can be a valuable tool for locating stolen vehicles, finding missing persons, and helping law enforcement solve serious crimes. However, its use must be limited, transparent, and subject to clear oversight to protect the privacy rights of law-abiding citizens.

    I would support legislation that establishes statewide standards for how ALPR data is collected, stored, shared, and retained. Data should only be accessible for legitimate law enforcement purposes, retained for a limited period of time, and protected from unauthorized access. There should also be transparency requirements so the public understands how the technology is being used.

    I do not support the creation of a mass surveillance system that tracks the movements of citizens who are not suspected of criminal activity. Access to data should be restricted, audited, and subject to strict penalties for misuse.

    As an Independent, I believe we can strike the right balance: give law enforcement effective tools to keep our communities safe while protecting the constitutional rights and privacy of the people they serve.

