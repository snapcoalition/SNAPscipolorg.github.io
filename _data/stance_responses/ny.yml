    I’ve spent months on this issue. I spoke at the Cheektowaga Town Board against expanding our Flock contract, and I’ve pushed with local candidates for real oversight. Last month, a Cheektowaga police officer and dispatchers were accused of using Flock cameras to track a fellow employee. That’s exactly the kind of misuse people have been warning about.

    Plate data shows where people go: to the doctor, to church, to a protest, to a friend’s house. That information should stay under tight local control, and federal agencies should never be able to search it without a warrant. When data gets shared through national networks with little oversight, New Yorkers lose control over who sees it and why.

    If elected, I will co-sponsor the Hinchey-Hunter bill (S9890/A10808). It would require plate data to be deleted within 48 hours by default, ban sharing outside New York government except under a felony warrant, require annual public reporting on how cameras are used, and make illegally obtained data inadmissible in court.

    I’d work to strengthen it in three ways. First, independent audits, because Virginia found dozens of agencies breaking its sharing rules after they passed. Second, a warrant requirement to track any individual’s movements. Third, real penalties for officers who misuse the system, along with competitive bidding and a public hearing before any town signs a surveillance contract.

    KEYWORDS: ALPR, data sharing, cameras
    
