  question: ny-q1
  date: 2026-10-15
  response: |
    New York should put its residents first when making decisions about AI data centers. I oppose allowing large-scale data center construction to proceed without addressing its effects on electricity costs, water resources, the environment, and local communities.

    Technology can create jobs and support innovation, but private companies should not receive public subsidies while residents face rising utility bills or taxpayers absorb the costs of infrastructure expansion. I support reviewing existing tax exemptions and ending subsidies that fail to demonstrate clear, measurable public benefits.

    I would support a moratorium on new data center approvals while New York independently evaluates their cumulative effects on energy demand, water consumption, emissions, and utility rates. Any future approvals should require transparent environmental assessments, meaningful community input, enforceable limits on resource use, and proof that costs will not unfairly shift to households.

    My administration would prioritize investments that create good-paying jobs and improve people’s lives without sacrificing affordability or environmental responsibility. Innovation should benefit New Yorkers, not simply corporate shareholders.

    KEYWORDS: AI accountability; affordable electricity; environmental protection; community oversight.

- candidate_first_name: Jean H
  candidate_last_name: Anglade
  state: ny
  race: Governor
  party: Independent
  question: ny-q2
  date: 2026-10-15
  response: |
    New Yorkers deserve energy that is affordable, reliable, and environmentally responsible. My goal is to reduce dependence on polluting combustion sources while ensuring that families and businesses are not burdened with unaffordable utility bills.

    I would prioritize maintaining safe existing nuclear and hydropower resources, expanding responsibly sited wind and solar, improving energy storage, and investing in energy efficiency and grid modernization. Natural gas and other combustion sources should be evaluated transparently as part of the transition, with reliability and emissions considered together.

    I would establish measurable milestones for the next two, five, and ten years rather than promise a transition on a timeline unsupported by available infrastructure. Major decisions should be guided by independent scientific research, grid reliability assessments, lifecycle emissions data, projected construction costs, and the effects on household utility bills.

    New York should not delay climate protections without explaining the consequences, but implementation must also account for practical constraints and protect working families. Any transition should include public reporting, independent oversight, and assistance for low-income households facing higher energy costs.

    The objective is a cleaner energy system that works for everyone, not one that makes basic electricity unaffordable.

    KEYWORDS: Energy affordability; reliable clean energy; evidence-based policy; grid modernization.

- candidate_first_name: Jean H
