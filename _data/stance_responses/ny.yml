    I support expanding access to disaster assistance, affordable crop insurance, emergency recovery funding, and technical resources that help farms prepare for droughts, floods, extreme heat, and unpredictable growing seasons.

    New York should work with agricultural universities, local extension programs, farmers, and independent researchers to identify which adaptation measures work best in different regions. Potential investments include improved drainage, efficient irrigation, soil conservation, cover crops, weather-monitoring systems, and crop diversification where appropriate.

    The state should establish clear procedures for assessing damage and distributing assistance quickly and fairly, particularly to small and family-owned farms that may lack the resources to recover from a major loss. Programs should be evaluated for effectiveness and accessibility rather than judged by spending alone.

    I would also support better forecasting and emergency communication so farmers can prepare before disasters strike.

    Farmers should not have to face increasingly unpredictable conditions alone. Helping them prepare protects jobs, rural communities, and New York’s food supply.

    KEYWORDS: Agricultural resilience; disaster assistance; soil and water conservation; food security.
    
