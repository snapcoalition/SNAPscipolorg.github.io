    I would direct relevant state agencies and public universities to assess the effects of federal visa changes on research programs, workforce needs, and university finances. New York should coordinate with universities, employers, and federal representatives to communicate the practical consequences of disruptive policy changes and advocate for transparent, consistent rules.

    I would also expand opportunities for New York residents to enter STEM careers through affordable education, apprenticeships, research placements, and workforce training. Publicly funded research programs should emphasize fair hiring, lawful employment, and opportunities for qualified New Yorkers.

    International talent and local workforce development should complement each other rather than be treated as competing priorities. My goal is a fair, competitive scientific workforce that creates jobs, advances research, and benefits New York communities.

