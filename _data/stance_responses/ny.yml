  question: ny-q3
  date: 2026-10-15
  response: |
    Public education should help students and families distinguish reliable scientific information from misinformation while protecting critical thinking, open discussion, and freedom of inquiry.

    I support teaching scientific literacy, including how to evaluate evidence, recognize misleading claims, understand uncertainty, and identify credible sources. Students should learn how scientific conclusions are developed, tested, challenged, and updated as new evidence becomes available.

    Schools should provide age-appropriate information based on current scientific evidence and established educational standards. Teachers should have access to trustworthy educational resources, professional development, and materials that help families understand important public health and environmental issues.

    Public education should not become a tool for partisan messaging or punishment of people who ask questions. Government agencies and schools must communicate honestly about what is known, what remains uncertain, and why recommendations change when evidence develops.

    I would encourage partnerships among educators, universities, public health experts, and local communities to make reliable information accessible to all families, regardless of income or background.

    Trust is earned through transparency, evidence, and accountability. Our goal should be to equip New Yorkers to make informed decisions rather than simply tell them what to believe.

    KEYWORDS: Scientific literacy; critical thinking; transparency; evidence-based education.

- candidate_first_name: Jean H
