    When a late freeze wipes out a cherry crop in Wayne County, the cost shows up in Manhattan too; at the farmers market, the grocery store, and the school cafeteria. This spring, New York farmers lost an estimated $30 million to freezes, hail, and flooding. Our farmers aren’t asking for a bailout. They’re asking for a system built for the weather they actually face.

    Prevention pays, so fund it up front. Every dollar spent before a disaster saves money after one. I’d expand cost-share funding for the tools that protect harvests like: frost protection for orchards; high tunnels and irrigation; drainage and water storage; and soil health practices that help fields hold water in drought and drain it in floods.

    These are proven practices, and Cornell Cooperative Extension (CCE) already helps farmers use them. Extension needs stable funding so every county has the experts farmers rely on.

    Replace debt with real protection. Right now, the main federal response to a disaster designation is emergency loans. A loan helps a farmer survive the season, but it adds debt to a business that just lost its crop. Federal crop insurance has also long been built around commodity crops like corn and wheat. New York grows apples, cherries, vegetables, and dairy, and those farmers often face gaps in coverage. I’d push to make insurance work better for specialty crops and small farms. I’d also support a standing disaster program, so aid arrives in weeks instead of waiting on Congress to pass emergency bills.

    Keep the early warning systems strong. Accurate forecasts let farmers protect their crops before a freeze hits. That means fully staffing the National Weather Service and supporting local weather networks farmers already use.

    Protect the people who do the work. Hotter summers put farmworkers at risk. Clear heat-safety standards protect workers and keep farms running.

    Build steady markets. Programs that connect New York farms to schools, hospitals, and food banks give farmers reliable buyers in hard years. That’s stability for farmers and fresh food for families.

    These ideas have support from farm groups, conservation groups, and both parties. Farming isn’t a partisan issue; it’s a food security issue.

