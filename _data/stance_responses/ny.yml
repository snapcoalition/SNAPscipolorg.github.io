    License plate readers can be a valuable tool for recovering stolen vehicles, finding missing persons, and solving violent crimes faster. But a network that logs where ordinary people drive and shares it across state lines with little oversight calls for clear guardrails, and New York currently has none, so every department and vendor contract sets its own rules. I'd support statewide legislation built on five principles: use limited to defined public safety purposes, not general monitoring; short retention, with data that doesn't match an active case deleted in days, not months; warrants or court orders for sharing with outside agencies, including out-of-state and federal ones, with narrow emergency exceptions and no sale of data to private companies; auditable logs of every search, public reporting, and penalties for misuse; and vendor contracts that keep the data under local government control, with security standards and breach notification. Communities should still decide whether to use the technology, as Syracuse did, but within clear statewide rules that protect both public safety and privacy.
  
