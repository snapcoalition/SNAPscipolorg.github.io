    Young people aren’t rejecting science. They’re drowning in content and starving for trust. The same young adults who get their science from YouTube and TikTok say they trust scientists, doctors, and teachers far more than influencers. That gap is our opening. Public schools are where every child, regardless of zip code or family income, can learn how to tell the difference.

    Teach how to think, not what to think. The most durable defense against misinformation isn’t a list of approved facts. It’s the habit of checking. Students should learn to ask who is behind a claim, what evidence supports it, and what other credible sources say. Some researchers call this lateral reading, and studies of classroom programs have shown measurable gains. This approach earns trust across the aisle because it doesn’t tell anyone what to believe. It gives them tools to judge for themselves.

    Close the trust gap where it’s widest. Young people who aren’t on a college track are less likely to fact-check what they read. They’re the ones a public school system exists to serve first. Information literacy should be part of every high school, not an elective for the lucky few.

    Bring trusted messengers into the room. Young people trust doctors and scientists. So we should connect classrooms with pediatricians, nurses, and researchers, and give families the same access. I support the City Council’s effort to give parents clear, accurate vaccine information, delivered with respect. Parents with questions deserve answers, not judgment.

    Prepare students for AI-generated content. Deepfakes and synthetic text make this harder every year. Students need to learn how these tools work and how to spot what they produce. I’ve spent my career on technology accountability, and I’d bring that to this work.

    In Congress, I’d fight to keep federal science agencies independent and their data public, so teachers and families have honest sources to turn to. I’d also support federal grants for information literacy, structured so local schools design their own programs.

