    Four things, all federal:
    - The Farm Bill funds EQIP and the Ogallala Aquifer Initiative. That is where the money for efficient irrigation in western Oklahoma comes from.
    - The Interior spending bill funds the USGS monitoring that tells us how fast the aquifer is dropping.
    - USDA Rural Development makes the loans that fix leaking water lines in small towns.
    - The water compacts Oklahoma shares with Texas, Kansas, and Arkansas cannot change without the consent of Congress.

    Here is the part that does not come up. The Farm Bill pays producers to use less water through conservation programs. The same bill pays producers more to grow water-intensive crops through commodity supports. Both programs are real, both are funded, and Congress does not require anyone to put the two numbers on the same page. It votes without ever seeing the net figure. It is voting now. The House passed its Farm Bill in April, the Senate released its version in June, and the current law expires September 30. This is the same pattern I described in Questions 1 and 2: a decision with real consequences for Oklahoma, made without the information that would let anyone judge it.

    The second problem is that Congress stopped asking for the data. In 1986, Congress directed USGS to report Ogallala water levels every year. In 1995, it cut that to every two years in a bill about reducing paperwork. Oklahoma’s water was not the subject of that bill. The most recent report, published in 2024, covers water levels through 2019. Oklahoma is making decisions about a shrinking aquifer with numbers that are seven years old.

    Here is what I would support with a federal vote:
    1. Require the net number. Not a mandate on a single farmer. A published figure showing what federal programs, taken together, do to water use in the aquifer states, on the table before the vote, not two years after. No bill requires this today. I would support one, and if nobody writes it, I would.
    2. Restore the annual aquifer report. Congress asked for it every year in 1986. It should ask for it every year again, with a deadline USGS has to meet. I would support that language in the Interior spending bill.
    3. Get the rural water money to the towns that need it. The House Farm Bill includes low-interest loans and loan forgiveness for small-town water system repairs. That money only helps if it reaches towns that cannot staff a competitive grant application. I would support that provision, and I would support directing USDA to reach those towns first.

    On data centers and water, the federal piece is that water rules and power rules get reviewed separately, and I cover that in Question 6.

    I am not putting agriculture against industry here. I am saying the federal government does not currently know whether its own water programs cancel each other out. It should, and Oklahoma should be the state that makes it find out.
  
    **Keywords:** The federal government does not know whether its own water programs cancel each other out. Oklahoma should be the state that makes it find out.
    
