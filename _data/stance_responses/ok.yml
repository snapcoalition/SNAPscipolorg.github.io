    This issue is personal to me. I grew up in a working poor family that depended on programs like WIC and food assistance to get by. My parents struggled to provide healthcare coverage for my siblings and I. I know what it means when a family cannot get the care they need, and I know what it costs them when the system fails. The Medicaid cuts in the federal "One Big Beautiful Bill" are not abstract policy. Oklahoma health care leaders estimate they will cost our state's hospitals nearly $6.3 billion over the next decade. Two rural Oklahoma hospitals have already closed this year. Twenty-two more are at immediate risk. When a rural hospital closes, everyone in that community loses access to emergency care, not just Medicaid patients. As a state senator, I would support the following policies to protect rural healthcare access in Oklahoma: first, I would advocate forcefully to our congressional delegation to reverse the most damaging Medicaid cuts and protect the Rural Health Transformation Fund dollars Oklahoma is entitled to receive. Second, I would support expanding the state's rate floor protections beyond 2028, so that providers in rural communities are not driven out by inadequate reimbursement. Third, I would push for expanded investment in telehealth infrastructure for rural communities, so that distance is not a barrier to basic care. Fourth, I would support workforce pipeline programs that incentivize doctors, nurses, and mental health providers to practice in rural and underserved Oklahoma communities. Healthare is not a partisan issue. It is a survival issue for rural Oklahomans and I will treat it that way. 
    
