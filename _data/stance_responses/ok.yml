    17,000 wells did not get orphaned because nobody studied the problem. They got orphaned because walking away was cheap. My position is that the federal government should make walking away expensive, keep the plugging money flowing, and pass the well-repurposing bill the House already passed.

    Before a company drills on federal land, it posts a bond, which is money set aside so that if the company quits, the bond pays to plug the well. The minimums were set in 1960 at $10,000 for a single lease and $25,000 for all of a company’s wells in a state, and they stayed there for sixty-four years. By 2019, the average bond BLM held was $2,122 per well. Average cleanup ran about $71,000, according to GAO and Interior’s Inspector General. In 2024, Interior finally raised the minimums and tied them to inflation. In June 2026, BLM proposed putting them back where they were.

    That is the first problem. A bond minimum is a number in a regulation, not in law. An agency can leave it alone for six decades, fix it, and unfix it two years later, and Congress never votes on any of it. A fixed minimum is a countdown.

    The second problem is that the money that plugs wells is temporary. The 2021 infrastructure law put $4.7 billion into orphan wells nationwide. In one year, federal dollars plugged 938 Oklahoma wells. State dollars plugged 27. When that money runs out, the plugging rate goes back to what the state can afford.

    Here is what I would support with a federal vote:
    1. Bond to the real cost, in law. Small operators cannot carry a half-million-dollar bond, and Oklahoma runs on small operators. That objection is real. The answer is a bond scaled to what each well will actually cost to plug, indexed to inflation, and written into the Mineral Leasing Act so no agency can quietly reset it. A bill to do this was introduced in the last Congress and has not been reintroduced. I would support one, and if nobody writes it, I would.
    2. Guard the plugging money. Keep the federal orphan well program funded past the infrastructure law, and write the rules tight enough that plugging does not become its own cash grab. I would support that language in the Interior spending bill.
    3. Pass the bill that already passed. In April 2024, the House voted 333 to 75 to have the Department of Energy find abandoned wells, improve plugging, and study which ones can be converted to geothermal. Rep. Bice co-led it, and she was right to. The Senate let it die in committee. Senator Mullin is a cosponsor of the Senate version, S. 818. I would cosponsor the House companion.
    4. Bond every repurposed well. A well that becomes a geothermal well or a storage well is still a hole in the ground with somebody’s name on it. Oklahoma’s HB 3173 says the Corporation Commission “may” require financial assurance on a repurposed well. May. Weak financial assurance is how we got 17,000 wells. Convert every suitable well, and attach a bonding requirement to any federal dollar that helps convert one. I would support that condition in the DOE program above. 

    One more thing, and it is not my vote. All three Corporation Commissioners took hundreds of thousands of dollars from the industry they oversee. None of it is illegal, and that is why the state’s bonding rule stayed weak. That fight belongs to Oklahoma’s legislature, and I would be prepared to introduce that language for any legislator who wants to take it up.
  
    **Keywords:** Federal well bonds were set in 1960 and left there for sixty-four years. A fixed number nobody has to vote on is a countdown.
    
