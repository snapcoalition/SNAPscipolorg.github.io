    Oklahoma’s research universities are an important part of our state’s economy, workforce, healthcare system, and ability to compete for new industries. I would not support an arbitrary, across-the-board cap on research infrastructure reimbursement that fails to account for the actual costs of conducting research. At the same time, I believe universities receiving public funding should be able to demonstrate where those dollars are going and what Oklahoma is receiving in return.

    At the federal level, I support a transparent, negotiated approach to indirect research costs rather than a one-size-fits-all percentage. Research does not happen only at a laboratory bench; it requires facilities, technology, safety and compliance systems, administration, and other infrastructure necessary to support the work.

    As a state legislator, I would support efforts that help Oklahoma universities compete for federal and private research dollars, including responsible state matching investments and partnerships with Oklahoma businesses and healthcare institutions. I would also want strong transparency and performance reporting attached to state research investments.

    My goal would not be for Oklahoma taxpayers simply to replace every federal dollar that might be lost. It would be to protect strategically important research capacity, leverage state dollars to bring additional investment into Oklahoma, and make sure the discoveries happening at our universities translate into jobs, innovation, better healthcare, and opportunities for Oklahomans.

    **Keywords:** * Protect Oklahoma’s research infrastructure * Reject one-size-fits-all funding caps * Transparency and accountability * Strategic Investments 
    
