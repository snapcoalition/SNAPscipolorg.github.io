    I strongly support continued investment in severe weather research and forecasting. Oklahoma experiences some of the most dangerous severe weather in the country, and the research conducted here directly affects public safety, preparedness, and our ability to give people as much warning as possible when dangerous storms are approaching.

    At the federal level, I support continued funding for NOAA, the National Severe Storms Laboratory, and other severe-weather research programs based in Oklahoma. These facilities are national assets, but they are also an important part of Oklahoma’s research economy and scientific workforce.

    At the state level, I would support investments in our universities and research institutions when those investments have a clear public-safety benefit. I would also support using state funding strategically when it can help Oklahoma attract additional federal or private research dollars.

    We should continue improving radar systems, weather-monitoring equipment, forecasting technology, and emergency-warning systems. I would place particular emphasis on rural communities, where residents may have fewer warning resources or communications options available to them. Every Oklahoma community should have reliable access to timely severe-weather information.

    I would also support workforce programs that encourage meteorologists, engineers, computer scientists, emergency-management professionals, and other researchers to study and build their careers here in Oklahoma. Keeping that expertise in our state strengthens both our economy and our ability to protect our communities.

    Finally, I support stronger partnerships among Oklahoma universities, federal researchers, state and local emergency managers, and tribal nations. Research has the greatest public value when discoveries are translated into better forecasts, stronger preparedness, and practical tools that communities can actually use.

    We cannot prevent severe weather from occurring, but we can invest in the science, technology, and people that give Oklahomans better information and more time to protect themselves.
  
    **Keywords:** * Protect Oklahoma’s forecasting infrastructure * Keep scientific talent in Oklahoma
    
