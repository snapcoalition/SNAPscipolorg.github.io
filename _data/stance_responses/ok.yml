    This is my JAM! As a nurse, rural healthcare is not an issue I learned about when I decided to run for office, it is something I understand from working in healthcare and from listening directly to rural Oklahoma communities and healthcare leaders.

    I strongly oppose federal Medicaid cuts that threaten healthcare coverage and the financial stability of rural hospitals. Medicaid is not simply an insurance program; in rural Oklahoma, it is part of the infrastructure that keeps hospitals, clinics, nursing facilities, pharmacies, and healthcare jobs in our communities. When a rural hospital closes, we do not just lose a building… we ultimately lose jobs, emergency care, maternal healthcare, preventive services, and precious minutes during medical emergencies.

