    The question says it plainly: data center development is continuing. One project is proposed in Luther, in this district, and the neighbors are already at the zoning board. Some people would rather stop it all until we know more, and I understand why. But a moratorium is a bet that the building stops, and if the bet loses, Oklahoma has spent its time arguing instead of writing the rules. My position is that the rules should be written now, so that households are not the ones paying when a project’s promises fall short. The company that announces the load should pay for the upgrade, households should never cover the difference, and both rules should be in federal law rather than left to a regulator that can change its mind.

    The question is not whether to want data centers. It is who pays for the grid they need, and what happens when the forecast is wrong.

    Your electric bill is set by the state, and Oklahoma has already acted. HB 2992 requires large loads to pay their own costs, be billed separately, and give 60 days’ notice before buying land. It passed the Senate unanimously.

    The transmission system is federal. The Federal Energy Regulatory Commission, or FERC, decides who pays for a new high-voltage line or substation. That is the half that gets skipped, and it is the half I would have a vote on.

    The risk is one FERC has named itself. A company announces a 1,000-megawatt data center. The utility builds the lines for 1,000 megawatts. Only 200 shows up. The lines are in the ground, and everybody else’s bill pays for them. The risk is not that data centers use too much power. It is that they promise to.

    The rules that decide who pays are being rewritten right now. Last October, the Energy Department directed FERC to write a national rule for connecting large loads, and its proposal would have assigned 100 percent of the upgrade cost to the company that asked for it. In June, FERC chose not to write that rule. Instead, it told each regional grid operator, including the Southwest Power Pool that runs Oklahoma’s grid, to justify its own rules or fix them within 60 days. So the rule that protects Oklahoma households now lives in a grid operator’s tariff, which can change without anyone in Congress voting on it.

    Here is what I would support with a federal vote:
    1. The company that announces it pays for it. The upgrade gets built to the company’s forecast, with the company’s money, before it plugs in. If a company promises 1,000 megawatts and brings 200, that is its miscalculation and its bill. The Energy Department already proposed this. It should be in the Federal Power Act, not in a proposal. I would support that bill, and if nobody writes it, I would.
    2. The public keeps the asset. There is no refund for capacity a company did not use. I would support that as part of the same bill.
    3. Households do not pay for a data center’s load, and nobody subsidizes it. If a data center raises residential rates, the data center covers the difference. If that gets expensive, the company can cool its servers a better way. A company spending billions on one campus can pay its own bill, and any federal help, whether loans, land, or fast-tracked permits, comes with that condition. No protection for households, no federal help. I would support attaching that condition to every federal program that touches these projects.
    4. Households come first when the grid is tight. SPP already does this. Its fast-track service for large loads cuts the data center off before any house. I would support making that the national standard.

    Water is mostly a state question, and SB-259 already handled it: no open-air groundwater cooling, and low-consumptive systems required. The federal point is that water rules and power rules are reviewed separately. Closed-loop cooling saves water and burns more electricity, and the two never get read side by side.

    If the building stops, these rules cost nothing. If it does not, they are the only thing standing between a data center’s forecast and your electric bill.
  
    **Keywords:** The risk is not that data centers use too much power. It is that they promise to. Whoever makes the promise should pay for it.
    
