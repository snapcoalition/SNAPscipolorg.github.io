  response: |
    My position is that tribal nations in Oklahoma should have the same authority to protect their own land and water that tribes in every other state have, and that the federal money for that work should not depend on a number that can change every year without a vote. The way that authority was taken, and the way the money stays thin, follow the same pattern I described in Question 1. Decisions that should have been made in the open were made where nobody was looking.

    The first problem is how that authority was taken away. In 1987, Congress amended the Clean Water Act so that a tribe could apply to EPA to be “treated as a state,” meaning it could set and enforce its own water quality standards on its own land. That change was made in a water bill by a Congress debating water policy. The Pawnee Nation applied in 1998, and after six years of review, EPA approved them in 2004. The state sued, and lost. So the fight moved to Washington. In 2005, less than a year after the Pawnee approval, one of Oklahoma’s own senators added a section to that year’s federal highway bill that applied to Oklahoma alone. Section 10211 requires EPA to let the state run its environmental programs inside tribal land whenever the state asks. It also says an Oklahoma tribe cannot be treated as a state under any EPA law unless it first reaches an agreement with the state, and even then the tribe can only share the program, never run it. None of that was about highways, and none of it was debated as water policy. The Pawnee kept what they had earned, but no other Oklahoma tribe has been able to follow them since. And because it is written into law rather than agency policy, no President and no court can undo it. Only Congress can.

    The second problem is funding. EPA’s General Assistance Program is the main federal funding for tribal environmental work, and it is a single line in the Interior spending bill each year. EPA’s baseline is $110,000 per tribe per year, a figure set in 1998 and never adjusted since. That is roughly one scientist and a truck. And because it is an annual line item, cutting it does not require repealing anything. It requires one number to change in a bill written under deadline.

    The third problem is who is actually failing. In 2017, GAO added federal management of programs serving tribes to its High Risk List. The findings were about federal agencies, not tribes. GAO found that the Bureau of Indian Affairs, a federal office inside the Interior Department that must approve any energy project on tribal land before it can start, had no process and no data for tracking how long its own reviews took. One tribe reported that a review dragged on for eight years and cost it more than $95 million in lost revenue. GAO also found unsafe conditions at schools run by the federal Bureau of Indian Education and weak oversight of hospitals run by the federal Indian Health Service. It listed nearly 40 recommendations. Nine years later, the designation is still there.

    Here is what I would support with a federal vote:
    1. Put Section 10211 to its own vote. Congress made the 1987 decision in the open. If it wants to reverse that for one state, it should do so in the open. No bill repeals Section 10211 today. I would support one, and if nobody writes it, I would.
    2. Write a floor under the General Assistance Program. The Interior spending bill should say “not less than” a set amount for tribal environmental programs, adjusted for inflation, so a tribe’s water monitoring is not one deadline away from disappearing and does not sit at a 1998 number for another 28 years. I would support that language in the bill.
    3. Put a clock on the High Risk List. A 2019 law already requires agencies to report on open GAO recommendations. It has not worked. Every open recommendation should carry a deadline and a name, and the agency should answer for it every year until it closes. I would support that change, and if nobody writes it, I would.
    4. One subject per bill. The One Subject at a Time Act, H.R. 4324, would have kept Section 10211 out of a highway bill in the first place. I would cosponsor it.

    The state may have a real case for running some of these programs. If so, a hearing with the tribes at the table can settle that, not a short section buried in a highway bill.
  
    **Keywords:** Congress gave Oklahoma’s tribes authority over their own land and water in a water bill, then took it back in a highway bill. It should give it back in the open.
    
