    My position is that rural Oklahomans should be able to plan on care being there when they need it, and right now they cannot, because every protection rural hospitals have is either temporary, delayed, or unmeasured. Fixing those three things is what I would support.

    This lands harder in Oklahoma than in most states. About one in three Oklahomans, 1.3 million people, live in rural areas, compared with about one in five nationally. Oklahoma ranks second in the country in the share of rural hospitals that have stopped offering general surgery since 2014. That matters more than it sounds, because a hospital cannot safely deliver babies without surgical capability, so when surgery goes, obstetrics usually follows. More than half of Oklahoma’s counties now have no maternity care at all.

    The first problem is that the replacement money is smaller, slower, and shorter than the cut. Last year’s reconciliation law reduces federal Medicaid spending by about $911 billion over ten years, and about $137 billion of that comes out of rural areas. The same law created a $50 billion Rural Health Transformation Program over five years to soften the impact, and Oklahoma received $223.5 million in the first year, one of the largest awards in the country. That money is real, but it pays by reimbursement, so a hospital spends first and is paid back later, and the hospitals closest to closing are the ones least able to front the cash. And the fund runs five years while the cuts run ten. Nobody has said what happens in year six.

    The second problem is that nobody is required to measure the new work requirement. In 2020, Oklahoma voters wrote Medicaid expansion into the state constitution so the legislature could not roll it back. It held. Then the rollback came from Washington instead. Starting in 2027, federal law requires working-age adults on expanded Medicaid to document 80 hours a month of work, school, or volunteering. Some will lose coverage because they did not meet the requirement, which is the policy working as written. Others will lose it because they missed a form while working full time, which is not. Right now, nobody has to tell the difference.

    The third problem is that the rules rural hospitals are paid under keep expiring. The Medicare payment adjustments that keep small rural hospitals solvent, and the telehealth coverage rural patients rely on, are renewed in short extensions attached to must-pass spending bills. Last fall, the telehealth coverage lapsed for six weeks during the shutdown. The rural hospital payment programs expire again on December 31, 2026, unless Congress acts. A hospital cannot plan around that, and neither can a patient.

    Here is what I would support with a federal vote:
    1. Advance payment for hospitals in distress. The Rural Health Transformation Program should be able to pay facilities in financial trouble up front instead of by reimbursement. I would support that change.
    2. No quiet expiration. Before the fund runs out, CMS should be required to report to Congress what it built and what happens when the money ends. I would support that requirement in the next health spending bill.
    3. Make the rural payment rules permanent. The Rural Hospital Support Act, S. 335, and the Save America’s Rural Hospitals Act, H.R. 3684, would make the rural Medicare payment adjustments permanent instead of renewing them every year or two. I would cosponsor the House bill, and I would support making the telehealth coverage permanent the same way.
    4. Measure the work requirement. CMS should be required to publish enrollment losses by cause, state by state: how many people lost coverage because they did not work, and how many lost it because of paperwork. If the requirement is doing what its supporters say, that data proves it. If most of the losses are paperwork, that is a fixable problem. I am not for or against the requirement here. I am for finding out. I would support that reporting requirement.

    Rural hospitals were in trouble before this law, and the state’s share of the expansion cost is a real and growing line in Oklahoma’s budget. Both of those things are true. Neither one means the answer is fewer people covered and less information about why.

    **Keywords:** Oklahoma voters locked Medicaid expansion into the constitution so it could not be rolled back. The rollback came from Washington instead. Before Congress decides whether that worked, it should have to find out.

