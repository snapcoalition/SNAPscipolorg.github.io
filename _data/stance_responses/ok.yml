    I believe every Oklahoman should have access to reliable, affordable healthcare, and I would support protecting and, where possible, expanding access through SoonerCare and other programs that help people receive the care they need.

    Rural healthcare requires particular attention because when a hospital or clinic closes, the impact is not limited to that facility. It can mean families have to travel significantly farther for emergency care, maternity care, routine treatment, or specialist services. I believe we should make sure rural hospitals and healthcare facilities are located within a reasonable and safe distance for the communities they serve, and we should take rural hospital closures seriously before access reaches a crisis point.

    I would support targeted efforts to strengthen rural hospitals and healthcare systems, particularly when a facility is essential to an underserved area. I would also support aggressively pursuing federal rural-health funding and using state matching dollars when doing so can bring additional healthcare resources into Oklahoma.

    Oklahoma also needs to address the shortage of healthcare professionals in rural communities. I would support incentives such as loan repayment, scholarships, residency programs, and other workforce initiatives that encourage doctors, nurses, mental-health professionals, dentists, and other providers to practice in underserved areas.

    Telehealth should continue to be part of the solution as well. It cannot replace every in-person service, but it can give rural patients access to specialists and other providers who may otherwise be hours away. That also means continuing to improve the broadband and technology infrastructure necessary to make telehealth practical.

    I would support additional investment in rural EMS and ambulance services, maternal and maternity care, mental-health and substance-use treatment, and preventive healthcare. Providing access to screenings, prenatal care, chronic-disease management, and other preventive services can help address health problems earlier rather than waiting until they become emergencies.

    Where someone lives in Oklahoma should not determine whether they can see a doctor, safely have a baby, receive emergency treatment, or get help before a health problem becomes a crisis. Rural healthcare is essential community infrastructure, and protecting it should be treated that way.

    **Keywords:** * Reliable healthcare for every Oklahoman * Prevent harmful rural hospital closures
    
    
