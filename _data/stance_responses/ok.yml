    For Oklahomans, severe weather is not an abstract policy issue. It is a matter of life and death. I know this personally. I lived through the 2013 EF5 tornado in Moore. The warning I received through the National Alert System gave me and my family the chance to take cover. That warning existed because of the research and forecasting work done right here in Norman. I do not take that for granted, and I will not stand by while the infrastructure that made it possible is dismantled. The National Severe Storms Laboratory in Norman has been protecting lives, like mine and my 2 kids, since 1964. The research programs housed there, including systems that gave Elk City residents a 30 minute tornado warning in 2017, are exactly the kind of investment that saves lives and money. I strongly oppose any federal budget action that would close the NSSL or eliminate the University of Oklahoma's Cooperative Institute for Severe and High-Impact Weather Research. As a state senator, I would advocate loudly and publicly for our congressional delegation to protect these facilities, and I would support state level efforts to bridge any funding gaps if federal cuts move forward. At the state level, I would also support dedicated appropriations to maintain Oklahoma's own severe weather monitoring infrastructure, including the Oklahoma Mesonet, so that our forecasting capacity does not become entirely dependent on the strength of federal commitment in any given administration. Oklahoma has experienced $115 billion weather disasters since 1980. We cannot afford to defund the science that keeps Oklahomans alive. 
    
    **Keywords:** We cannot afford to defund the science that keeps Oklahomans alive. 
  
