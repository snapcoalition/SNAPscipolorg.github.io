    I have attended local government meetings where residents have raised concerns about the strain that large data centers could place on water systems, energy capacity, and local resources. Economic development should not mean existing residents bear the burden through higher utility costs or reduced access to essential resources.

    We have seen similar concerns arise with projects like the proposed Inola industrial smelter, where communities raised legitimate questions about environmental impacts, public health, and whether the benefits outweighed the risks. These conversations demonstrate why strong oversight and meaningful community input are necessary before approving projects that have long-term consequences.

