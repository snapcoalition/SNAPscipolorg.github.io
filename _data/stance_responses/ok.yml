    My position is that the money for severe weather research should be written into law with a floor under it, so that it cannot be cut without a vote. That is not how it works today, and the way NSSL lost ten percent of its funding last year shows why it should.

    Start with what the investment has already bought. The research done in Norman produced:
    - The first radar track of a tornado’s full life, at Union City in 1973.
    - Dual-polarization radar, which shows debris the moment a tornado touches down and now runs on every Weather Service radar in the country.
    - Warn-on-Forecast, a system aimed at closing the gap between “conditions are favorable” and “it is on the ground.”
    - The phased array radar that is meant to replace the aging national network.
    - Hail research, in a country that loses about $10 billion a year to hail damage.

    When the Enid tornado hit in April, NSSL was the lab that surveyed it.

    That work is cheap for what it prevents. All of NOAA’s research labs and institutes combined are less than 5 percent of NOAA’s budget. Hurricane research alone, which comes out of the same research arm as NSSL, is credited with saving about $5 billion in property damage for every major storm that makes landfall. This is a property argument, not a climate argument. You can want government smaller and still want this.

    The threat to that investment is not a vote against it. It is a process that cuts it without a vote. In 2025, the administration proposed eliminating NOAA’s research arm, NSSL included. Congress refused. The House and Senate committees each set research funding between $710 and $730 million. But the final bill, passed in January, came in at $630 million. No committee voted for that number. It appeared in the conference agreement, the final version negotiated behind closed doors and passed without amendments. The instructions to move programs out of research and into operations were written in report language, the explanatory text that travels with a spending bill but is not law. Nobody had to vote against NSSL. The lab survived, and ten percent of its funding did not.

    The same proposal is back for 2027, and the starting point has moved. Last year, the members defending research asked for $656 million. This year, they are asking for $605 million. The new floor is the old cut.

    Here is what I would support with a federal vote:
    1. Write the floor into the bill. The spending bill should say “not less than” a set amount for NSSL and for weather research, in law, not in a report. A transfer out of research would then have to be written down and voted on. That includes the radar lab, which should not lose funding while Congress is still deciding which radar to buy. I would support that language in the Commerce spending bill.
    2. Fence any money that moves. Research money sent to operations stays research money, with quarterly reporting on what it bought. I would support that requirement in the same bill.
    3. Two-year money. A field campaign should not die because Congress passed a temporary spending extension instead of a budget. I would support two-year funding for weather research.
    4. Reauthorize the Weather Act with dollar floors. The Weather Act Reauthorization Act of 2025, H.R. 5089, is led by Rep. Frank Lucas of Oklahoma and passed the House Science Committee last September. It reauthorizes NSSL’s programs through 2030. It should also set the dollar amounts, so next year’s fight starts from the authorized level, not last year’s cut. I would cosponsor it and support adding the floors.

    A freshman independent will not sit on the Appropriations Committee. What I would have are floor amendments, letters with the right number on them, and cosponsorships. That is enough to make somebody vote, and a vote is the whole point. Some of that research may belong in operations. If so, move it with a line in the bill that every member votes on, not with a paragraph in a report that nobody does.
  
    **Keywords:** NSSL lost 10% of its funding, and no committee ever voted for it. If Congress wants to move that money, it should have to vote on it.
    
