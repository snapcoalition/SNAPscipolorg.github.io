    The 15% cap is not a proposal anymore. It was issued, it was challenged, and it lost in court. What has not been fixed is the process that made it possible. The way OU’s funding almost disappeared, with no hearing and no vote, is a common pattern across our government, and changing it is what my campaign is about. On this question specifically, I would support making the protection for negotiated research rates permanent law, and I would support the rules changes below that would stop it from being undone quietly.

    The question refers to an announcement made in February 2025 by the NIH that it would pay every university a flat 15% for indirect costs instead of the rate each university had negotiated. It did this with no warning and no public comment, and universities sued. In January 2026, a federal appeals court blocked the cap permanently, and the Justice Department did not appeal. OU’s rate is safe for now.

    But here is why it can happen again. NIH did not write a rule, which would have required public notice and a comment period. It issued “guidance,” which requires neither. The court said that broke NIH’s own regulations, but nothing stops an agency from trying the same shortcut next time.

    The second problem is that OU’s and other institutions’ protections hinge on a single sentence in a larger bill that needs passing each year. Every year since 2018, Congress has included a line in the health spending bill, known as Section 224, that requires NIH to honor negotiated rates. That line has never been voted on by itself. Instead, it rides inside a bill thousands of pages long that usually passes under a shutdown deadline. The President’s proposed budget for FY2027 asks Congress to write the 15% cap into law and to leave Section 224 out of the bill. If that happens, there is no debate and no repeal. The sentence is simply gone, and so is the protection.

    Neither of those problems are about research. They are about how Washington makes decisions.

    Here is what I would support with a federal vote:
    1. Make the protection permanent. Section 224 should move out of the yearly spending bill and into standing law, so taking it away requires a bill, a hearing, and a recorded vote. No bill does this today. I would support one, and if nobody writes it, I would.
    2. One subject per bill. The One Subject at a Time Act, H.R. 4324 in the House and S. 59 in the Senate, would bar spending bills from carrying unrelated policy. I would cosponsor it.
    3. Real notice before a vote. The House already has a 72-hour posting rule, and it gets waived whenever leadership wants. I would support a version that covers both chambers with no waivers.
    4. Show the math. Any agency setting a rate that decides whether labs stay open should publish how it got there and take public comment, whether it calls the change a rule or guidance.

    Some universities’ rates may be too high. If so, an audit can solve that, not an arbitrary figure with no explanation.
    
    **Keywords:** OU’s research funding was nearly cut with no hearing and no vote. That is the pattern I am running to change.
  
