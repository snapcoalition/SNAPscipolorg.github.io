    At the state level, I would prioritize strengthening partnerships between Oregon universities, private industry, healthcare institutions, and research organizations to diversify funding sources and reduce dependence on federal grants.

    I also support competitive state matching grants that help Oregon institutions secure federal and private research funding, provided they are financially sustainable and demonstrate measurable economic or public benefits.

    Oregon faces significant budget challenges, so we must be responsible about new spending commitments. My priority is protecting valuable research, attracting private investment, and ensuring scientific discoveries translate into real opportunities for Oregonians.

    We can support scientific innovation while maintaining fiscal responsibility and accountability to taxpayers."
 
