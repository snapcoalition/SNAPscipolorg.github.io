  primary_candidate: false # optional, default false; true = ran in the primary but did not advance. Must be the same on every row for a given candidate
  did_not_respond: false # optional, default false; true = never responded at all. Must be the same on every row for a given candidate
  response: |
    Oregon’s electricity is sold by monopolies the state created. Since 1961, state law has given each utility an exclusive territory where no one else may offer service. It is so complete a monopoly that federal antitrust law doesn’t apply to it. The Public Utility Commission sets the price, and the legislature dictates what the power must be generated from. High bills under that arrangement are not a market failure. PGE’s residential rates rose nearly 50 percent from 2021 to 2025.

    On top of that, the legislature required utility emissions to fall 80 percent by 2030 and 100 percent by 2040, and banned new or expanded gas plants in the state. It cut supply in the same decade that data centers grew to about 15 percent of utility load. Regulators now let a new data center connect only if enough emissions-free power exists to serve it. First ration supply, then ration access, then argue over which group of customers pays. That is what a monopoly does instead of building.

    My steps:

    1. **End utility monopolies**. Repeal the exclusive territories and let anyone generate and sell power to anyone, households included.
    
    2. Repeal the 2040 mandate, the gas plant ban, the renewable portfolio standard and the Climate Protection Program.
    
    3. Let data centers and every other customer build their own generation without asking the state. Each should pay for the wires it uses the way it pays for lumber.
    
    4. End energy subsidies of every kind, fossil and renewable alike.

    On data center tax breaks: the fix for an exemption is not to close it but to give the same exemption to everyone.

