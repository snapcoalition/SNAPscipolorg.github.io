  response: |
    None. **No truth ministry**, whether it is written into a statute or handed to a platform by contract. Any law against misinformation needs someone with the power to decide what counts as misinformation. That someone is the state, which has a bigger stake than anyone in which claims get believed.

    Science doesn’t advance by enforcing consensus. It advances by heresy that turns out to be right. In the early 1980s the accepted view was that ulcers came from stress and stomach acid. Two Australian researchers said a bacterium caused them, were dismissed, kept going, and won the Nobel Prize in 2005. A misinformation statute in force in 1985 would have counted them as the problem.

    When a false claim is used to take someone’s money or injure them, that is fraud, and fraud can already be sued over. Beyond that, the answer to a wrong claim is a better claim, published where people can check it. An AI tool that gives bad answers loses users to one that gives good ones. A government agency that gives bad answers keeps its budget. I would vote against any bill that makes a platform, a model developer or an agency the judge of scientific truth.

