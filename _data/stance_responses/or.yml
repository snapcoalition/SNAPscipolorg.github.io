    2) Windmills destroy the land, and the waters on which they are placed.  They also cause extended environmental damage in their creation and maintenance.  Manufacturing wind turbines involves energy-intensive production of steel towers and massive concrete foundations (often 1,000–2,700 tons per unit), direct-drive designs the mining of rare-earth elements such as neodymium, which can cause habitat destruction, water pollution, and toxic waste. Placement requires clearing land, building access roads, and installing large foundations, fragmenting habitats and disturbing soils and local ecosystems. During operation, turbines kill birds and bats through collisions (with historical U.S. estimates in the hundreds of thousands annually for each group, and localized impacts on raptors and migratory species), while also generating noise, leaking lubricants, using large diesel generators as and inefficient backup and visual disturbance.  Maintenance and end-of-life add further burdens: blades are frequently landfilled because they resist recycling, foundations may be left in place or require energy-intensive removal, and lubricants and other materials create additional waste streams."
  
