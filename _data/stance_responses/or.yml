  response: |
    1. **Permissionless innovation**. No state licensing, auditing or registration of AI models or developers. I lead a software security team, and I have watched compliance culture stand in for competence. A state AI law produces paperwork, not safer software.

    2. Privacy from the government first. The most dangerous uses of AI are the state’s: surveillance, facial recognition, risk scores on residents. I would vote against any state or local purchase of these tools and against any data sharing that feeds them. You can stop using a company. You cannot leave the state’s database.
    
    3. Workforce. AI will change which jobs exist. The worst place to lose a job is the state with the heaviest occupational licensing burden in the country, and that is Oregon. A worker whose job disappears should be able to start a new one Monday without years of required training and a board’s permission. Repeal the licenses.
    
    4. Access. No subsidy programs. State money comes with state conditions, and those conditions follow the money into every classroom and clinic that takes it.

- candidate_first_name: Mr. Morey # titles and middle names go here
  candidate_last_name: Straus # used for alphabetical sorting
  state: or
  race: State Senate # must match one of the options!
  district: 42 # string, e.g. 14 or 14A; feel free to remove if not applicable
  party: Libertarian # must match one of the options!
  question: or-q5
  date: 2026-10-22 # optional
  county_race: # feel free to remove if not applicable
  primary_candidate: false # optional, default false; true = ran in the primary but did not advance. Must be the same on every row for a given candidate
  did_not_respond: false # optional, default false; true = never responded at all. Must be the same on every row for a given candidate
  response: |
    The question assumes that distrust of science and changes in federal funding are connected. They are, and the connection runs through the funding. When research is a line in the government budget, every election puts it on the ballot. Scientists who want trust from people in both parties should want less of their work to depend on which party won.

    On communication, the most useful thing scientists can do is keep facts and policy in separate sentences. “The evidence shows X” is science. “So the legislature should do Y” is a value judgment that needs a vote. A scientist who spends scientific authority on it is spending trust that belonged to the evidence. My rule as a candidate is to **concede facts**, never programs. I’ll accept any finding the evidence supports, still oppose a program built on it, and say plainly which is which.

    There is also trust to earn back. When researchers tried to reproduce 100 published psychology studies in 2015, about 36 percent produced significant results again. The fixes are public data, pre-registered studies and published replications. Those belong to scientists and journals, not legislatures, and none of them needs a law. People trust what they can check.

