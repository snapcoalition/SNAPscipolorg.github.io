    Pennsylvania should have a more balanced energy portfolio than it does today. Right now, according to the U.S. Energy Information Administration, Pennsylvania’s electric power sector is still dominated by natural gas at 51.4% and nuclear at 39.2%, with coal at 7.4% and renewables at just 2.0% in 2024. That tells me we need to keep a diverse and reliable system, but also do a much better job growing renewables, storage, and efficiency instead of staying near the bottom of the country on wind, solar, and hydropower.

    My view is that nuclear should remain a major backbone source because it provides steady carbon-free power. I understand why people have concerns about nuclear power. I grew up right next to Three Mile Island, so I do not dismiss those concerns. But I also think we have to be honest about relative risk. Newer, smaller, more efficient reactor designs are not the same as older generations of nuclear plants, and the risks of modern nuclear technology are lower than the long-term public-health and environmental damage we have accepted for decades from coal. Natural gas will remain part of the mix in the near term, but it should not be an excuse to delay cleaner energy or ignore methane leakage. Coal should continue to decline.

    The biggest area for growth should be renewables, battery storage, grid upgrades, and efficiency, especially where they can directly lower costs for working families and local governments. One policy I strongly support is expanding state support for schools to install solar power. School taxes are a real burden for many Pennsylvanians, especially seniors on fixed incomes who already own their homes and are getting squeezed by rising costs. If we can help school districts replace one of their major long-term operating costs with renewable energy, that is a win-win: lower utility costs for schools, less pressure on local property taxes, and more clean energy on the grid. I would also support modernizing Pennsylvania’s energy standards, speeding up interconnection for viable projects, expanding community energy and distributed generation, and strengthening efficiency programs that lower bills before families use a kilowatt.

- candidate_first_name: Austin
  candidate_last_name: Graham 
  state: pa
  race: State House of Representatives
  district: 169
  party: Democratic
  question: pa-q5
  date: 2026-07-24
