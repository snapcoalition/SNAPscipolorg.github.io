    Natural gas and nuclear power provide a dependable foundation for our grid today. I support maintaining that reliability while growing solar, and other renewables over time. The reality is we need to progress to more renewable energy and create a real plan to be self dependable. 

    I'd prioritize making rooftop and community solar more affordable, putting new projects on rooftops, parking lots, and previously developed land whenever possible instead of taking productive farmland. We should also modernize the grid, support energy storage, and measure new generation against reliability, environmental impacts, and what it costs consumers.

    As massive energy users like data centers seek to expand here, they should pay their fair share of the infrastructure they require. Families shouldn't foot that bill.

    I'm less concerned with setting an arbitrary percentage for each energy source than building a balanced mix that keeps the lights on, lowers utility bills, and protects our communities.

