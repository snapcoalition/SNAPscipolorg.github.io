  response: |
    I would generally support science-based efforts to reduce Pennsylvanians' exposure to PFAS, particularly where these chemicals pose unnecessary risks to public health and where safer alternatives are available. My decisions would be guided by the research and recommendations of the Pennsylvania Department of Environmental Protection, the Pennsylvania Department of Health, and other independent scientific experts. 
    
    Pennsylvania has documented PFAS contamination in drinking water systems and communities across the Commonwealth, leading the state to establish maximum contaminant levels for two of the most studied PFAS chemicals. As additional peer-reviewed science-based research becomes available, we should continue to evaluate consumer products using the best available science to take targeted, evidence-based action to protect public health.
    
- candidate_first_name: Lindsay
  candidate_last_name: Powell
  state: pa
  race: State House of Representatives
  district: 21
  party: Democratic
  question: pa-q2
  date: 2026-06-30
  primary_candidate: false
  response: |
    I believe it's important to engage communities by listening to their concerns, providing clear, evidence-based information, and partnering with trusted local healthcare providers and public health officials. People deserve accurate information so they can make informed decisions. 
    
    I will support policies that promote science-based education on vaccination, improve accessibility to immunizations in communities that lack reliable access to preventative care, and ensure our public health agencies have the resources to respond quickly to outbreaks. Vaccines have been proven to be one of the safest and most effective tools for preventing the spread of diseases like measles, and maintaining high vaccination rates helps protect vulnerable individuals who cannot be vaccinated for medical reasons. 
    
    My approach will continue to be guided by the best available scientific evidence and the expertise of public health professionals.

