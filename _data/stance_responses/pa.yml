    1. Electric demand / grid infrastructure: Require data centers to pay for electrical grid upgrades that they require to support new grid electrical demand. It is unfair for individual rate-payers to bear the costs of these upgrades. 

    2. Acoustic / noise pollution: Any gas-fired OR diesel generators should be required to use best available technology to reduce ambient noise with substantial acoustic shielding protecting persons, livestock and wildlife within a large radius. I do not know what that radius is; much study is needed to understand some reported negative effects on pollinators and livestock. Alongside these concerns, it would be prudent to locate data centers away from all residential areas, including schools, churches and daycare centers. 

    3. Water Usage: Water use for cooling servers should be closed loop to the greatest possible extent with no evaporative cooling used unless sited on a substantial surface water source such as the Susquehanna or Lake Erie. Drawing sub-surface water should be limited to potable water usage for staff use only - drinking and sanitary needs. There should be no risk to aquifer depletion from data centers. 

    4. Light pollution: Data centers should employ dark sky compatible lighting with light trespass less than one foot-candle at all property boundaries.

