    Unregulated and unchecked data centers will be incredibly dangerous to the health and wellbeing of our communities. That's why I supported House Bill 1834, which establishes important guardrails to ensure the rapid growth of data centers doesn't drive up electricity costs for Pennsylvania families or compromise our clean energy future. The bill requires large data centers to cover the costs they create, strengthens oversight of their impact on our electric grid, and promotes the development of new, clean in-state energy resources rather than shifting those costs onto our residents. 
    
    I also believe strong environmental protections and transparency are essential before these projects move forward. Developers should clearly report projected electricity and water use, evaluate impacts on local infrastructure and natural resources, and work with state and local officials to ensure these facilities do not strain our electric grid or threaten our environment. 
    
    We have a responsibility to protect our communities, safeguard our air and water, and ensure economic growth benefits all Pennsylvanians, not just private developers.

