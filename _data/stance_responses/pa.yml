    I would start from two truths at once: measles is a serious public-health threat, and trust matters. If people have concerns about vaccine safety, the answer is not to mock them or wave them off. It is to meet them with clear facts, honest risk communication, and trusted local messengers like pediatricians, family doctors, nurses, pharmacists, and community leaders. People deserve straight answers about what measles does, what the MMR vaccine does, what side effects are known, and what claims are simply false.

    On policy, I support a practical prevention-first approach. That means making vaccines easy to get through school-based clinics, mobile clinics, extended hours, pharmacy access where appropriate, and strong catch-up outreach for families who missed doses. It also means real-time outbreak communication, support for local health departments doing contact tracing and exposure notices, and making sure schools and child care centers are following existing immunization rules consistently. I would defend medical exemptions, but I would be cautious about expanding loopholes that make outbreaks more likely. When vaccination rates fall below the level needed to prevent spread, everyone pays the price, especially infants, immunocompromised people, and families who did everything they should but are still exposed.

    The science here is strong. The MMR vaccine has been studied for decades and is safe and highly effective, with two doses about 97% effective against measles. There is no credible evidence linking MMR vaccination to autism. Measles, on the other hand, is extremely contagious and can cause pneumonia, encephalitis, hospitalization, and in some cases death. Using Pennsylvania’s official school data, statewide kindergarten MMR coverage was 95.5% in the 2020-2021 school year and 93.7% in the 2024-2025 school year, which is a meaningful decline. Pennsylvania also now has a live measles dashboard because of active 2026 spread. My approach would be simple: treat people respectfully, tell the truth clearly, and make the healthy choice the easy choice.

