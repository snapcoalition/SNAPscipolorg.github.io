      Pennsylvania has an opportunity to become a national leader in clean energy, but we need to seize it. While natural gas and nuclear power continue to play a role in meeting our current energy needs, we have fallen behind in developing wind, solar, and other renewable energy sources. Expanding clean energy generation will diversify our energy portfolio, strengthen our electric grid, improve energy security, lower long-term energy costs, reduce emissions, and create thousands of good-paying union jobs across the Commonwealth. 
      
      That's why I have supported legislation to modernize Pennsylvania's energy standards, expand community energy projects, and incentivize new renewable energy generation and energy storage. These investments will help bring more affordable energy online, attract private investment, and ensure Pennsylvania remains competitive in the growing clean energy economy while building a more reliable and resilient energy future.

