    Developers should pay the full cost of the power generation, grid upgrades, and infrastructure their facilities require. Families and small businesses shouldn't see their utility bills increase to subsidize billion-dollar corporations.

    Before any project moves forward, I support independent studies on water availability, electricity demand, environmental impacts, and farmland preservation. Developers should be required to publicly disclose projected and actual resource consumption, meet strict conservation standards, and demonstrate that local infrastructure can handle their operations.

