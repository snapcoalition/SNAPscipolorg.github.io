    Pennsylvania should take a science-based, common-sense approach to PFAS that protects public health while avoiding unnecessary burdens on families and businesses. My priority is prevention, accountability, and responsible government—not regulation for its own sake.

    PFAS contamination, particularly in drinking water, is a serious concern. I support continued efforts to identify and remediate contamination, hold polluters accountable, and protect communities from exposure. Restrictions on intentionally added PFAS in consumer products deserve careful consideration, particularly when safer, affordable alternatives are available. Any legislation, including House Bill 2145, should be evaluated for its public health benefits, economic impacts, and practical enforceability.

    My decision would be informed by peer-reviewed toxicological studies, long-term epidemiological research, and assessments from the U.S. Environmental Protection Agency and other credible scientific institutions. I would examine evidence regarding persistence, bioaccumulation, exposure levels, and links to adverse health outcomes, while recognizing that PFAS encompasses thousands of chemicals with differing levels of research and risk.

    Consistent with my commitment to protecting families, respecting taxpayers, and holding government accountable, I would support targeted, evidence-based solutions that reduce meaningful health risks, encourage safer alternatives, and measure results transparently. We should prevent avoidable harm without imposing costs that outweigh demonstrated benefits.

    KEYWORDS: Science, safety, prevention, accountability, evidence, transparency, sustainability, affordability, innovation, protection

