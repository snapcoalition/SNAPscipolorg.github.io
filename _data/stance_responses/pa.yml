    Pennsylvania's poultry and dairy industries are critical to our state's economy, and protecting them from avian influenza requires a coordinated, science-based response. That's why I voted for House Bill 324, which expanded Pennsylvania's capacity to respond to avian influenza by increasing the number of certified poultry technicians available to conduct testing and surveillance. 
    
    Strengthening our ability to detect and respond to outbreaks helps protect farmers, workers, and consumers alike. I also support ensuring the Pennsylvania Department of Agriculture has the resources it needs for disease surveillance, rapid testing, and timely communication with producers. 
    
    In addition, we should continue to provide assistance to farmers whose livestock are impacted, and ensure farm workers have access to appropriate protective equipment and public health guidance.

