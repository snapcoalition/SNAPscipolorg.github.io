  response: |
    As a community health nurse living alongside the families of House District 58, I know our dairy and poultry farms are the backbone of our economy and identity. Avian influenza is not just an agricultural threat; it is a critical public health vulnerability. If elected, I will champion evidence-based biosecurity and occupational health protocols to protect our community.
    
    I support expanding state-funded, rapid on-farm diagnostic testing to catch outbreaks before they decimate flocks or herds. Crucially, we must protect our frontline agricultural workforce. I advocate for the distribution of stockpiled personal protective equipment (PPE)—such as properly fitted respirators and eye protection—specifically tailored to farm environments, coupled with multilingual health education on zoonotic transmission.
    
    Furthermore, I will push for state-backed "no-fault" economic safety nets. If farmers face financial ruin for reporting sick livestock, containment fails. By guaranteeing fair, rapid compensation and mobile health surveillance vans to monitor worker health right on the farms, we protect both the agricultural supply chain and the broader public from viral mutation. We can secure our food supply and save livelihoods through proactive, trusted public health partnerships.
    
    KEYWORDS: on-farm surveillance, Workforce-Biosecurity No-Fault-Compension
    
