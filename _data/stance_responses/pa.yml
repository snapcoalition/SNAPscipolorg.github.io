    PFAS chemicals are used in many products because they have tight chemical bonds that make them resistant to heat and staining. The 'impenetrability' that makes PFAS useful in products also makes them “forever chemicals”, breaking down slowly and remaining in our environment for long periods of time. Because PFAS chemicals are water-soluble, they cycle between our air, ground and drinking water. When products contain PFAS, those chemicals eventually make their way into our bodies. 
    
    Human consumption of PFAS is linked to, among other things, cancers, immune, cardiac and reproductive problems. Therefore, I support House Bill 2145 to restrict PFAS use in consumer products. The data that supports this decision include water and soil sample testing that show the chemicals are long lived as well as serum samples that show PFAS chemicals are not quickly cleared from human bodies. The link to health problems was made by studying populations with high levels of occupational PFAS exposure. 
    
    One caveat is that if PFAS is banned, companies likely would replace them with other chemicals with similar "impenetrable" chemical properties and we don’t know the health impacts of widespread exposure to those chemicals. We must be vigilant in monitoring the impact of any replacements. 

- candidate_first_name: Margaret 
  candidate_last_name: Burke 
