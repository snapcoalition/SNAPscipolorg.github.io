    Large data centers can bring jobs and tax base, but ordinary ratepayers and local communities should not be forced to subsidize their power demand, water use, or land-use impacts. If a project needs major new generation, transmission, distribution upgrades, backup systems, water infrastructure, or emergency-response capacity, the developer should pay those costs. The public benefit should come from good jobs, local tax revenue, enforceable community benefits, and infrastructure that communities actually want, not from backdoor subsidies or pressure on municipal zoning. I support the basic direction Pennsylvania has taken in requiring large-load customers to bear the costs they cause and in requiring more disclosure before projects move forward.

    I would go a step further on land use. I support treating large AI data centers as a regional land-use issue, more like landfills or power plants than an ordinary warehouse. A municipality that hosts a project should have real control, but surrounding municipalities should also have a voice because the impacts do not stop at the property line. If a town wants a data center and neighboring communities can live with the traffic, noise, transmission buildout, water demand, and visual impact, that is one thing. If the host community or surrounding communities do not want it, the state should not steamroll them.

    Before a project moves forward, I would support clear requirements on power, water, and public reporting. On power, the developer should show a binding energy plan proving that new demand will not raise bills for existing customers, and that it will pay for any grid upgrades, interconnection costs, and stranded-cost risk if the project scales down or walks away. On water, the developer should disclose expected annual consumption, source of supply, wastewater impacts, and water-use efficiency, and complete a feasibility study where local water stress is a concern. On transparency, I would require early notice to the host municipality and surrounding municipalities, public meetings before key site decisions are locked in, disclosure of the actual end user and project footprint, and ongoing annual reporting on energy use, water use, and community-benefit commitments. If a company wants fast-track treatment or public support, it should meet a very high bar on transparency and accountability first.

    As of July 24, 2026, Pennsylvania already has several live proposals moving in this direction. House Bill 1834 passed the House on March 24, 2026 and would regulate commercial data centers with PUC review and cost-allocation rules. House Bill 2150 passed the House on April 13, 2026 and would require annual energy and water reporting. House Bill 2151 passed the House the same day and would create model zoning ordinance assistance for municipalities. The Governor’s May 27, 2026 GRID standards also require developers seeking Commonwealth support to build, bring, or buy incremental electric capacity, pay project-caused costs, report expected peak power and water use, and notify impacted local governments. That is a good start, but I would put even more weight on local consent and regional land-use control.

