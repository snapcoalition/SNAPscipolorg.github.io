    As a scientist, I know climate change driven by greenhouse gas emissions is real and is bringing more extreme weather, flooding, and droughts that threaten our ecosystems, food supply, economy, and safety. In my home district, Perkiomen Valley Watershed flooding has already become more frequent and more dangerous. 
    
    As a mom, I know we can’t afford to ignore it. In Pennsylvania, where we have a constitutional right to clean air and pure water, it is more imperative than ever that we pass stronger legislation to limit greenhouse gas emissions. We must transition away from fossil fuels and towards clean energy generation.
    
    I support the Pennsylvania Climate Emissions Reduction (PACER) initiative and the Pennsylvania Reliable Energy Sustainability Standard (PRESS). PACER would establish a PA-specific cap on carbon dioxide emissions from power plants and require large power plants to purchase allowances for carbon dioxide emissions (cap and trade). The cap would be lowered over time making allowances more expensive thusly those market forces would encourage development of more clean energy sources over time. PRESS would require 35% of electricity to come from clean sources like solar and wind by 2035 moving the state away from fossil fuels. 

