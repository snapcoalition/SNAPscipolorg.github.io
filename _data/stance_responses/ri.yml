    Too many Rhode Islanders are struggling with their energy bills.  I am fighting to bring down energy costs, diversify energy sources, and accelerate development of renewables.  That’s why I fought Trump’s shortsighted offshore wind stop-work orders and continue opposing his costly Iran war.  
    I helped craft the historic Inflation Reduction Act to strengthen energy independence and safeguard our environment.  In this law, I created the Green & Resilient Retrofits Program to deliver millions in federal grants and loans for energy efficient upgrades in RI affordable housing developments.  I also champion assistance for families to boost their energy efficiency and lower bills through the Weatherization Assistance Program, created provisions to help low-income RIers purchase and install energy efficient appliances to unlock hundreds of dollars in savings each year, and protect and advocate for increased investment through LIHEAP funding. 
    More must be done to lower energy bills.  I’m fighting to build on billions of dollars I’ve delivered to boost RI’s grid; strengthen progress we made in the Inflation Reduction Act; keep more energy here at home by reducing oil and gas exports; grow energy sources to enhance sustainability; and help families make smart upgrades to lower their bills.

