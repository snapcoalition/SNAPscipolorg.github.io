    As the Federal government seeks to terminate its funding commitments, we need to use every tool possible to get the funding reinstated.  That means entrusting our Attorney General’s office to collaborate with other states and sue where appropriate. It also means leaning on our Congressional delegation to advocate for our state. 

    In the meantime, the state can leverage and expand dedicated state-level funding bodies, like the Rhode Island Life Science Hub, which is a quasi-public state agency, and the Rhode Island Research Alliance which is administered by the RI Science & Technology Advisory Council (STAC). There are private organizations, like the Rhode Island Foundation, that might be good partners to fund research. We should consider bonds to support state higher ed investments, and we should consider partnering with neighboring states where appropriate.  Use of public dollars should always involve processes for oversight to ensure transparency, responsible spending, reporting, and accountability.

