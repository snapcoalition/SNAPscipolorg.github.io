    Rhode Island is home to some of the greatest research scientists and institutions in the world, and that’s because of federal support for science and technology, from basic research and development to cutting edge clinical trials. American research has led to countless biomedical advances that save lives every day, and our engineering advances add billions to the American economy. 

    I am committed to ensuring that science funding remains strong in the United States, and that scientific research is not politicized. Along with my colleagues in Congress, I have successfully fought the Trump Administration’s arbitrary and devastating freeze of National Science Foundation grants, as well as their attacks on ocean monitoring, health research, and other core areas of research. I will continue to fight against new proposals to require political appointees to sign off on research grants, and when Democrats are in the majority in Congress next year, we will use our leverage over the government funding process to protect federal funding for our vital scientific research.

