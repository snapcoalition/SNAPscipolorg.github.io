    Rhode Island should prioritize resilience investments based on risk, public safety, and measurable benefit—not political influence. Projects protecting drinking water, wastewater systems, roads, bridges, utilities, emergency facilities, and densely populated areas facing significant flooding or erosion should receive particular attention.

    I support using objective scientific data to evaluate the probability and severity of flooding, sea-level rise, erosion, and extreme weather, while considering the number of people affected, infrastructure criticality, project cost, and expected reduction in future damage. Rhode Island’s Resilient Rhody framework already provides a useful foundation for this type of risk-based approach.

    Funding should combine state resources with federal grants, municipal participation, and private investment where appropriate, with an emphasis on projects that leverage outside funding and provide strong long-term value.

    Every resilience investment should have clearly defined costs, expected benefits, measurable outcomes, and public accountability so taxpayers know their money is being spent effectively.

    _Keywords: criteria, funding, infrastructure_

