    It should go without saying that the state needs to follow the science and act to protect our residents' health.

    Testing and monitoring are easy things for state government to do. Governments are good at this sort of thing.

    I cannot speak to “feasibility for manufacturers” or “availability of safer substitutes”. This requires specialized knowledge that few people outside those manufacturers can possibly have. I imagine that manufacturers will find safer alternatives – especially if they know that they can no longer produce goods that contain PFAS.

    Lastly, we have to make tainted water supplies safe, which can be quite costly. System-wide solutions address the problem for all water supplied to businesses and households, while end-point filtering systems can make water safe for consumption without treating water used for other purposes.

    _Keywords: test treat cost_

