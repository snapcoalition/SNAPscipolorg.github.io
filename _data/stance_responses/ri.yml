  response: |
    Large data centers can bring investment, jobs, and economic development to Rhode Island, but residents and small businesses should not be required to subsidize their extraordinary infrastructure demands.

    I support requiring developers to pay the costs directly attributable to their projects, including necessary generation, transmission, distribution, and grid-reliability upgrades, rather than shifting those costs to existing ratepayers.

    Before approval, developers should disclose projected electricity and water demand, proposed power sources, impacts on grid reliability, water conservation and recycling plans, and significant infrastructure needs. This information should be publicly available so communities can evaluate both the costs and benefits.

    Rhode Island should welcome responsible investment and innovation while protecting taxpayers, ratepayers, natural resources, and grid reliability. When a private development creates extraordinary demands on public or utility infrastructure, the developer—not ordinary Rhode Islanders—should bear those additional costs.

    _Keywords: infrastructure, innovation, investment_

