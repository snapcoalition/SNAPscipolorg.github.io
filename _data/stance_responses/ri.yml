  response: |
    I’m not against data centers or new investment in Rhode Island. But if a company is building a massive facility that puts significant demands on our electric grid or water system, they should pay the costs they create, not pass them on to Rhode Island families and small businesses.

    Before a project moves forward, I’d want a clear assessment of its expected electricity and water use, the impact on local infrastructure, and what upgrades will be needed. If additional generation, transmission, water capacity, or other infrastructure is required because of the project, the developer should be responsible for those costs.

    I also support straightforward public reporting so residents know how much power and water a project is expected to use and what public infrastructure will be affected. That information should be available before approvals are given, not after the fact.

    I want Rhode Island to be open for business, but being open for business doesn’t mean giving companies a blank check. We can welcome investment, jobs, and new technology while making sure Rhode Islanders aren’t left paying the bill.

    _Keywords: Fair Share. Accountability. Investment._

