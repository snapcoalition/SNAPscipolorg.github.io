    I am fighting in Congress to lower energy costs by getting more affordable clean energy including wind and solar onto the grid, cracking down on runaway profits by the big energy companies, ending the war in Iran, and fighting to end the Trump Administration’s tariffs that are contributing to high energy prices by making grid upgrades more expensive. The best way to make energy more affordable and protect ratepayers from the volatile price swings of the commodity markets is to produce more clean energy here locally as quickly as possible. 

    To this end, I am fighting for legislation to reinstate the clean energy tax credits that were rolled back by the Trump Administration last summer, and for comprehensive permitting reform to make it easier to build the domestic clean energy projects and transmission and grid upgrades we need to keep pace.

