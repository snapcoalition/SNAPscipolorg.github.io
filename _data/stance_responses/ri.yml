    The progress Rhode Island has made is encouraging, but this is not the time to declare victory. I would continue supporting approaches that are showing measurable results, including making naloxone widely available, connecting people to treatment quickly, expanding access to medication-assisted treatment, and supporting recovery programs and peer outreach. Rhode Island’s own data show that fentanyl and cocaine remain major contributors to overdose deaths, so our response needs to keep adapting as the drug supply changes.

    I also want to make sure we are measuring outcomes, not simply how much money we spend. State programs should be evaluated using overdose deaths and nonfatal overdoses, treatment access and retention, repeat overdoses, recovery outcomes, and other measurable results. Rhode Island already has overdose surveillance and fatality-review systems that can help identify what is working and where resources are needed.

    If a program is saving lives and helping people recover, we should support it. If it isn't producing results, we should be willing to change it. The goal should always be fewer deaths and more Rhode Islanders getting the opportunity to recover.

    _Keywords: Prevention. Treatment. Recovery._

