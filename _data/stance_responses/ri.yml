    Rhode Island’s coastal communities are already experiencing the negative impacts of climate change and worsening severe weather events.  This troubling trend poses significant threats to our environment, economy, and national security.  To fight back, I have delivered over $716 million in federal investments over the last six years to bolster clean water infrastructure; protect coastal communities, beaches, and waterways; and clean up pollution.  I plan to build on this progress. 
    For example, the Southeast New England Program – or SNEP – which I created through my seat on the Appropriations Committee, has been instrumental in protecting and restoring coastal watersheds in RI and our region, delivering over $70 million for our state to address climate impacts, prepare for future sea-level rise, and boost resilience.  SNEP also helps make key green infrastructure upgrades to reduce flooding while creating new greenspaces and resilient urban pathways.  I am working to permanently authorize this competitive grant program to prioritize the long-term environmental health and resilience of our state and its coastline while advancing a proven method for selecting transformative projects that have made effective environmental upgrades across the Ocean State for more than a decade.

