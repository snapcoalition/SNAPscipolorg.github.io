  response: |
    PFAS is a threat to our residents and our clean water now, and we have to act accordingly. In Congress, I am fighting to secure more funding to research and develop PFAS alternatives at the same time as we phase it out of use and clean it out of our environment. I cosponsor the PFAS Alternatives Act, which aims to accelerate the development of PFAS-free materials for firefighter gear, keeping them safe to do their life-saving work. I also worked with the rest of the Rhode Island Congressional delegation to deliver $47.5 million for the state to fund local clean water projects.These projects will address contaminants like PFAS to keep them from entering Rhode Island’s natural waters. 

    Moving forward, the federal government must continue to work to replace PFAS in consumer and industrial products and abate its presence in our land and waters. I will continue to hold the Trump administration accountable to have the most expansive definition of PFAS to minimize PFAS exposure and keep Americans healthy.

