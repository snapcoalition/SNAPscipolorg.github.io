    Data centers need substantial guardrails to protect Rhode Island communities, consumers, and the environment. Data center owners must not only pay for the costs of grid upgrades needed to power their facilities, but they must also help expand less expensive clean energy and benefits for local Rhode Island residents.  We should establish a separate rate or rates for data centers, and incentivize data centers to meet a large portion of their energy with new clean energy. We should also require data centers to operate with flexibility, agreeing to reduce their power use when the grid is strained. We should consider requiring heat generated by data centers to be captured and reused.  We should require data center applications to include projected water use and source, and require that data centers employ water conservation, efficiency, and maintenance of watershed/aquifer health. We should also consider air quality, and require that diesel-powered backup generators must, at a minimum, meet the EPA’s Tier 4 Final Emission Standards and that backup generators can only be used during emergencies and within existing regulatory limits. Battery backup generators should be preferred or perhaps incentivized.  Last, we should prohibit non-disclosure agreements with municipalities.

