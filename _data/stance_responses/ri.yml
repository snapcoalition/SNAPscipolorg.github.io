  response: |
    Taxes and fees, many of them hidden, make up about 40% of RI’s electric bill. Our legislature shifts costs onto business electric bills to subsidize residential bills. I want to simplify our utility bills and make them less expensive by removing these taxes and fees. We should debate energy policy openly, every year, as part of our budget process. Moving taxes and fees from our energy bills into the budget, paid for through regular taxing means like corporate and personal taxes, will make our electric bills less regressive.
    
    What passes for RI’s energy policy and goals is, at best, a disconnected series of fees and spending programs. We have set a goal of “100% green” by 2033. The only way to meet that goal is to send money out-of-state – huge sums – to buy green energy certificates that are only good for one year. This isn’t “going green”. It isn’t stimulative. To meet our 2033 goal, we will end up spending over $100 million every year to buy out-of-state certificates.
    That money should be spent to develop green energy infrastructure in RI. When we do, we build decades of green energy from our investment.

    _Keywords: taxes fees investment_

