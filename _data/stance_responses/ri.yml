    Through my role on the Senate Armed Services Committee, I have championed initiatives to reduce PFAS exposure and combat contamination, launch multi-year assessments by the CDC, ban DOD from using PFAS-contaminated firefighting foam, and fund research into realistic substitutes, which have key implications for civilian firefighters and others. 
