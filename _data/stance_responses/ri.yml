  response: |
    The waters are rising, and RI will see escalating loss of land, property, and infrastructure. I am unaware of any credible way to eliminate this threat. We can raise roads and elevate utility infrastructure. However, in my town, Barrington, streets flood during king tides. Our beach now disappears during normal high tides.

    Too many of our shoreline communities will experience this loss. A critical public policy debate needs to happen soon: what can we afford to spend to provide a temporary reprieve from the inevitable inundation to come?

    Many interests compete for state spending. A third of the population is on Medicaid, and Medicaid spending is about $5 billion in our $15 billion budget. We are probably not spending enough on it. We are definitely not addressing the root cause: poor educational outcomes in our urban school districts.

    RI will be forced to triage our response to rising waters. We should plan for how we retreat from areas that we know will be lost.

    _Keywords: budget inevitability planning_

