    We have a number of solutions. We should electrify everything and stop investing in natural gas-powered building systems. We must invest in renewables (wind and solar) and stick to our Act On Climate requirements. We need to cut red tape associated with residential solar (pass my Solar Cost Reduction Act) and make it cheaper and easier for people to pair batteries with residential and small scale solar. Microgrids and Virtual Power Plants (VPPs) are two emerging energy technologies that can promote grid resilience, energy independence, and renewable energy. We need to invest in utility scale battery systems and require Rhode Island Energy to roll out variable rates for electricity to encourage people to use more off-peak power. Rhode Island Energy’s spending should be under a microscope all the time; ratepayers should never pay for costs associated with advertising, marketing, communications, or public education that seek to influence public (H7881), and their profit margin should be trimmed.  We need to stop utility shutoffs during extreme heat waves. We need strong guardrails on datacenters.

    _Keywords: renewables, batteries_

