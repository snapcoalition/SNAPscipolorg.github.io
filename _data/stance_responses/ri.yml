    I support Rhode Island competing for research funding and making sure our universities, hospitals, and research organizations have the opportunity to bring those dollars and jobs into the state. But government funding should always come with accountability.

    We should have clear reporting on how public dollars are being used, strong protections for scientific integrity, and measurable goals for research programs receiving significant state support. When research leads to new technology, treatments, or businesses, Rhode Island should make every effort to see those benefits reach our communities and economy.

    I also think we should focus on leveraging state dollars rather than simply replacing federal funding. If a relatively small state investment can help attract significant federal research dollars, private investment, or new companies and jobs, that is worth considering.

    The basic question should always be: What are Rhode Islanders getting for their investment? We should support good science and innovation, but we should also expect transparency, accountability, and a clear public benefit when taxpayer dollars are involved.

    _Keywords: Innovation. Accountability. Results._

