    Local residents deserve full knowledge of the potential impacts that data centers will have on their communities. Data center developers should bear the full responsibility for their costs to connect to the grid and any needed impact mitigation. I support requiring data centers to be transparent about their impact on the public grid, the extent to which they will raise electricity rates for everyday homeowners and business owners, their demand on local water supplies, and the environmental impact they will have on the areas in which they are built so that local governments may make the best decisions for their residents. 

