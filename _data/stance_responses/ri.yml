  response: |
    Rhode Island could certainly use the economic stimulus that can come from large data center development, although most of that stimulus comes from the construction phase.
    If the data center pays for all its electrical infrastructure needs, and statewide ratepayers don't bear those expenses, the project could lower electric rates in our state. Of course, our very high cost of electricity likely makes RI an unlikely place for a large data center to choose.

    New England’s grid is also under supply pressure, making a data center's huge demands a concern.

    As far as water consumption, RI should mandate that any data center use a closed-loop cooling system.

    Rhode Island should be able to protect everyone’s interests through carefully crafted legislation.

    Do I think that a large data center is in our state’s future? I do not.

    _Keywords: closed-loop infrastructure supply_

