    The declines in drug overdose deaths that the state has seen are a testament to great work of the health care providers, first responders, and mental health organizations in the state. In Congress, I am focused on ensuring that our state has the federal resources we need to continue this trend. 

    First, we must restore federal funding to Medicaid and the ACA following the nearly $1 trillion cut to the program that Republicans pushed through Congress last year to pay for tax cuts for billionaires. Medicaid is the largest payer for addiction treatment in the country.

    Additionally, the Substance Abuse and Mental Health Services Administration (SAMHSA) is how federal dollars reach Rhode Island organizations on the front lines of overdose prevention. I have fought the Trump Administration’s reckless attempts to cancel billions in addiction and mental health grants, and proposals to eliminate SAMHSA as a standalone agency, and will fight to ensure that SAMHSA is protected and fully funded. It is imperative that local providers have reliable funding that they can count on, year after year, so they can hire staff, expand treatment, and reach more people.

