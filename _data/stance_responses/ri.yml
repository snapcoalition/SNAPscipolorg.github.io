  response: |
    We need to spend resilience money where it will actually reduce risk and protect Rhode Islanders. That means looking at the science, the potential damage, and the cost of the project before deciding where funding goes.

    I would prioritize critical infrastructure such as roads, bridges, drainage systems, wastewater facilities, evacuation routes, and infrastructure that protects public safety. Projects should be evaluated using measurable data on flood risk, sea-level rise, erosion, storm exposure, the number of people and businesses affected, and the expected cost of doing nothing.

    I also think we need to make sure smaller communities are not pushed to the back of the line simply because they have fewer resources to contribute. State funding should help communities leverage federal and local dollars and get projects moving.

    Where practical, we should also use natural solutions like wetlands and improved drainage rather than automatically relying on expensive engineered structures.

    The goal should be simple: spend taxpayer money where it provides the greatest protection, use sound science to make those decisions, and make sure the public can see why a project was prioritized.

    _Keywords: Science. Priorities. Protection._

