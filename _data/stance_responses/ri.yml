    Rhode Islanders should not have to choose between paying their electric bill and meeting other basic household expenses. With electricity costs among the highest in the nation, affordability must be a priority.

    I would support a comprehensive review of state mandates, fees, and energy programs that increase electric bills, requiring greater transparency about their costs and benefits to ratepayers. I also support a diversified energy strategy that includes nuclear power, hydropower, natural gas where necessary for reliability, and renewable energy when it is cost-effective.

    Because Rhode Island is part of a regional electric grid, we must work with other New England states to strengthen generation and transmission capacity and address infrastructure constraints that contribute to high prices.

    I support reducing emissions and protecting our environment, but climate policies must also be realistic, affordable, and reliable. Major energy proposals should include clear analysis of their effects on electricity rates, grid reliability, and emissions.

    Our goal should be straightforward: lower costs, maintain a dependable electric grid, and pursue cleaner energy in a practical and financially responsible way.

    _Keywords: comprehensiveness, mandates, transparency_

