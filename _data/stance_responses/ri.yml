    Rhode Island’s universities, hospitals, and research institutions are important economic and scientific assets. I support maintaining a stable environment for competitive, merit-based research funding while aggressively pursuing federal and private investment.

    Public funding must also come with accountability. Research institutions receiving taxpayer dollars should meet rigorous standards for scientific integrity, financial transparency, measurable outcomes, and appropriate oversight. Rhode Island already has grant-management systems designed to monitor effectiveness, compliance, and transparency, and those principles should apply consistently to state-supported research.

    We should also do more to turn research discoveries into benefits for Rhode Islanders. State investments should encourage collaboration among universities, hospitals, businesses, and life-science companies, with particular attention to commercialization, workforce development, improved health care, and creation of good-paying jobs.

    Rhode Island should support strong basic and applied research while measuring success not simply by dollars awarded, but by scientific advancement, additional investment attracted, technologies developed, businesses created, and tangible benefits delivered to our communities.

    _Keywords: education, funding, institutions_

