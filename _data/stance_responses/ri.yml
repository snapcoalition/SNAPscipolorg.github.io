    Rhode Island has a Governor ’s Overdose Prevention and Intervention Task Force. The Governor’s Overdose Prevention and Intervention Task Force Action Plan focuses on four strategies to prevent overdose and save lives:  1. Reinforcing Comprehensive Prevention, 2. Strengthening Rescue & Harm Reduction, 3. Increasing Engagement in Treatment, and 4. Supporting Recovery. All four of these pillars are critical to keep the downward decline in drug overdose deaths trending in the right direction. There are several Task Force Work Groups that are involved informing the larger Task Force. The Task Force issues semi-annual reports, the latest of which from March 2026 indicates that Rhode Island is on track to meet its 2030 goal of reducing overdose deaths by 30%. This is good news is proof that we are succeeding but it’s important to continue assessing the periodic reports to ensure that the progress continues going in the right direction.

    _Keywords: Overdose, harm reduction, prevention_

