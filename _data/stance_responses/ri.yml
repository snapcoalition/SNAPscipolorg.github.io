    I support a just transition to a sustainable energy economy including projects like Revolution Wind (the 65 turbine wind farm with a planned 704 megawatt capacity which was just completed by union workers), solar energy, and other renewable energy sources. Rhode Island's energy grid over relies on natural gas plants and imported energy. Our grid stability depends on transmission lines bringing power from out of state. So a transition to in state renewable energy sources is the best way to maintain grid reliability and avoid power outages. 

    As Climate Action Rhode Island has pointed out, part of Rhode Island's transition to renewable energy is ensuring that Rhode Island Energy is held accountable by the Public Utilities Commission (PUC).  The PUC's decision-making process can be difficult for ordinary citizens and nonprofit organizations to participate in because it often requires expensive expert analysis and testimony. As a result, Rhode Island Energy is the best-funded and most influential player in the room.

    I will reintroduce the Intervenor Support Bill to help level the playing field during the PUC process by creating a fund to help qualified community groups and nonprofits participate in PUC proceedings by hiring the experts they need to effectively advocate for the public interest. 

    I will continue to support the work of grassroots utility justice groups like the George Wiley Center in Pawtucket and coalitions like Climate Jobs Rhode Island which recognize that our new green economy must be based on solid union jobs and access to electricity for our most at risk neighbors.

    _Keywords: Support for intervenors at the RI Public Utilities Commission_

