    Rhode Island should respond to PFAS based on sound science, measurable risk, and practical implementation. Protecting public health—particularly drinking water—should be the priority, while regulations should evolve as scientific evidence improves.

    I support continued testing and monitoring of drinking water and other significant sources of PFAS exposure, with results made publicly available. State agencies should regularly review emerging federal standards, health research, and advances in testing and treatment so policies remain current.

    At the same time, regulations should recognize that PFAS compounds and their uses differ. Manufacturers should have reasonable timelines to comply, and exemptions should be considered when a PFAS use is currently unavoidable or when no demonstrably safer, effective substitute exists. Rhode Island’s 2026 amendments appropriately provide DEM with authority to grant exemptions for unavoidable uses.

    The goal should be to reduce unnecessary PFAS exposure while avoiding regulations that simply replace one chemical with an inadequately studied alternative or impose costs without a corresponding public-health benefit.

    _Keywords: chemicals, exposure, protections_

