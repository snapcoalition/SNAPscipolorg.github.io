    Rhode Island’s decline in overdose deaths is encouraging, but continued progress requires sustained attention to prevention, treatment, and long-term recovery.

    I would prioritize proven strategies, including broad access to naloxone, early intervention and education, timely access to medication-assisted treatment, strong connections to treatment following an overdose, and effective peer recovery and community-based services. Rhode Island already requires emergency departments to provide naloxone, peer recovery support, and active referrals to appropriate treatment, providing a strong foundation to build upon.

    State funding should follow results. Programs receiving public or opioid-settlement dollars should be evaluated using measurable outcomes, including fatal and nonfatal overdoses, successful connections to treatment, treatment retention, repeat overdoses, and sustained recovery. Rhode Island already collects extensive overdose and harm-reduction data that can support this accountability.

    We should continue investing in approaches that demonstrate results, modify those that do not, and ensure resources are directed where they can save lives and help people achieve lasting recovery.

    _Keywords: drugs, overdoses, treatments_

