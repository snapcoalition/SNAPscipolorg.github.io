    PFAS is an issue where we need to take the science seriously while also making sure regulations are practical and based on good evidence. Rhode Island has already taken steps to restrict intentionally added PFAS in certain consumer products, with additional restrictions taking effect in 2027 and 2029.

    I support protecting drinking water and public health, but we need to distinguish between documented risks and areas where the science is still developing. That means continued testing and monitoring, transparent reporting, and updating policies as better evidence becomes available.

    Manufacturers should have a reasonable path to comply, especially when a product has an important use and there is not yet a proven safer alternative. At the same time, when a safer substitute is available and effective, there is a strong reason to move away from unnecessary PFAS use.

    The goal should be protecting people without creating regulations that are impossible or unnecessarily expensive to follow. Good policy should be based on sound science, practical alternatives, and regular review as we learn more.

    _Keywords: Science. Safety. Practicality._

