    Fortunately…school systems are “supposedly” autonomous and are “independently-controlled” to facilitate decision-making that affects students in local communities.

    One way that the state legislature can affect workforce preparedness is to update the funding formula for education in this great state.

    The core policy choice is whether South Carolina wants local property wealth or economic deprivation to play such a large role in what districts can provide. Increasing the state’s share of education funding can reduce dependency on local property taxes to determine education quality and parity in differing communities. But, this level of commitment requires sustained recurring revenue and a formula that directs additional dollars toward districts and students with greater needs.

    The legislature can Increase the state funding share for districts with less local tax capacity. We can phase in more recurring state aid for districts that cannot raise comparable revenue locally, rather than expecting every district to meet the same needs with very different tax bases.

    We ca set a predictable, multiyear path to parity, by establishing annual funding targets tied to inflation, enrollment and student needs, with progress reported publicly. This helps districts plan staffing and services instead of relying on one-time budget increases.

    We should protect state investment from being offset by local tax limits. Additionally, we must review how property-tax policies affect school revenue and reimbursements, and we must ensure that tax relief for citizens does NOT leave districts with unfunded gaps.

    Another important component of this equation is the plethora of unfunded mandates forced upon school districts in the form of “over regulation”. We must address this problem too.

    A practical way to relieve the regulation burden is to identify requirements that take time away from instruction or duplicate other reporting, then streamline those specifically.

    For example:

    We should audit all mandated requirements and reports. Then, poll districts and teachers asking these practitioners to identify which state reports, plans and data submissions take the most staff time. After obtaining required inputs, legislators can require combining requirements that collect the same information and eliminate reports that aren’t used to make decisions.

    Lastly, we should allow local flexibility in how schools meet learning goals. Districts could test different calendars, schedules, assessment approaches and ways of organizing instruction, while still teaching state standards and reporting student progress.

    These substantive changes in k-12 regulations and funding, along with timely information about workforce needs can help districts increase science workforce preparedness in community-based institutions.

