    I think we have to start by changing the way we talk about this. I don't like the phrase "trust the science" when it is used to mean "stop asking questions." Science isn't supposed to work that way. Science is a process. You observe, ask questions, investigate, test and measure. Somebody challenges your conclusion. Somebody tries to replicate your work. New evidence comes along, and sometimes the conclusion changes. That's not a weakness of science. That's the beauty of science.

    I tell our students essentially the same thing about artificial intelligence. AI can give you an answer in seconds, but that doesn't make the answer true. Where did the information come from? What's the source? Can you verify it? Is there another explanation? Who conducted the research? What assumptions were made? Is there evidence that contradicts it? Those aren't anti-science questions. Those are scientific questions. That's why research and source verification are becoming increasingly important in what we're doing at Uhuru Academy Online. Our scholars use AI and digital research tools, but we want them questioning, researching, comparing sources and verifying information. If our children are going to grow up surrounded by AI and unlimited information, one of the most important skills we can give them is the ability to investigate what they're being told.

    The same principle should apply to elected officials. Don't just put a scientist behind a podium and tell the community to believe them. Bring scientists into schools and communities. Let people ask questions. Explain things in plain language. Make the data accessible. Disclose conflicts of interest and funding sources. Tell people what we know, what we don't know and what evidence could change the conclusion. Through initiatives like the Uhuru/Freedom Corridor, I also want communities actually participating in science. Let students test water, study soil, collect environmental data and work alongside agricultural scientists, engineers, healthcare professionals and technology professionals. Let communities see science happening around problems that actually affect their lives. That's how you demystify science.

    It also brings us back to our ancestors. Human beings became scientists because we had questions that needed answers. We needed to know which plants were useful, when the rains would come, how to treat a wound, how to cross a river and how to build a structure. We investigated because our lives depended on knowing. I want to restore some of that spirit. Skepticism and science are not enemies. Disciplined skepticism is one of the engines of science. My goal as an educator is not to produce young people who believe everything they're told, nor young people who automatically reject everything they're told. I want to produce young people who are difficult to fool because they know how to investigate. If we can build that kind of scientific literacy in our schools and practice that same transparency in government, I think we have a much better foundation for rebuilding public trust.

