  response: |
    I believe public trust in science must be earned through honesty, transparency, and
    accountability, not simply demanded because someone holds a scientific title or
    government position.
    Throughout the years, what has been presented to the public as settled “science” has sometimes turned out to be incomplete, misleading, or simply wrong.
    Having worked in the pharmaceutical industry, I understand the influence that money can
    have on scientific research. When pharmaceutical companies fund university research, there is a potential for financial interests to influence how studies are designed, interpreted, and presented to the public.

    That is why I believe scientists must first and foremost be men and women of integrity,
    committed to discovering the truth rather than producing conclusions that satisfy those
    funding their research.

    Elected officials should work with qualified scientists while insisting on transparency,
    independent verification, disclosure of financial conflicts, and open discussion of
    legitimate scientific disagreements.
    We must also recognize that questioning scientific conclusions is not necessarily rejecting science. Honest questioning, testing, and correcting mistakes are essential parts of the scientific process.
    My guiding principle is simple: Science should be driven by truth, not money or politics. Public trust will return when scientific integrity becomes more important than financial interests, political agendas, or protecting reputations
