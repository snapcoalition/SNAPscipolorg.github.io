    I believe South Carolina’s economic future depends on how well we prepare the next generation for careers in science, technology, engineering, mathematics (STEM), healthcare, and other emerging industries. Every student, regardless of their ZIP code, family income, or whether they attend school in a rural or urban community, deserves access to a quality education that prepares them for the workforce of tomorrow.

    As a candidate for South Carolina House District 121, representing Beaufort and Colleton Counties, I would focus on five key priorities.

    First, strengthen STEM education in our K–12 public schools. We must invest in modern science laboratories, classroom technology, qualified educators, and hands-on learning opportunities. I would advocate for additional resources for rural and underserved school districts so that students in communities like ours have the same opportunities as students in wealthier districts.

    Second, expand partnerships between public schools, technical colleges, universities, and local industries. Institutions such as the Technical College of the Lowcountry and other community-based educational institutions should play a central role in preparing students for high-demand careers. I would support dual-enrollment programs, apprenticeships, paid internships, and career pathways that allow students to earn industry-recognized credentials before graduating from high school.

    Third, invest in recruiting and retaining qualified science and mathematics teachers. We cannot build a competitive workforce without investing in the educators responsible for preparing it. That means competitive salaries, professional development, classroom resources, and incentives for teachers willing to serve in rural and high-need communities.

    Fourth, make workforce training affordable and accessible. I would support expanding need-based financial assistance, workforce scholarships, and short-term credential programs through South Carolina’s technical college system. Working adults, displaced workers, and individuals seeking career changes should also have opportunities to develop new skills without accumulating overwhelming debt.

    Finally, connect workforce development to South Carolina’s economic needs. Our state must prepare workers for careers in healthcare, biotechnology, advanced manufacturing, environmental science, clean energy, cybersecurity, and other growing fields. We should also work with employers to ensure educational programs reflect actual workforce demands while providing pathways to good-paying jobs.

    I also believe we must measure success through graduation rates, credential completion, job placement, and long-term career opportunities, not simply the number of programs we create.

    My goal is to build a South Carolina where a student’s future is not determined by their family’s income or the community in which they were raised.

    As someone who benefited from public education and understands the importance of career preparation, I recognize that education is more than a classroom experience. It is an investment in economic opportunity, stronger families, and thriving communities.

    If we want South Carolina to attract the industries of tomorrow, we must invest in the students, teachers, and workforce of today.

