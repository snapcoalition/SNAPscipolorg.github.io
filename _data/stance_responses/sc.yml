    For me, public health starts with something pretty basic: people have a right to know what's happening to their bodies and what's happening in their environment. There are things individuals simply cannot monitor or regulate by themselves. I can't personally test every chemical coming through my drinking water, and a parent shouldn't need to be an environmental scientist to determine whether a school building has unsafe asbestos, lead, mold or another environmental hazard. That's where government has a legitimate responsibility. Test it, monitor it, tell people what you find, make the information understandable and fix problems when they're identified. We shouldn't hide information because it's inconvenient or expensive.

    But public health can't only be about what government does after people get sick. One of the things we've emphasized through our educational work is nutrition, food, agriculture, environmental science and understanding the human body. At UASC, kitchen science, gardening, sustainability and healing sciences were part of the educational environment. At Uhuru Academy, we're continuing to connect science to nutrition, agriculture, soil and environmental stewardship. Through the Uhuru/Freedom Corridor vision, I want to take that even further. Imagine young people learning environmental science by actually testing water or studying soil health on local farms. Imagine partnerships where students learn food production, nutrition, public health and environmental monitoring while also earning credentials and preparing for careers. That's what I mean when I say science should solve human problems.

    We need strong environmental monitoring, clean water, safe schools, disease surveillance, emergency preparedness and access to preventive healthcare, including vaccines. At the same time, public health institutions have a responsibility to communicate honestly with people about risks, benefits, uncertainty and what the evidence actually says. People should be able to ask questions. I also want health education to become much more practical in our schools. A graduate should know algebra and literature, absolutely, but that young person should also understand basic nutrition, how food affects the body, how to grow something, how to evaluate health information, how to respond in an emergency and how their environment affects their health. That's not extra. That's education for survival and quality of life.

