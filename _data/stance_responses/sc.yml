    This is an area where I'm not just talking about what I think we should do. I've been doing this work for years. Education is actually what brought me to South Carolina. I first came to Columbia in 2013 to present on Afrikan-centered education at Benedict College. I later returned to help develop what became UASC International Learning Center. As a managing educational consultant, I helped provide the academic and cultural model, cultivate partnerships, raise resources and build the educational program. That school is now in its 11th year. UASC is an A-STEAM school—Afrikan-centered Science, Technology, Engineering, Arts and Mathematics. Our young people experienced science through agriculture, gardening, kitchen science and nutrition, computer technology, engineering, building projects, healing sciences, sustainability and hands-on experimentation.

    We carried that philosophy into the UACI STEM initiative through our work with Conscious Ingenuity and Morgan State University. Young people have been exposed to AI, machine learning, cybersecurity, coding and engineering while interacting with Black engineers and engineering students. Today, we're continuing that work through Uhuru Academy Online, our K–12 private school. Our students are learning AI now, and we're creating opportunities for them to develop real skills and pursue credentials in areas including AI, Canva design, Adobe, Microsoft technology, Google tools, digital marketing, cybersecurity and cloud technology. But I'm not interested in children just collecting certificates. I want them to use what they're learning. Research something. Verify what the AI tells you. Design something. Build something. Solve a problem. Create a portfolio. Start a business.

    Another important part of our approach is Vision Development. We don't wait until a student is about to graduate to ask, "What do you want to do with your life?" Our scholars are already actively exploring careers, including STEM careers, and connecting what they're learning in school to where they may actually want to go in life. If a scholar tells us they're interested in engineering, computer science, healthcare, agriculture, cybersecurity or another STEM field, we start asking questions now. What does that career involve? What education does it require? What skills should you develop? What certifications can you earn? What colleges offer strong programs? Who is already doing that work that you can learn from? That's the difference between simply telling a child, "You can be anything you want to be," and actually helping that child figure out how to get there.

    We currently have a junior at Uhuru Academy Online in Baltimore who is already taking engineering courses at Morgan State University through dual enrollment and earning college credit while still completing high school. Why should he have to wait? That's part of my philosophy: stop making our children wait. If they're ready for AI, teach them AI. If they're ready for a professional credential, give them access to it. If they're ready for college engineering, build the partnership that lets them take college engineering.

    That's also part of the Uhuru/Freedom Corridor vision. I want education connected directly to community and economic development. K–12 schools should be connected to technical colleges, colleges and universities, farms, hospitals, utilities, manufacturers, construction companies, technology companies and research institutions. Career exploration shouldn't be one career day where somebody comes into a school, talks for 30 minutes and leaves. Let students research careers, meet professionals, visit workplaces and identify the skills those careers require. Then connect their coursework, dual enrollment, certifications, internships and apprenticeships to the future they're beginning to envision for themselves.

    I also think we've made STEM way too narrow. Agricultural science is STEM. Nutrition is science. Soil and water are science. Construction involves science and engineering. Healthcare is science. AI and cybersecurity are STEM. Environmental stewardship is science. Our children should encounter science in laboratories, but also in gardens, kitchens, farms, workshops, computer labs and their own communities. The first scientists weren't people wearing white coats. They were our human ancestors trying to survive. Somebody had to study the plants, understand the seasons and figure out cultivation, medicine, navigation, construction, water and fire. They observed, questioned, experimented, failed, tried again and passed that knowledge forward. That's science. I don't just want South Carolina children prepared to apply for the jobs that already exist. I want them prepared to create what comes next, and I want some of what they create to rebuild the communities they come from.

