    I believe government has a legitimate responsibility to protect public health and community wellbeing, but that responsibility must be balanced with individual liberty, personal responsibility, and transparency.
    Government should ensure that citizens have access to reliable medical information,
    preventive healthcare, and vaccines while respecting informed consent and the relationship between patients and their healthcare providers.
    We should also take seriously environmental health threats such as PFAS contamination,
    asbestos exposure, and unsafe drinking water. That means using credible scientific
    evidence, identifying risks early, enforcing appropriate safety standards, and holding
    responsible parties accountable for contamination.
    Emergency preparedness is another essential government responsibility. State and local
    agencies should have coordinated plans, adequate resources, and clear communication
    systems to respond effectively to hurricanes, disease outbreaks, and other emergencies.
    Finally, I believe government should measure public health programs by their effectiveness,
    not simply by how much taxpayer money is spent.
    My guiding principle is straightforward: Protect public health, respect individual
    freedom, follow credible science, and hold government accountable.

