    I believe protecting public health is a fundamental responsibility of government. Every South Carolinian deserves access to accurate health information, preventive services, safe drinking water, a healthy environment, and affordable, quality healthcare, regardless of income or geographic location.

    I support strengthening public health through prevention, early intervention, education, and evidence-based policies that address the underlying causes of poor health outcomes.

    First, I support expanding access to affordable healthcare, particularly for low-income families, seniors, children, and residents of rural communities. This includes supporting Medicaid expansion, strengthening rural hospitals and community health centers, improving access to mental health services, and addressing transportation barriers that prevent individuals from receiving timely care.

    Second, I support accessible vaccination programs, preventive screenings, and public health education. Individuals and families should receive clear, accurate, and understandable information from qualified healthcare professionals so they can make informed decisions about their health.

    Third, I support stronger environmental health protections, including monitoring drinking water for contaminants such as PFAS, identifying and addressing asbestos exposure, and evaluating potential health risks associated with industrial development. Communities should receive timely information about environmental hazards, and government agencies should have adequate resources to investigate reported concerns and implement appropriate corrective measures.

    I also support strengthening emergency preparedness through coordination among public health agencies, hospitals, schools, emergency responders, and local governments. Preparedness plans must consider the unique needs of seniors, individuals with disabilities, rural residents, and families with limited financial resources.

    Importantly, public health policies must be informed by credible scientific evidence and the actual experiences of the communities they serve.

    I believe government must listen to residents, investigate their concerns objectively, share findings transparently, and take appropriate action when evidence identifies risks to public health.

    Our responsibility extends beyond responding to illness and emergencies. We must create conditions that help individuals and families remain healthy, informed, and prepared.

- candidate_first_name: Annie
  candidate_last_name: McDaniel
  state: sc
