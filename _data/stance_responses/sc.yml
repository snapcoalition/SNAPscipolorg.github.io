    Protecting public health and community wellbeing is one of the most critical tasks for governments.

    In South Carolina, the issue of public health and community wellbeing and government’s role should be easy to correlate and to quantify.

    Prior to our current administration and its relaxed vaccination policy, South Carolina had one (1) measles infection. Since the CDC (under the direction of Robert Kennedy and his boss - President Trump - more than 1,000 measles cases were reported for 2025 and 2026 combined. The state’s major Upstate outbreak alone totaled 997 cases from October 2025 through March 2026.

    The first step that government can take to protect public health is to disseminate TRUTHFUL information.

    There is reporting that misinformation was circulating in the Spartanburg area.  KFF Health News reported that a local health-system leader connected low vaccination rates to misinformation on social media and from nonmedical community figures. In Spartanburg County, students up to date on required immunizations fell from 95.1% in 2020–21 to 90% in 2024–25; the outbreak’s initial spread was largely linked to a school where only 17% of students had documentation of required vaccinations.

    Some claims that were publicly repeated and could undermine confidence include:

    * The MMR vaccine causes autism.

    * The vaccine can cause the same severe illnesses as measles, such as encephalitis or blindness.

    * Vitamin A, cod liver oil or a healthy diet can prevent or treat measles instead of vaccination.

    * Measles is usually harmless, so there is little reason to worry about it.

    * Natural infection is preferable because it gives useful immunity.

    The second action that must be taken is to make vaccination easier to get. We could fund free or low-cost MMR clinics, mobile vaccination teams, school-based clinics and targeted outreach in communities with low coverage. additionally, we could secure funding for staffing, translation and transportation services.

