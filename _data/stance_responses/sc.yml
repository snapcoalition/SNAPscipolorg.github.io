    I recognize that data centers can bring economic investment, expand our technological infrastructure, and create jobs. However, economic development should never come at the expense of affordable utilities, public health, or environmental protection.

    As a candidate for South Carolina House District 121, serving Beaufort and Colleton Counties, I believe we must take a responsible, balanced approach to data center development.

    First, we must protect consumers from rising utility costs. Families, seniors on fixed incomes, and small businesses are already struggling with higher electricity and water bills. I would support legislation requiring data center operators to pay their fair share of the infrastructure, energy generation, transmission, and water system improvements necessary to support their operations. Residential customers should not be forced to subsidize large corporate developments.

    Second, we must protect our water resources and public health. Before approving new data centers, I would advocate for comprehensive environmental and water-use impact assessments, including evaluations of groundwater availability, drinking water supplies, wastewater management, and potential impacts on surrounding communities. In coastal communities like ours, protecting our waterways, wetlands, and natural resources is essential to our economy and quality of life.

    Third, we must strengthen transparency and local accountability. Local governments and residents deserve a meaningful voice in decisions affecting their communities. I would support stronger public notification requirements, independent infrastructure assessments, and protections for local zoning authority before major data center projects receive approval.

    Finally, economic development must deliver measurable benefits. We should examine the number of permanent jobs created, the quality of those jobs, tax incentives requested, and the long-term costs to taxpayers. I would also encourage energy-efficient technologies, water recycling systems, and responsible energy sourcing.

    I am not opposed to technological advancement or responsible economic development. However, I am opposed to developments that place corporate profits ahead of the financial security, health, and well-being of South Carolina families.

    My position is simple: Growth must be responsible, development must be accountable, and the people of South Carolina must come first. We cannot continue asking hardworking families to pay more so that large corporations can pay less.

