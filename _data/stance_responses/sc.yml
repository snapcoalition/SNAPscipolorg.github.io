    I believe protecting public health and community well-being is one of the fundamental responsibilities of government. Every South Carolinian, regardless of income, age, or ZIP code, deserves access to safe drinking water, preventive healthcare, reliable public health information, and a healthy environment in which to live, work, and raise a family.

    As a candidate for South Carolina House District 121, serving Beaufort and Colleton Counties, I believe our approach must focus on prevention, accessibility, accountability, and preparedness.

    First, we must strengthen access to preventive healthcare and vaccinations. I support ensuring that families have affordable access to recommended vaccines, routine screenings, and preventive medical services. This includes strengthening partnerships with local health departments, community health centers, schools, and healthcare providers. In rural communities, where transportation and healthcare access can be significant barriers, we should expand mobile health clinics and community-based outreach programs. I believe healthcare decisions should be informed by sound medical science, with clear, transparent information available to the public.

    Second, we must address environmental health threats before they become public health crises. Contaminants such as PFAS, asbestos, and other hazardous substances can pose serious long-term health risks. I would support stronger water-quality testing, environmental monitoring, enforcement of applicable safety standards, and timely public notification when contamination is discovered. We must also ensure that schools, public buildings, and aging infrastructure are properly assessed for environmental hazards and that communities have access to resources for safe remediation.

    Third, we must invest in rural healthcare and disease prevention. Too many South Carolina families face challenges accessing primary care, mental health services, and specialized treatment. I would advocate for strengthening rural healthcare facilities, expanding telehealth opportunities, supporting healthcare workforce recruitment, and improving access to screenings for chronic conditions such as diabetes, hypertension, and cancer. Preventing illness and identifying health concerns early can improve outcomes and reduce long-term healthcare costs.

    Fourth, we must improve emergency preparedness and disaster response. Living in the Lowcountry, we understand the threats posed by hurricanes, flooding, extreme heat, and other emergencies. Drawing upon my background in law enforcement and community leadership, I recognize the importance of coordination among emergency management agencies, healthcare providers, first responders, schools, and local governments. I would support investments in emergency communication systems, evacuation planning, backup power for critical facilities, and additional protections for seniors, individuals with disabilities, and medically vulnerable residents.

    Finally, government must operate with transparency and accountability. Public health policies should be guided by credible scientific evidence, developed with community input, and evaluated for effectiveness. Residents deserve timely information about health threats, responsible use of taxpayer dollars, and confidence that public officials are acting in the public’s interest.

    I also believe that protecting public health and supporting economic development are not competing priorities. Healthy communities create stronger workforces, better educational outcomes, and more sustainable economic growth.

    My position is simple: Government should be proactive in preventing harm rather than waiting until families are suffering to respond.

    Whether we are discussing safe drinking water, access to vaccines, environmental contamination, or emergency preparedness, my commitment is to pursue practical, science-based solutions that protect our children, support our seniors, strengthen our communities, and ensure that no part of South Carolina is left behind.

    Public health is not merely a healthcare issue; it is a matter of quality of life, economic security, and our shared responsibility to one another.

