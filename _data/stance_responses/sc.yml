    I believe economic development must be balanced with environmental stewardship, public health, and the protection of our communities. While data centers may create opportunities for investment and technological advancement, their development must not place unreasonable financial or environmental burdens on the residents they are intended to benefit.
    I support requiring comprehensive, independent environmental and infrastructure impact assessments before approving large data centers. These assessments should evaluate electricity demand, water consumption, air quality, potential health risks, emergency preparedness, and the cumulative effects of existing and proposed industrial facilities.
    Of particular concern is the potential impact on residential utility rates. Data center developers should be responsible for the infrastructure costs directly attributable to their projects, with transparent utility agreements and appropriate financial guarantees to protect existing customers.
    For Fairfield County, where the V.C. Summer Nuclear Station is located and completion of two additional reactors is under consideration, I believe special attention must be given to the combined effects of proposed data centers and additional energy generation. Independent assessments should examine water availability, electricity demand, environmental impacts, emergency preparedness, and the potential financial consequences for taxpayers and utility customers.
    I also support meaningful public participation, transparent permitting procedures, enforceable environmental standards, and ongoing monitoring of approved facilities.
    Economic development should provide measurable benefits to surrounding communities, including employment opportunities, workforce development, and responsible infrastructure investment.
    My guiding principle is that communities should not be required to sacrifice their health, natural resources, or financial security in the name of economic progress.

