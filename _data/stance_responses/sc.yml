    I'm not anti-data center, and I'm certainly not anti-technology. I'm an educator who is actively putting artificial intelligence and emerging technology into the hands of K–12 students. My position isn't that we should run from technology. My position is that we should be smart enough to embrace innovation without allowing corporations to unnecessarily damage the communities and environments where that innovation takes place. I don't believe technological advancement and environmental responsibility are enemies. At Uhuru Academy Online, our students are learning AI now, and we're developing pathways into AI, cybersecurity, digital design, cloud technology and other emerging fields. Through our work with Conscious Ingenuity and Morgan State University, young people have been exposed to artificial intelligence, machine learning, coding, cybersecurity and engineering. So yes, I want South Carolina participating in the technological future.

    At the same time, if a data center is going to consume tremendous amounts of electricity or water, communities deserve to know how much. They deserve to know what infrastructure will be required, who will pay for it, what the environmental consequences are and what happens when resources become strained. Innovation should not mean privatizing the profits while the public absorbs the environmental and infrastructure costs. I also think we should challenge these companies to innovate in this area. If you can build some of the most sophisticated computing infrastructure in human history, then we ought to be asking how you're reducing water consumption, reusing water, improving cooling technology, increasing energy efficiency and minimizing environmental impact. That's science too.

    This also connects to our vision for the Uhuru/Freedom Corridor. In rural communities, I don't want economic development to simply mean that a large corporation arrives, uses the land, water, electricity and tax incentives, and everybody calls that progress. I want to know what that development is doing for the people who already live there. Where are the internships and apprenticeships? Where are the STEM partnerships with the schools and opportunities for local businesses? Can our young people learn cybersecurity, electrical engineering, advanced manufacturing, cooling systems, AI infrastructure and environmental science because that company is there? Technology should leave a community stronger than it found it. That's the balance I would advocate for: innovation, transparency, environmental responsibility and community benefit.

