    Texas’s water problem is not a single shortage. It is a simultaneous flood-and-drought problem plus aging pipes, a growing population, declining groundwater in key aquifers, and widespread surface-water impairments. The 2027 State Water Plan (adopted July 2026) puts the price tag at roughly $174 billion (2023 dollars) through 2080 to produce about 7.6 million acre-feet per year of additional supply under drought-of-record conditions. Conservation and reuse together account for a large share of that volume because they are usually the cheapest and most drought-resilient options. Irrigation remains the largest single use of groundwater.

    I would not treat this as a choice between “build more reservoirs” and “make farmers use less water.” The data favor a portfolio that starts with the lowest-cost, highest-certainty measures and then adds new supply only where the economics and hydrology justify it. Property rights, local knowledge, and measurable results should constrain the tools.

