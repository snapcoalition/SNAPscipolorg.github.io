    I remember Winter Storm Uri, when millions of Texans lost power and hundreds died. Grid reliability means keeping families warm and safe, not building infrastructure for industry at landowners' expense.

    In House District 58, many landowners face 765-kV transmission lines running from near Comanche Peak to the Permian Basin. These lines are sold as a reliability project, but the law that started them, House Bill 5066, was written to support oil and gas production in West Texas. Landowners deserve far better compensation than they get today, and the industries driving the demand should pay for the lines, not residential ratepayers.

    The biggest new strain on our grid comes from heavy industrial users like data centers and bitcoin mining. Senate Bill 6 was a first step, making the largest new users pay their connection costs and allowing the grid operator to cut them before homes in an emergency. Those rules should also apply to facilities already on the grid. The public grid shouldn't be put at risk for speculative industries like bitcoin mining that produce nothing tangible.

    If reliability is truly the goal, Texas should reconsider connecting to the national grid. Being isolated didn't protect us during Uri.
  
