    I support economic development, but economic development cannot come at the expense of the natural resources that sustain our communities. For me, water comes first. In rural Texas, water is not simply another resource to allocate. It is the foundation of our farms, ranches, communities, and future generations.

    As a state representative, I would support requiring large data center developments to provide transparent, independently reviewed assessments of their projected water and energy needs BEFORE receiving approvals. Communities deserve to know how much water a project will use, where that water will come from, what effect that withdrawal could have on local aquifers and existing users, and what additional electricity infrastructure will be required.

    This is particularly important in rural Texas, where groundwater supplies can already be under pressure. I would support stronger conservation requirements for high-volume industrial users, including water-efficient or closed-loop cooling systems where feasible, water reuse, and limits or additional safeguards in areas where groundwater availability cannot sustainably support the proposed demand. I do not believe we should sacrifice a resource that our communities will need for generations in exchange for short-term economic development.

    I would also insist on meaningful local input and transparency before these projects are approved. Rural communities should not learn about a massive development after agreements have already been negotiated behind closed doors. Farmers, ranchers, landowners, municipalities, groundwater districts, school districts, and residents deserve a seat at the table before decisions are made that could permanently affect their water, land, infrastructure, and quality of life.

    On energy, I believe large data centers should pay their fair share (if not more) of the infrastructure necessary to serve them. Texas families and small businesses should not see their utility bills increase because the state has attracted enormous new industrial loads. When new transmission, generation, substations, or other infrastructure is primarily necessary to serve these facilities, we should examine policies that appropriately assign those costs to the companies creating the demand rather than automatically spreading them across ordinary ratepayers.

    I would also do away with Texas' data center tax incentives. Texas currently provides qualifying data centers with significant sales-tax exemptions that can last 10 or 15 years, while qualifying large data center projects can receive exemptions for 20 years. I do not believe taxpayers should provide substantial incentives simply because a company promises a large capital investment. There should be no incentives because they should want to bring measurable benefits to the community. This includes permanent jobs, responsible water use, infrastructure investment, environmental safeguards, and protections for local taxpayers, and there should be accountability when those commitments are not met.

    My position is not that Texas should reject technology or economic development. It is that growth must be responsible and sustainable. A project may bring investment today, but we have to ask what that community will look like 20, 30, or 50 years from now.

    When making these decisions, I would rely on groundwater availability and aquifer data, projected electricity demand, infrastructure costs, independently verified water-use projections, the number and quality of permanent jobs created, and, most importantly, the voices of the people who actually live in the affected communities.

    The people of rural Texas should NEVER be told that sacrificing their water, paying higher utility costs, or changing the character of their communities is simply the price of progress. Our natural resources belong in the conversation before the contracts are signed, not after.

    **Keywords:** Transparency, no incentives, voices, never

