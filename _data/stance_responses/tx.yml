    Research funding isn't just about universities. It's about families. I'm a supporter of the Rylan Strong Network, founded in memory of a young Texan who lost his fight with a rare pediatric brain cancer. Their message stays with me: only about 4 percent of cancer research funding goes to childhood cancers. If research budgets shrink, kids like Rylan lose the most.

    Texas institutions depend on negotiated indirect cost rates to keep labs, equipment, and clinical trials running. A flat 15 percent cap would have cut hundreds of millions of dollars from Texas research. The courts blocked it, but it's still in the federal budget request, and Congress only protects these rates one year at a time.

    As a state representative, I would:

    - Call on our congressional delegation to make protection of negotiated rates permanent.
    - Support state investment that protects our research base, building on proven programs like CPRIT, with a stronger focus on pediatric cancer.
