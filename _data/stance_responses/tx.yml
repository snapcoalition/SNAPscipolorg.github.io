    I support policies that invest in modern flood-detection technology, including expanded radar, stream gauges, real-time water-level monitoring, and location-specific warning systems that can give families more time to get to safety. We should use technology and engineering to identify dangerous areas before a disaster occurs, not after lives are lost.

    Texas also needs to invest in upgrading aging drainage, bridges, flood-control systems, and other infrastructure that can worsen flooding. We should work with local emergency management, FEMA, engineers, universities, and research centers to develop faster response systems and better ways to move floodwater safely out of populated areas.

    At the same time, we should look at floodwater as a resource not simply something to move away and lose. Where appropriate and safe, Texas should invest in systems that capture, treat, store, recycle, and reuse water for agriculture, industry, landscaping, and other non-potable purposes.

    I believe we should support policies that use the best science and technology available. We cannot prevent every flood, but we can be better prepared, give people earlier warnings, build smarter infrastructure, and turn more of our water into a resource.

