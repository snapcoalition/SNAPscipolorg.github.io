  date: 2026-10-12
  primary_candidate: false
  response: |
    I support vaccinations and I recognize we must continually educate people about the benefits and safety. We need our trusted medical professionals to educate parents. It’s natural to have concerns and questions, and we should address those concerns and questions using data and science. 
    We can’t forget why we vaccinate against these diseases in the first place. We had 762 measles cases in Texas last year. Two children died. Measles had become something most parents in Texas didn't have to spend much time worrying about, and I'd like to get back to that.
    When there is an outbreak, local health departments need to be able to find out where it's spreading, contact people who may have been exposed and get vaccines to people who want them. Schools need good information too, because that's where a disease like measles can spread very quickly.
    I support vaccinations and the school requirements we have for them. I also think people are much more likely to listen to a doctor they know than somebody in Austin telling them what to believe. We ought to make it easier for doctors and local health officials to do that work.
  
- candidate_first_name: Vikki
  candidate_last_name: Goodwin
  state: tx
  race: Lieutenant Governor
  district: 
  party: Democratic 
  question: tx-q7
  date: 2026-10-12
  primary_candidate: false
  response: |
    Data should play a large role in decision-making and law-making. As lawmakers, we should listen to the experts, people who know more about the subject than we do. We are making laws about a wide variety of subjects everyday. We may be voting on issues around healthcare one day and water or the electric grid the next. Nobody is an expert on all subjects.
    If the experts don't agree, I want to know why. Sometimes there isn't enough research yet. Sometimes they're looking at different information. And sometimes they agree about the science but disagree about what the Legislature should do with it.
    I also listen to the people I represent. They may be seeing something on the ground that we need to know about. There are times when what people want conflicts with what the research is shows us. We can’t just disregard the research when that happens.  

