    Data centers are the defining issue in House District 58, and my position is simple: no industrial complex should be built in rural Texas without direct approval from the county where it will stand. I support a local option veto for counties and real authority for groundwater conservation districts. No data center should be permitted until an independent study confirms there is enough water without harming rural wells or public supplies. Under Texas's Rule of Capture, landowners have little protection if a neighbor drains the aquifer, and the Trinity Aquifer can't take unlimited withdrawals.

    I oppose tax abatements or similar incentive deals from cities and counties for these projects. Businesses should pay their fair share for the roads, water, sewer, electric infrastructure, and fire and police protection they depend on, and every dollar of grid connection and transmission cost should be paid by the company that needs it, not by residential ratepayers. I oppose on-site natural gas generation in Johnson County, which is already out of compliance with federal ozone standards and facing a Serious classification. I support a strict ban on discharging wastewater containing PFAS or other chemicals that can harm people, livestock, or crops.

    I oppose bitcoin mining operations, which use enormous power and water while creating few jobs. Texas should stop paying them to switch off during grid emergencies.
  
