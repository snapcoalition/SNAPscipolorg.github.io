    I would keep Texas’s existing school-entry requirements and the conscientious-exemption pathway. Removing non-medical exemptions after an outbreak in a specific community looks like punishment and is likely to increase underground noncompliance and homeschooling rather than raise durable coverage. HB 1586’s change to a downloadable (still notarized) affidavit lowered a procedural barrier; the subsequent rise in exemptions was predictable. Notarization remains a modest check that the choice is deliberate.

    I would put more effort into the delinquency bucket than into new statewide mandates. Requiring schools to close documentation gaps, offering catch-up clinics at enrollment, and funding school nurses produces coverage gains among families who are not ideological objectors.

    I would not support a statewide ban on conscientious exemptions, nor a policy that treats every cluster of low coverage as a problem to be solved only by tighter law. Herd-immunity math is real (measles R0 is high; 95% is the conventional target), but so is parental authority over a child’s medical interventions in a state that generally treats that authority as primary. The workable middle is: requirements remain, exemptions remain available with a small amount of process, outbreak tools stay sharp, and public health earns trust by being accurate when it is inconvenient.

    At the federal level, I would support stable, high-quality surveillance and open publication of both effectiveness and adverse-event data, and I would oppose using a single year’s outbreak to rewrite the childhood schedule by executive order without the ordinary evidence process. I would also oppose gagging clinicians or parents who report rare harms.

    The long-term stability of coverage depends less on the next statute than on whether families believe institutions will tell them the truth when the news is mixed. Two children died in Texas in 2025 from a disease their parents chose not to vaccinate against. That is a fact that should be stated plainly. So is the fact that many of their neighbors will not accept a policy that treats that choice as illegitimate. Policy that ignores either fact will fail.

