    At the state level, Texas should strengthen its commitment to research by providing competitive grants, matching funds for federal awards, and targeted support for laboratories and research facilities. I would prioritize investments that leverage federal funding rather than simply replace it. Texas could also create emergency or bridge-funding mechanisms to help institutions maintain critical research programs when federal funding changes unexpectedly.

    I would especially support partnerships among universities, hospitals, private industry, and state agencies to translate research into new treatments, technologies, businesses, and high-paying jobs. Investments should be evaluated based on scientific merit, economic impact, healthcare benefits, workforce development, and the potential to attract additional outside funding.

