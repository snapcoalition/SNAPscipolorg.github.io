    https://patdixon.org/free-market-sustainability/ addresses sustainable resources.  "A Thirsty Land: The Fight for Water in Texas" by Seamus McGraw is an excellent reference.  The moon shot would be diverting water from flood areas to drought areas, but the pumping capacity would be an enormous energy demand.  Gray water reuse where potable water is not required is a good idea.  LCRA has stated that thinning out brush (like ash juniper) could have a significant impact.  Ultimately it is imperative that water is priced based on supply and demand to cover the capital infrastructure costs as well as operational and maintenance costs, while promoting conservation through free market incentives.    

