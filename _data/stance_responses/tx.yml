    Science is the best available method for testing claims about the physical world: does this vaccine reduce measles transmission and severe disease; how fast is this aquifer declining; what reserve margin keeps the lights on in August; what do audited F&A costs actually buy. When methods are transparent, results replicate, effect sizes are large, and incentives are not badly distorted, those findings should constrain policy. Ignoring them is not “values”; it is flying blind.

    That is not the same as handing the decision to a panel. Experts estimate probabilities and mechanisms. Elected officials weigh those estimates against cost, rights, distributional effects, and what the public will accept and comply with. A republic that treats expert consensus as self-executing law has no place for disagreement about risk tolerance, parental authority, property, or fiscal limits.

    Use science to map consequences and to kill policies that cannot survive contact with measurement. Use politics—accountable, constrained by rights and budgets—to choose among the remaining options. Publish the uncertainties. Separate empirical disagreement from moral disagreement. And when the two collide, do not resolve it by declaring one side illegitimate. Resolve it by making the tradeoffs explicit and letting voters fire the people who get them wrong.
    
