    Public health works best when there is trust between families, health professionals, schools, and government. When parents have questions about vaccines or infectious diseases, I don't believe our response should be to dismiss them or shame them. We should listen to their concerns, provide accurate information, and make sure they have access to trusted medical professionals who can answer their questions.

