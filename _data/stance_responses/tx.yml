    Threatened water quality for communities across our state. Let's take a look at how Lake Michigan was cleared up back in 1972. Lake Michigan was so polluted that you couldn't even fish in it, yet today, you can. What did they do? They enacted the 1972 Clean Water Act and the Great Lakes Water Quality Agreement between the U.S. and Canada. Governments and groups upgraded sewage plants, banned harsh chemicals like DDT, limited phosphorus in fertilizers, and cleaned up industrial toxic waste sites. I think we could use this as a good starting point to clean up our Texas waterways. It's amazing how the environment will clean up itself when the major pollutants are removed. With regard to individual usage, a page might be taken out of what some countries in South America have done. Individuals have machines like small refrigerators that de-humidify the air in their homes and apartments. I believe they use this as drinking and washing water. In countries like Chile and Peru, they desalinate water mainly using reverse osmosis (RO). High-pressure pumps push seawater through special filters to trap salt. This clean water supplies mining sites, coastal cities, and dry regions. I just recently purchased a dehumidifier myself. This dehumidifier pulls around 4 to 5 gallons out of the air per day which I pour around my garden plants and along my foundation. I've been trying to figure out how to clean and store these 4/5 gallons per day. I've got some ideas. When I was in the Army we were given a steel pot (helmet) amount of water to bathe with each day. Believe it or not, you can bathe with a small amount of water if need be. With respect to aquifers, we are north of the Gulf of America (Mexico.) Countries in the Middle East like Saudi Arabia, the UAE, Kuwait, and Qatar produce a huge share of their drinking water by removing salt from ocean water using reverse osmosis and thermal distillation. I think some creative use of the water in the Gulf could be pumped up to the communities and the aquifers in Texas. Obviously, this will not be cheap, but now might be the time to get started and get our best brains thinking about this issue. Currently, Texas uses replace and manage Aquifer Water Storage and Recovery (ASR). Systems pump excess surface water (like river water or treated drinking water) underground during wet times. It stays stored safely out of the sun and is pumped back up during dry summer months or severe droughts. Also, local groups and counties form groundwater conservation districts to set rules on how much water big users and well owners can pump out. And finally, the Texas Water Development Board tracks water supplies and designs long-term strategies to fund massive water infrastructure projects across the state.

