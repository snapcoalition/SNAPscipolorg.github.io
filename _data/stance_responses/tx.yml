    I start by listening. Most hesitant parents aren't anti-science. They're worried and want answers from someone they trust. The best messengers are local doctors, nurses, and pharmacists, not politicians, so I'd support funding for community health outreach and make sure vaccines are free and easy to get, especially in rural areas.

    On policy, I'd support stronger outbreak protections. When measles is spreading, unvaccinated students and staff should stay home until the danger passes, and schools should publish their vaccination rates so parents can make informed choices about where their children learn. Freedom of conscience is real, but so is a child's right to go to school without catching a deadly disease.
    
