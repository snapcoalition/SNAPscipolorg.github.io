    I have been raising concerns about data centers for months because Texas is allowing these projects to move forward faster than we are answering some pretty basic questions about them. How much electricity will they use? Where is their water coming from? Who is paying for the new transmission lines, substations and other infrastructure they need? And what happens to the people who already live there when several of these facilities are built in the same area?
    I called for a pause on new data centers and a special session in July because I think we need answers before we keep approving more of them. Companies should disclose how much water and electricity they expect to use, where those resources will come from and what their expansion plans are. Counties also need more authority to decide whether a project makes sense for their community.
    I do not think Texas taxpayers should be subsidizing this growth. I support ending the state sales tax exemption for data centers. These are some of the largest companies in the world. If a project needs new power lines, substations or water infrastructure, the cost should not simply show up on everybody else's utility bill.
    There is certainly an economic benefit to new investment in Texas, and I am not against new technology. But we need to know that our electric grid and water supply can handle what we are approving. ERCOT itself is now looking at data centers together because the amount of power they are requesting is too large to look at each project in isolation. The state is also finally asking developers for information about water use, tax benefits and community impacts. Those are questions we should have been asking before we got this far.
    I want Texas to grow. I just don't think Texans should have to subsidize that growth and then pay more on their electric and water bills because of it.

