    I support economic development and technological investment in Texas, but I do not believe Texas families, farmers, ranchers, or small businesses should be asked to subsidize data centers while bearing the costs of the water, electricity, and infrastructure those facilities require.

    I would support requiring large data center projects to demonstrate that adequate water and electric capacity exists before receiving state incentives or approval for major utility connections. In water-stressed communities, drinking water, existing residents, agriculture, and locally established businesses should receive priority. I would also encourage the use of reclaimed or recycled water and cooling technologies that reduce freshwater consumption.

    On electricity, large data centers should pay their fair share of the generation, transmission, and infrastructure costs created by their demand. Those costs should not simply be shifted to residential ratepayers. Texas should welcome investment, but companies proposing extremely large electrical needs should be expected to contribute toward the infrastructure necessary to serve them and participate in reliability measures when the grid is under stress.

    I would also reevaluate Texas's existing data center tax incentives. Incentives should be tied to measurable public benefits such as permanent Texas jobs, infrastructure investment, responsible water use, and contributions to the communities hosting these facilities. Texas taxpayers should not provide decades of tax advantages simply because a project represents a large capital investment.

    My position is informed by Texas's growing electricity demand, concerns about future water availability, and the relatively small number of permanent jobs some highly automated data centers can create compared with their infrastructure requirements. It is also informed by what I hear from rural Texans who are concerned about protecting their water, property rights, electric bills, and quality of life.
    
    I am not opposed to technology or economic development. I am opposed to putting corporate development ahead of the people who already live and work here. Texas can lead in technology while still requiring responsible growth. My standard would be simple: Texans and their essential resources come first.

