    Texas should not subsidize projects that deliver low job density and high resource intensity at the expense of residents. I support policies that require large industrial users to pay the full cost of the power and water infrastructure they demand, so ordinary ratepayers are not left covering the difference. Water and energy allocation should prioritize existing communities, agriculture, and higher-value uses that produce more sustained local employment and economic benefit for constituents.

