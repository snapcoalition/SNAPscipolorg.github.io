    As data center construction rapidly expands across Texas, Representative Howard believes that we need thoughtful policies which address community and environmental concerns while allowing the state to continue serving as a hub for technology and innovation. She supports policies that give local governments the necessary land-use and regulatory authority to ensure developers are responsive to community concerns and follow through on promised economic investments including job opportunities and paying property taxes. Part of this local control also includes allowing communities to reject a proposal for a data center if they don’t want it. 

    To address environmental concerns, Representative Howard supports legislative action to create statewide operating standards which can be adapted to the environments of different regions and encourage local partnerships. For example, while all data centers would be required to be water efficient, a data center in West Texas could cooperate with local partners to utilize the abundance of produced water to cool their systems. These statewide operating standards would also require data centers to build infrastructure which reduces noise and light pollution. 

    In regard to electricity usage, Representative Howard believes that data centers should pay for their electricity usage and the infrastructure needed to connect to the grid. For data centers which generate electricity off the grid, she believes that they should be employing a mix of thermal generation and renewable energy such as solar to reduce harmful pollutants produced by gas generators. 

    Representative Howard believes that there is tremendous potential in making Texas a hub for AI development in the world. However, she believes that this development must be done in partnership with local communities and the industry leaders must be willing to be responsible environmental stewards. Due to the local impact that data center construction has on communities, Representative Howard believes that providing Texans with accurate data about the opportunities and challenges of data centers will be key to shaping the policy discussion. To inform her positions on this issue, she has consulted with fellow legislators, environmental non-profits, mechanical engineering professors, and constituents.

