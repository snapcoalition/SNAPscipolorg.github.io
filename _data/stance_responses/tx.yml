    I approach these issues with transparency first and respect for parental authority.

    Parents have the primary responsibility for their children’s health decisions. Government’s role is to provide accurate, complete information—not to use fear, pressure, or social engineering to force rapid compliance. When officials highlight tragic outcomes, the public deserves full and precise facts rather than selective framing designed to drive policy.

    Measles is a serious disease. Declining vaccination rates create real risks of outbreaks, and communities deserve clear data on cases, hospitalizations, and outcomes. At the same time, public health communication must avoid exaggeration or incomplete accounts that erode trust. People make better decisions when they receive honest information and are free to weigh it according to their own values and circumstances.

    Policies I would support:
    • Protect existing parental rights to make medical decisions for their children, including the current conscientious exemption process, without adding new mandates or barriers.
    • Require state health agencies to publish timely, transparent, and complete data on outbreaks—including vaccination status, underlying conditions, and verified causes of severe outcomes—so the public can evaluate claims for themselves.
    • Reject coercive measures, school exclusion policies beyond current law, or public campaigns that treat disagreement as ignorance rather than legitimate concern.
    • Support voluntary access to vaccines for families who choose them, while ensuring no one is penalized or stigmatized for exercising their rights.

    Informed consent requires accurate information, not pressure. Texas families are capable of making decisions for their own children when they are given the full picture rather than messaging designed to produce a predetermined outcome. My priority is protecting both public health through transparency and the freedom of parents to act according to their best judgment.

