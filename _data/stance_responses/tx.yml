    I think we have to be thoughtful when we talk about agriculture and water use. Farmers and ranchers aren't using water for the sake of using it. They're growing our food and raising livestock, and their livelihood depends on having a reliable water supply. I support helping producers move to more efficient irrigation and other practices that save water, particularly when the cost of making those changes would otherwise fall entirely on them.
    But agriculture can't be the only place we look for savings. Texas is recruiting industries that use a tremendous amount of water, and in some cases we're giving them tax incentives to come here. Before we do that, we ought to know whether the community has the water to support them. I don't think it's reasonable to ask a farmer to conserve water so we can turn around and give it to a new industrial development.
    There won't be one answer for the entire state. What works in East Texas may not work in the Panhandle. I want the state helping communities plan ahead and paying its share of the infrastructure we know we're going to need, while giving the people who depend on that water a real say in those decisions.

