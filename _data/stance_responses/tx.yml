    https://patdixon.org/free-market-sustainability/ addresses sustainable resources, and https://patdixon.org/ai/ addressed potential danger of artificial intelligence.  Free market sustainability means growth pays for itself.  It requires those who impact demand for resources to pay for them.  It welcomes growth and rewards those that cover all of their costs and succeed.  It recognizes that growth can originate from anyone with an idea that organically and locally grows their business.  It opposes the taxpayer funded corporate welfare policies that Texas has imposed for many years.  Regarding AI regulation, in a free market, there are 3 forms of regulation: the market, the rule of law, and predictive regulation.  The rule of law on AI may be immature, and we should not jump to predictive regulation that would stifle or shut down progress without defining harm first.
    
