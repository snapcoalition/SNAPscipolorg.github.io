    "We have gotten rid of screwworm before, so I would start with what we already know works. The state needs to work with USDA, veterinarians and ranchers on finding cases early, inspecting livestock and getting sterile flies where they are needed. If the Texas Animal Health Commission needs more people or resources to do that work, we should provide them.
    
    I also want ranchers to know what is happening and what is expected of them. They need to know what to look for, who to call if they find something and what restrictions are in place. And those restrictions need to make sense. If livestock movement has to be limited to stop the spread, then we should do it. But when an area is clear, we should not leave restrictions in place just because it takes the state another month to catch up.
    Once we get through the immediate outbreak, I think we need to look at where we were caught short. Do we have enough large-animal veterinarians in rural Texas? Are the state and federal agencies sharing information quickly enough? Can we identify a new disease or pest before it has already spread across several counties? Those are questions worth answering now, while we have a very real example in front of us.
    I would listen to the veterinarians, entomologists and producers who deal with this every day. Screwworm can do tremendous damage if we let it spread. I would rather Texas spend the money to find it and stop it early than spend a whole lot more trying to clean up the damage later.

