    I support investing in modern water-quality monitoring, real-time sensors, improved wastewater and storm water infrastructure, and technology that allows us to detect pollution earlier. We also need accountability for businesses and other entities that pollute our waterways while making sure responsible businesses have clear standards they can meet.

    I support incentives for efficient irrigation, water recycling and reuse, groundwater conservation, and innovative agricultural practices that protect our water while allowing farmers to continue producing the food we depend on.

