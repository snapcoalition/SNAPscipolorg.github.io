    Texas universities and hospitals are running world-class research on $1.9 billion a year in NIH funding, and that money doesn't just fund lab equipment, it funds the people, the facilities, and the compliance infrastructure that keep patients safe and discoveries moving. A flat 15% indirect cost cap ignores the rates institutions actually negotiated based on real, audited costs, and it would blow a $300 million hole in Texas research overnight. That's not fiscal discipline, it's a funding cut dressed up as an efficiency measure, and it would land hardest on cancer centers, teaching hospitals, and public universities that don't have deep endowments to absorb the gap.

    I'd oppose the proposed cap and support legislation protecting negotiated indirect cost rates, along with stable, multiyear NIH appropriations so research institutions can plan for the long term instead of lurching from budget fight to budget fight. At the state level, I'd support Texas stepping up with bridge funding and university system investment to protect jobs and ongoing trials if federal funding gets disrupted, because tens of thousands of Texas jobs and patients mid-treatment shouldn't be collateral damage in a budget dispute.

    This is personal to me as a cybersecurity professional: I've seen what happens when institutions get told to do the same mission with a fraction of the infrastructure funding. Research doesn't get more efficient. It gets less safe, less rigorous, and less reliable.

    **Standout takeaways:**
    Oppose the 15% NIH indirect cost cap, it's a cut disguised as reform.
    Protect negotiated indirect cost rates and push for stable, multi-year NIH funding.
    Support state-level bridge funding to protect research jobs and ongoing trials.
    Underfunded infrastructure makes research less rigorous, not more efficient.

    **Keywords:** protect NIH funding, oppose indirect cost cap, research infrastructure, Texas research jobs

