    I strongly believe public policy should be built on a foundation of scientific evidence. I spent my career as a telecom systems analyst, where decisions were made from data, not hunches, and I've run my campaign the same way. If I can't verify a claim, I don't use it, even when it would help me.

    When scientific claims compete or are uncertain, I'd look for independent, peer-reviewed research and the consensus of experts in the field. I'd also ask who paid for the study, because industry-funded research deserves extra scrutiny. Where the evidence is truly uncertain, I'd choose the cautious path that protects people's health, water, and land until we know more.

    When scientific consensus and public opinion disagree, policy should follow the consensus. My job isn't to follow polls on facts. It's to explain the evidence honestly and respectfully, listen to people's concerns, and earn their trust. Facts aren't up for a vote, but the values we bring to decisions belong to the people I represent.
  
    **Keywords:** Evidence first · Verify before you claim · Follow the money · Consensus over polls · Explain, don't dismiss
    
