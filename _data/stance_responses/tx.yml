    As a Texan, I remember the screwworm eradication efforts of the '60s and '70s. Several of my family members were Texas ranchers at the time, and I remember firsthand helping treat sheep and cattle for screwworm infections and the horrible lesions they caused. I also saw the sterile fly program work, and I know we can win this fight again.

    I support quarantines on livestock imported from infected areas, and I strongly support federal and state funding for new eradication efforts, including inspection and treatment of infected animals, sterile fly releases, and better surveillance technology. At the state level, that means fully funding the Texas Animal Health Commission and Texas A&M AgriLife, and coordinating with Texas Parks and Wildlife, because the flies infest deer and wildlife too. It also means cost-share help for family ranches, so no rancher has to choose between reporting a case and staying afloat. Early detection only works if reporting doesn't punish the people who report. And we need more rural large-animal vets, who are the front line of this work.

