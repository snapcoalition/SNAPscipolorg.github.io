    Healthcare should put the American people back in the driver’s seat.

    The affordability problem is real. A 2025 Altarum survey of more than 1,380 Virginia adults found that 72% were worried about affording healthcare in the future, and 69% reported delaying or going without care because of cost. 

    I believe America can do better, but I do not believe the answer is simply handing more control of our healthcare system to Washington. I believe in capitalism and genuine free-market competition. When consumers have choices, understand what things cost, and providers have to compete for their business, I believe we can drive costs down while improving quality, innovation, and customer service.

    Unfortunately, healthcare today often does not operate like a true competitive marketplace. Patients frequently have little idea what a procedure, test, medication, or hospital service will cost until after they receive the bill. They may have limited choices among insurers or providers, and changing jobs can mean changing or losing coverage. That leaves the patient with too little control.

    My American Health Freedom Plan starts by changing that relationship. I would protect coverage for people with pre-existing conditions while increasing competition, patient choice, portability, and transparency. Healthcare decisions should remain between patients, their families, and their doctors—not insurance companies or government bureaucracies. 

    First, I would make real price transparency a priority. Patients should be able to know and compare prices before receiving non-emergency care whenever reasonably possible. My plan calls for upfront pricing disclosure, standardized billing, public comparison tools, and meaningful enforcement of transparency requirements. If hospitals, providers, and insurers know patients can compare price, quality, and service, they have a greater incentive to compete for those patients. 

    Second, I would expand competition and consumer choice. I support allowing Americans greater ability to purchase health insurance across state lines where appropriate, expanding portability so people are not trapped in a plan simply because of where they work, and giving families more control over their healthcare dollars through expanded Health Savings Accounts.

    Third, we have to expand access to actual healthcare—not simply insurance cards. That means addressing provider shortages, expanding direct primary care, protecting access to telehealth, and using technology to reach people who have difficulty getting an appointment or reaching a provider. My plan specifically calls for permanent telehealth protections and solutions for rural and underserved communities. 

    Fourth, we need more competition throughout the healthcare industry. I would examine anti-competitive practices, consolidation, and prescription-drug middlemen that can increase costs without improving the patient's care. A free market only works when there is genuine competition—not when a handful of large organizations dominate the choices available to consumers.

    I do not want a healthcare system controlled by Washington, but I also do not want one where the American patient feels powerless against an insurance company, hospital system, or pharmaceutical company.

    I want doctors, hospitals, insurers, and drug companies competing for the American patient's business. They should have to earn that business through better prices, better outcomes, innovation, and better customer service.

    My goal is straightforward: lower costs, more choices, better access, better quality, and greater control for the American people.

    Healthcare is one of the most personal decisions a family makes. The patient should be in the driver's seat, the doctor should be beside them, and government should establish fair rules of the road—not decide where they are going.

    KEYWORDS: America's Greatest Days Are Still Ahead of Us

