    My decisions on federal science funding would be guided by a simple principle: America should invest in discovery where it strengthens our health, prosperity, national security, and ability to lead the world—while demanding scientific merit and accountability for every taxpayer dollar.

    I strongly support basic research. Not every important discovery produces an immediate commercial return, and some of the technologies and medical advances we depend on today began with fundamental research whose eventual application was not obvious at the time. NSF’s existing merit-review system is designed around intellectual merit, broader societal impact, and evaluation of results, which is the kind of competitive, evidence-based approach I would want federal research funding to follow. 

    My priorities would be:
    - Scientific merit before politics. Funding decisions should be driven by rigorous science, qualified researchers, reproducibility, and the potential to advance knowledge—not partisan ideology or political fashion.

    - American health and medical breakthroughs. NIH research should remain focused on preventing disease, improving diagnosis and treatment, extending healthy lives, and reducing illness and disability. That is the core purpose of NIH and an appropriate federal responsibility. 

    - National competitiveness and security. I would place significant emphasis on fields where America cannot afford to surrender leadership: AI, cybersecurity, quantum science, biotechnology, semiconductors, advanced manufacturing, energy technology, and nuclear science. NSF itself currently identifies many of these technologies as major research areas. This aligns directly with my Promise for America, which calls for a new American jobs ecosystem based on manufacturing, innovation, AI readiness, emerging technology, and critical-technology production. 

    - Turn American research into American opportunity. When taxpayers help fund discoveries, I want more of the resulting innovation, intellectual property, companies, manufacturing, and jobs to stay in the United States. Federal research should be an engine that helps American entrepreneurs and private investment take discoveries from the laboratory into the marketplace.

    - Accountability and stewardship. Supporting science does not mean writing blank checks. I would support strong audits, program reviews, safeguards against waste and duplication, protection of sensitive research from foreign adversaries, and measurable accountability. Research agencies should be able to explain what they are trying to accomplish and how taxpayer dollars advance their missions.

    I would also protect the research workforce itself. America cannot lead scientifically if young researchers, engineers, physicians, and technical professionals see no future here. We should develop domestic talent, strengthen partnerships among universities, community colleges, laboratories, and private industry, and build pathways into the high-demand scientific and technical careers that will define the next generation of the American economy. That is consistent with my platform's emphasis on workforce development, AI skills, apprenticeships, and emerging-technology careers.

    I do not see this as a choice between supporting science and being fiscally responsible. Good government should be capable of doing both.

    America has led the world because we have always been a nation of builders, inventors, scientists, entrepreneurs, and people willing to explore what comes next. I want federal science policy to preserve that spirit: fund excellent research, protect the taxpayer, strengthen American security and health, and make sure American innovation continues to create American opportunity.

    KEYWORDS: America's Greatest Days Are Still Ahead of Us

