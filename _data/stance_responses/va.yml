    As someone who has lived and worked in this district for years, I know NSF headquarters is a real employer for roughly 1,600 people here in Alexandria. Those are our neighbors. I also spent 27 years inside federal agencies managing facilities, budgets, and contracts. I saw how money actually moves, how overhead grows, and what happens when you raise questions about waste. That experience shapes how I look at every federal agency, including science agencies.

    The federal government’s proper role is not to be the default funder of every research program universities want. Basic science has value, but so does fiscal reality. We have a massive national debt. Congress should fund only what is clearly within its constitutional lane and can show results that taxpayers can evaluate. Mission-driven work tied to defense, public health emergencies, or other limited federal responsibilities is easier to justify than open-ended academic grants that become self-perpetuating.

    I would not campaign to shutter NSF tomorrow or throw 1,600 Alexandrians out of work. I would support policies that:

    - Demand transparent budgets and measurable outcomes instead of treating agency headcount as an entitlement.
    - Reduce administrative bloat and grant overhead so more dollars actually reach research rather than process.
    - End the habit of using science agencies as vehicles for political or social priorities unrelated to rigorous inquiry.
    - Encourage private, philanthropic, and industry funding to carry more of the load for curiosity-driven work, as happened for much of American scientific history.
    - Apply the same waste-cutting standard I would apply to every other federal operation I have seen from the inside.

    Local jobs matter. Protecting an unaccountable bureaucracy does not. Northern Virginia should not treat federal agencies as permanent economic development projects that are off-limits to scrutiny. Families here already pay high costs of living; they should not also subsidize inefficiency just because the building is in Alexandria. If elected, I would treat NSF and similar agencies the same way I treat every other part of the federal machine: insist on accountability, cut what does not work, and stop expanding government simply because it is already here.
   
