    The principle is simple: whoever causes the cost pays the cost.

    I’ve spent 11 years modernizing the power grid. A data center can draw as much power as a small city. The lines, substations, and generation it needs shouldn’t land on a family’s bill in Chesapeake.

    Like it or not, this industry is exploding with no clear limits yet. The White House’s Ratepayer Protection Pledge has the right goal but no enforcement, and voluntary promises are not going to cut it. Governor Spanberger’s Data Center Accountability Framework is a reasonable start, but the federal government has to do its part, and quickly.

    I would:

    Support state and local pauses on new approvals until cost, water, and land-use rules are in place. Projects already approved should proceed, but owners must understand they will be liable for failing to meet legal standards. Build it quick and ask forgiveness cannot be tolerated.
    Back federal rules requiring large users to pay for the grid upgrades they trigger, locked into law.
    Require closed-loop cooling where water is scarce, as it is in Hampton Roads.

    Data centers potentially bring jobs and tax revenue, but they shouldn’t get a discount paid for by families, cost neighbors their property values, or make farming impossible or irrelevant.

    KEYWORDS: Constitution, Readiness, Immigration, Energy         
    
