    I am a licensed professional engineer. I was trained to use data, test assumptions, and change course when the evidence changes. Science should inform policy. A job title should not.

    “Subject matter expert” is not a reliable source by itself. During COVID we were told to trust SMEs while they hid uncertainty, punished dissent, and moved the goalposts. Expertise can be real. It can also be captured, grant-driven, or politically screened. I will not treat an agency badge, a dean’s title, or a consensus statement as proof.

    Evidence belongs in the process the same way engineering review belongs on a project: on the table, in writing, open to challenge. I would look at measurements, methods, funding, replication, and real-world results—not at who was invited to the briefing. Dissenting engineers, physicians, and researchers get a hearing too. If they have better data, they win the argument.

    How I would use evidence:

    - Ask what was measured, who paid for it, what the uncertainty is, and whether anyone has reproduced it.
    - Separate established engineering and physical science from politicized modeling and public-health messaging.
    - Judge a policy by what actually happened to families, not by the résumé of the person who recommended it. If school closures, mandates, or energy rules fail in the real world, the expert who promoted them does not get to keep the policy in place just because of their title.
    - Keep values in their lane. Data can describe risks. It cannot cancel parental rights or informed consent.

    On uncertainty: say it out loud. If the evidence is thin, evolving, or split, the public should hear that. I would rather tell constituents “we do not know yet” than launder a guess through an expert panel and call it settled.

    Experts can advise. They are not an authority I outsource my vote to. Elected officials decide, show their work, and answer to voters.

