    Define the mission, then staff to it.

    Public health and research agencies do work no one else does: tracking outbreaks, inspecting food and drugs, moving research grants. In 2025, HHS announced cuts from 82,000 employees to 62,000, with little public accounting of what work would stop. A headcount target isn’t a plan.

    I would:

    Require agencies to show Congress the mission impact before major reductions, then fund what the mission requires.
    Cut genuine waste and duplication. In 2022, GAO found CDC still lacked a connected disease-tracking network, 15 years after Congress required one. It’s unclear whether the 2025 DOGE cuts fixed that or just cut the people working on it.
    Protect hard-to-replace expertise. Rebuilding an outbreak-response or research team takes years and costs more than keeping it.

    Setting staffing levels is Congress’s job. Both parties have handed it to whichever administration holds power.
    
    KEYWORDS: Constitution, Readiness, Immigration, Energy 
    
