    Virginia should remain a leader in technology and innovation, but innovation should not come at the expense of the family paying the electric bill.

    Northern Virginia is the largest data-center market in the world, and that industry brings investment, jobs, tax revenue, and an important role in America’s technology economy. But it also creates extraordinary demand for electricity and requires major investments in generation, transmission, substations, and other infrastructure. Virginia’s own JLARC study concluded that Northern Virginia accounts for about 13% of reported global data-center capacity and that continued growth will require substantial additional power infrastructure. 

    My principle is simple: growth should pay for growth. If a data center requires a new substation, transmission upgrades, additional generation, or other infrastructure primarily because of its demand, the developer and large energy user should bear a fair share of those costs. Residential customers should not be asked to subsidize infrastructure built primarily to serve some of the largest electricity consumers in the world.

    I support separate rate structures for very large-load customers, strong minimum-payment commitments before utilities build infrastructure on their behalf, and protections against residential ratepayers being stuck with stranded costs if a proposed data center is delayed, downsized, or never built. Virginia’s State Corporation Commission has already moved in that direction by establishing a separate GS-5 class for customers demanding 25 megawatts or more, along with minimum-demand payment requirements intended to protect other customers. 

    But protecting ratepayers is only half of the answer. We also need more energy. My Promise for America is built around energy abundance: modernizing our grid, increasing transmission and substation capacity, strengthening reliability, rebuilding critical equipment supply chains, and dramatically expanding reliable American generation. 

    That is why advanced nuclear power and small modular reactors are central to my plan. I support creating Nuclear Ready Grid Zones where states, utilities, and private developers can accelerate advanced nuclear deployment, including generation capable of supporting major data-center and manufacturing loads. Instead of responding to growing demand by continually raising the cost of scarce electricity, America should increase the supply of reliable power.

    I also believe data centers need to be strategically located. Economic development matters, but so do the families already living in these communities. Local decisions should seriously consider proximity to homes, transmission infrastructure, noise, water use, traffic, and the capacity of the existing electric grid.

    As a former town manager, I understand that infrastructure has a cost and somebody eventually pays for it. The responsibility of government is to make sure that cost is allocated fairly—not simply passed along to the easiest customer to bill.

    Utility rate design in Virginia is primarily a state responsibility through the State Corporation Commission, so I would not pretend that a member of Congress sets Dominion’s residential rates. My role in Congress would be to attack the underlying problem: accelerate reliable generation, modernize the grid, reform permitting, strengthen domestic transformer and critical-equipment manufacturing, and support federal policies that prevent extraordinary large-load costs from being unfairly shifted onto ordinary households.

    I welcome data centers, AI, and technological growth. I want Virginia and America to lead the world in these industries. But leadership requires responsibility. The companies creating extraordinary demand should help pay the extraordinary costs of serving that demand—and the family at the kitchen table should not be handed the bill for the server farm down the road.

    We can have innovation, economic growth, and affordable electricity. The answer is fair cost allocation and more American energy—not asking Virginia families to choose between technological progress and an affordable electric bill.

    KEYWORDS: America's Greatest Days Are Still Ahead of Us

