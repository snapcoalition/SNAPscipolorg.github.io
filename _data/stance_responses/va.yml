    Data centers should pay their own way. I will not ask working families in this district to subsidize AI campuses and hyper-scale developers through higher Dominion bills.

    Virginia already hosts the world’s largest data-center market. That growth has brought tax revenue and some construction jobs, but the power and water those facilities consume are not free. When Dominion proposes a 14 percent residential rate hike and points to data-center and AI demand, that is a warning that costs are being socialized onto households while the profits stay private. That is backwards.

    I support policies that put the incremental cost of new load on the customers who create it. Developers should fund the generation, transmission, and water infrastructure their projects require—on-site generation, dedicated substations, long-term power-purchase agreements, and water recycling—rather than rolling those costs into the residential rate base. Localities should not compete to give away tax breaks and cheap utilities if the result is higher bills for the people who already live here.

    I also oppose using ratepayers to bankroll unreliable generation schemes that cannot actually serve 24/7 data-center load. Families need affordable, dispatchable power. Data centers that want firmed supply should contract and pay for it themselves.

    Growth is fine. Shifting the bill onto Northern Virginia homeowners is not. If elected, I will treat this the same way I treat other special-interest subsidies: the people who profit from the demand should carry the cost of meeting it.

