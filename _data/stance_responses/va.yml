    For rural communities, I would encourage independent clinics, telehealth services, and incentives for healthcare professionals to practice in underserved areas. I also support improving access to prenatal and maternity care, particularly where hospitals have reduced services.

    My proposed Veterans 28 Act would require VA appointments within 28 days, or 20 days for mental healthcare, with timely access to community care when those deadlines cannot be met.

