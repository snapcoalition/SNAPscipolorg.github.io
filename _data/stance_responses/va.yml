    Whatever your politics, health care needs fixing. One party talks about Medicaid cuts, the other about ACA fraud. Neither leads with the patient.

    Start with what exists. The ACA is law and needs repair, not another repeal-or-replace fight. After the enhanced premium credits expired last year, 76,000 Virginia marketplace policies were canceled for nonpayment by May.

    I would:

    Fix prior authorization. My neighbor, a pediatric oncologist, spends half his time fighting for approvals instead of treating children. That’s waste we all pay for.
    Lower prescription costs for seniors on fixed incomes by expanding Medicare’s power to negotiate drug prices.
    Cut reliance on emergency rooms, the most expensive front door in medicine, by working toward a simple baseline of coverage that workers can build on.

    Simpler systems cost less to run. That’s fiscal conservatism applied to health care, and it starts with treating patients, not paperwork.   
    
