    American households have on average 21 devices connected to the Internet, from smart phones and tablets to TVs, thermostats and even refrigerators. This number will only grow as AI becomes more intertwined in our daily lives. As a result, data centers could account for up to 12% of U.S. electricity use within a few years. Today, the costs of that growth overburdens consumers and small businesses instead of the data centers that drive the demand.  That is why I have cosponsored legislation, such as the Ratepayer Protection Act, to require state utility regulators to ensure that data centers pay for the costs of building new power generation, transmission lines, and other upgrades to serve large-load customers, such as data centers, as the Virginia State Corporation Commission did by establishing a new rate class for hyperscale data centers in Dominion’s service territory. I also have cosponsored the Load Forecasting Enhancement Act to require the Federal Energy Regulatory Commission (FERC) and state utility commissions to better coordinate load forecasting to prevent underbuilding infrastructure or overcharging consumers for unneeded capacity. And I have cosponsored the Power to the People Act, which would create clear FERC guidelines and rules ensuring that local communities do not bear the cost of data center build out. We must ensure that we continue to meet our technological demands while protecting consumers from bearing the financial burden. We must also ensure we do not overburden our grid or our environment, which is why we must continue to invest in clean-energy technologies to meet growing demand while protecting the planet for future generations. 

    I have also condemned the Trump administration’s Environmental Protection Agency (EPA) attempts to undermine the Clean Air Act by allowing data centers, fossil fuel plants and other major facilities evade the Clean Air Act regulations. Specifically, I urged the agency to withdraw a proposed rulemaking that would allow major polluting facilities—including data centers and fossil fuel plants—to begin construction activities without securing air quality permits required under federal law. Communities should not be forced to bear additional pollution because EPA chose to prioritize the financial interests of developers and fossil fuel companies over the Clean Air Act’s public-health protections.

    KEYWORDS: Healthcare, Voting Rights, Energy & Environmental Policy, Lowering Costs

