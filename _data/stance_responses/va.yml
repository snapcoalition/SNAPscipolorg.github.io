    Evidence should inform every vote. It shouldn’t make the decision for me.

    I’m an engineer by training. Engineers test a design before they build it, and they engineer for a fact rather than arguing about one. In the Marine Corps, I made decisions on intelligence that was never complete. Good intelligence officers told me what they knew, what they didn’t, and how confident they were. I’d expect the same from experts, and I’d hold myself to it.

    Experts tell us what is likely. Congress decides what we’re willing to pay and what risks we’ll accept. Those are value judgments, and I’ll own them rather than hide behind a study.

    When evidence changes, I’ll say so plainly: here’s what we knew, here’s what’s new, and here’s why my position changed. Changing your mind because the facts changed isn’t weakness. Refusing to is.
    
    KEYWORDS: Constitution, Readiness, Immigration, Energy         
                
    
