    Science funding is an investment, and I’d judge it like one.

    First, Congress controls the purse. It appropriated $47.2 billion for NIH this year, yet by midyear only a fraction had gone out. When Congress funds something, the money should move. Anything else erodes the rule of law.

    Second, stability. Research runs on multiyear timelines. Proposals to cut NSF by more than half, two years running, plus shutdowns both parties tolerate, waste money already spent and push good researchers out.

    Third, accountability. If overhead costs are too high, fix them through legislation, not a flat cap the courts have already struck down.

    Fourth, focus: medical research, energy, and defense-relevant science that keeps our forces ahead.

    I’m an aerospace engineer by training. Fiscal conservatism means spending research dollars well, not starving the basic research every industry depends on.

    KEYWORDS: Constitution, Readiness, Immigration, Energy    
    
