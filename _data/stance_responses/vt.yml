    “I grew up in a mill town in Connecticut where the river was polluted beyond the point where it would sustain life. I know the damage that unrestrained industrial development can cause. I support responsible stewardship of all of our natural resources. Critical resources and habitats must be protected. There is a place for responsible development, both residential and commercial, but not at the expense of our envronment, wildlife and other natural resources.” 
    
