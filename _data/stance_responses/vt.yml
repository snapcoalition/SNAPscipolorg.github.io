- candidate_first_name: Wayne
  candidate_last_name: Laroche
  state: vt
  race: State House of Representatives
  district: 5
  party: Republican
  question: vt-q1
  date: 
  response: |
    "Our water resources are renewable and quite valuable today.  However, they have been substantially degraded by past land and water use practices.  It is in the best interest of Vermont's community as a whole to restore our rivers and lakes along with the fish, wildlife the ecosystems they depend on.

    For example, I have long advocated for things like removal of the Swanton Dam which would upon up 7 1/2 miles of the lower Missisquoi River to return spawning walleye, lake sturgeon, redhorse suckers, and other species to 

    spawning habitat at Highgate Falls; the separation of storm water from our cities sewage treatment plants; as well as reasonable control of agricultural, forestry, urban, roadway and other sources nutrients and sediments are other places on which to focus attention and action.

    Lands that have been acquired for public use should be managed sustainably such that those uses can be provided for to as many people as feasible.  There are some special cases.  For example, Fish and Wildlife Lands have been purchased and managed almost entirely by taxes and fees charged to hunters, anglers and trappers.  That investment should and must be respected. I say "must" because federal grants received each year from the Pittman-Robertson and Dingle-Johnson excise taxes are contingent upon maintaining the intended use.  The same may be said for city and state parks recognizing their intended uses and funding streams."
    
    KEYWORDS: 
    
