  party: Republican
  question: vt-q4
  date: 
  response: |
    "Once again Vt looks to jump in with both looking to block an emerging technology instead of looking for benefits and waiting to see how bigger richer states proceed.  It is impossible for us to foresee where this technology will lead.  It will take at least a beginning of a track record before we can better judge where the path might go.  One thing for sure -- It is headed somewhere and will not be stopped.  We can get on the train or stand in front of it.   As far as energy goes, our politicians have made questionable decisions in the past...again pushed by the hype of those same so-called environmentalists and uninformed/misinformed citizenry.

    Our decisions should be well informed via testimony from a broad array of technical and knowledgeable people...not just a few select, like minded folks. Or those with matching private agendas.

    Of course, this all presumes that our elected officials can objectively make good decisions and policy.  Judge for yourself how that has been going."

    KEYWORDS: 

- candidate_first_name: Wayne
  candidate_last_name: Laroche
  state: vt
  race: State House of Representatives
  district: 5
  party: Republican
  question: vt-q5
  date: 
  response: |
    "Our politicians shut down VT Yankee.  Again, all hype.  No, real technical or financial reasons that I am aware of.  We are going to need more electricity.  Our transmission system is aging and not robust enough.  We have no significant hydropower to develop, we could be burning more wood (yes, our forests are aging, our age-structure and diversity has been limited by historical forest and land-use practices, once again the has been hype for "old growth" which is well and good, however, if our forests are not managed well...fuel will eventually reach levels where...once again, our forests will burn like they did in the past.  Maybe, better to burn a little for electricity?)  Coal is not popular,  Gas might be feasible, but distribution issues will remain.

    The future will be with nuclear energy.  I have no doubt at this point.  The technology has been rapidly advancing.  Small, modular nuclear plants are designed for safety, don't use water for cooling, have, close to zero emissions and could be dispersed and placed in such a way as to allow growth despite our aging transmission system. Check out Valar Atomics and other companies developing microreactors.

    Once again, I would advise a close look before jumping in with both feet."

    KEYWORDS: 

