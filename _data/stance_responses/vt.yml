- candidate_first_name: Wayne
  candidate_last_name: Laroche
  state: vt
  race: State House of Representatives
  district: 5
  party: Republican
  question: vt-q3
  date: 
  response: |
    "To begin with...who says flood risk is increasing?  Just because we have a sequence of floods in recent years does not necessarily mean that things have changed that much over the past 1000 years.  A lot of propaganda has been spewed in the last 30-40 years about climate change.  When that happens, follow the money...look for the motive.  There are written historical records of many floods prior to the installation of stream flow gages beginning about 1900.  There is a reason that so few covered bridges remain.  So, our stream records are barely 100 years old. We should not be focusing on things we can not control...after all "the weather" is a classic.  We should focus on problems we can solve.   Our cities and villages have been build in the flood plains, often on the banks of the stream.  Stream channels have been straightened, stream bank vegetation has been removed, gravel extracted, channels narrowed by bridges, road and railroad building.  We need to incrementally continue to fix these problems as opportunities and money allow.  We need to take actions that actually make a difference.  Take the 3-acre rule for impervious surfaces, for example.  The stated purpose for this rule was -- to reduce phosphorus run-off.  I argue: there is no source of phosphorus on roofs, parking lots or roadways...unless someone spreads something on those surfaces.  This law is costing a great deal of money, achieving little or nothing positive while diverting money that could be spent on more effective practices.  In my opinion, Hype got us that rule...sound science is disrespected.  Our environmental "advocates" have provided us with a whole string of environmental hype and crisis over the 30-40 years with political solutions that were costly and did not work.  Just look at the issue of PCBs in schools.  Millions spent to find out that we can't afford to tear down every school in the state and rebuild them...so, we stop testing.  Science just might indicate that this issue should be treated as a Risk Management Issue with protocols and methods developed to effectively mitigate the risk...understanding, that monitoring is needed and that there is no such thing as zero risk."

    KEYWORDS:

- candidate_first_name: Wayne
  candidate_last_name: Laroche
  state: vt
  race: State House of Representatives
