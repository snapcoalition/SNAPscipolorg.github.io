    I support sustained investment in forest thinning, hazardous fuel removal, prescribed burning, defensible-space programs around vulnerable communities, and reliable staffing for early detection and rapid response.

    I also believe Washington should partner more closely with tribal nations. Indigenous communities have stewarded these landscapes for generations through practices such as cultural burning to reduce fuel loads and lower the risk of catastrophic wildfire. That knowledge belongs in the conversation alongside foresters, firefighters, researchers, and local land managers—not apart from it. Good stewardship means listening to the best available evidence, wherever it comes from.

    Finally, I’d expect real accountability for wildfire funding by tracking whether prevention dollars are producing measurable results, not just appropriations that sound good on paper. My goal is to reduce catastrophic wildfire risk before disaster strikes rather than simply become better at responding afterward.
    
