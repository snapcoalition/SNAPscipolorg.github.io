    Farmers are the backbone of the Inland Northwest, and family farms are shuttering at an alarming pace. Our government needs to take immediate action to remedy this and support farmers and agricultural distributors while maintaining Washington’s commitment to environmental sustainability.

    We need to limit corporate control of our farms and provide stability to the commodity market. We should not get into trade wars that create additional challenges for farmers and agricultural distributors. Instead, we need policies that provide stability and support to family farms and the communities that depend on them.

    I also support restoring USDA funding cuts that connect farmers to their local communities. This includes restoring funding for the Local Food for Schools and the Local Food Purchase Assistance Program. These programs help connect farmers to their communities while providing important resources for local food systems.

    Farmers should also have the right to repair their own equipment. The Right to Repair would allow farmers to work on their own equipment, giving them greater control over their farms and reducing barriers to maintaining their operations.

    Supporting family farms requires limiting corporate control, providing stability to commodity markets, restoring USDA funding, protecting the right to repair, and strengthening connections between farmers and their local communities. These policies can help address the challenges facing farmers and agricultural distributors.
    
    KEYWORDS: affordability; Right-to-Repair; communities 

