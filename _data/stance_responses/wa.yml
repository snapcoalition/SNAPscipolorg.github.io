    Washington has a responsibility to be a good steward of its natural resources, and stewardship requires accountability. My priority is funding projects that address clear environmental needs, produce measurable results, and make responsible use of taxpayer dollars.

    I would prioritize research and projects that improve water quality, reduce wildfire risk through better forest management, strengthen salmon habitat where outcomes can be measured, improve the resilience of critical infrastructure to natural hazards, and encourage clean technology innovation that can compete on its merits while creating long-term economic opportunities for Washington.

    Good stewardship means listening to the best available evidence, wherever it comes from—scientific research, independent performance data, local land managers, and tribal nations, whose generations of experience with practices such as cultural burning have helped shape healthy landscapes in the Pacific Northwest.

    Evidence should guide these decisions, but it isn’t the only consideration. Legislators must also weigh constitutional rights, economic impacts, and the long-term interests of Washington families. I’d rather fund fewer projects well and prove they work than fund many and hope.
    
    KEYWORDS: stewardship, accountability, evidence

