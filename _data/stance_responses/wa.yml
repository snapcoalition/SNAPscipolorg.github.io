    Artificial intelligence is one of the most significant technologies of our time, and Washington has a real opportunity to lead in both innovation and responsible governance. I support policies that encourage AI research, entrepreneurship, and high-paying jobs while protecting privacy, intellectual property, public safety, and critical infrastructure.

    Data centers are an important part of that future, but growth should pay its own way. Utilities in Grant, Douglas, and Chelan counties have already flagged rising demand from server farms, and ratepayers deserve to know how those costs are allocated before bills rise further. I support transparent, publicly disclosed agreements between utilities and data center operators so communities can understand the costs, benefits, and tradeoffs before approving new capacity. Infrastructure costs should be borne by those creating the demand, not shifted onto residential ratepayers.

