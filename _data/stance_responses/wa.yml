    The United States Forest Service plays an essential role in understanding local forests and managing public lands. Closing 57 research stations and consolidating others would hinder the agency’s ability to understand the diversity of local forests and create a severe roadblock in the fight against climate change. These cuts would have adverse impacts on public lands and the communities that depend on the Forest Service to protect lives, property, and local economies.

    Our public lands belong to the American people and should be responsibly managed for recreation, hunting, fishing, and conservation. I would advocate for accountability and access to the resources necessary to protect these lands and the people who depend on them. Our resources are finite and should not be used as a tactic to further a political agenda. Maintaining strong institutions and adequate funding is essential to keeping Washington’s communities, public lands, and natural resources safe.
    
    KEYWORDS: Funding; prevention; resources

