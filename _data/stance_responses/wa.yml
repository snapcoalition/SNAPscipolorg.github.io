    Second, remove the barriers to clean energy deployment. An investigation by ProPublica and Oregon Public Broadcasting found our state ranked dead last in renewable energy growth. Transmission, interconnection, and permitting have failed to keep pace, so I would prioritize funding for transmission upgrades, interconnection reform, and permitting capacity so clean-energy projects can actually be built.

    Third, protect Puget Sound. Fund stormwater projects targeting 6PPD-quinone—the tire-wear chemical University of Washington researchers found is highly toxic to coho salmon—along with culvert replacement, habitat restoration, and microplastics research. I also support strengthening, fully implementing, and enforcing Washington's Recycling Reform Act.

