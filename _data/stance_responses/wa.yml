    As a physician and public health educator, I view wildfire policy as both an environmental and a public health priority. Wildfires threaten lives, homes, critical infrastructure, air quality, drinking water, and rural economies. Washington needs a science-based, proactive approach rather than simply responding after disasters occur.

    I support increasing investments in evidence-based forest management, including strategic thinning, prescribed burning where appropriate, fuel reduction near communities, and restoration of fire-resilient forests. These efforts should be developed in partnership with Tribal Nations, whose traditional ecological knowledge has demonstrated the value of cultural burning practices.

    As smoke-related illness increasingly affects children, older adults, and people with chronic disease, we should invest in clean-air shelters, school air filtration, and public health preparedness. I remember during one of the worst wildfire seasons since we relocated to Spokane in 2005 a high school student-athlete trying to compete in cross country struggling to breathe at various times during the season. This is a health risk and has become more the norm. This is also dangerous. Wildfire prevention efforts need to be ramped up to prevent secondary health-risk and loss of property (and lives).
    
    KEYWORDS: Prevention, forest health, fire suppression, public safety

