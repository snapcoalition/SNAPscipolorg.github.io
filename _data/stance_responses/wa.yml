    Wildfire policy should focus on prevention, preparedness, and measurable results—not simply larger emergency budgets after fires begin.
    
    First, fund prevention consistently. In 2021 the Legislature unanimously committed $500 million over eight years to forest health and wildfire preparedness (HB 1168)—and it worked, measurably reducing damage where fuels were treated. Yet in 2025 lawmakers cut that funding roughly in half—the year Bear Gulch burned—then restored it under public pressure, and only through mid-2027. Independent analysis shows prevention returns roughly $8 per $1 spent. That commitment should be protected, not an annual political fight.
    
    Second, expand science-based forest management: strategic thinning, prescribed burning where appropriate, and fuel reduction near communities—guided by local ecological conditions and the best available science.

    Third, prepare Western Washington, where roughly 40% of last year's fires started: early-detection networks, defensible space, home-hardening, and evacuation planning.

    Fourth, treat smoke as a public health emergency: clean-air shelters, school filtration, and forecasting—smoke harms far more people than flames.

    Every program should report acres treated, risk reduced, and cost-effectiveness. My approach is informed by the U.S. Forest Service, National Interagency Fire Center, and Washington DNR.
    
    KEYWORDS: Prevention, Forest Management, Accountability

