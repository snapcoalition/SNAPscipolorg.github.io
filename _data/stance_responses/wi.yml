    First, policies that relate to workforce development are implemented on three different governmental levels: local, state-wide, and federal. I believe most such policies "Wisconsin currently has ~800,000 public ed students. That means two decades ago they had ~60,000 more statewide. Obviously the rural decline is a function of economic realities that one local school cannot prevent. But when they sadly must close, those students are going elsewhere. A lower birthrate may explain a small drop, but there are clearly other factors at play. Jumping to the question, here are policies I would support to improve K-12 education in WI:

    First, stop the Big Lie. The Big Lie is that schools are “telling” many of their students that he or she passed, but in reality many have not met the standards set for their grade level!  They are, in reality, “approaching” those standards, or--worse--merely “developing.”

    For the Madison Metropolitan School District in 2024-5, those tested for English scored as follows: 
    1) whites: 78% either “Advanced or Meeting” standards; 22% were either “approaching,” or      “developing.”
    2) blacks: 16% meeting standards; 84% not meeting standards

    For Math:
    1) whites: 73% meeting; 27% not meeting
    2) blacks: 12% meeting; 88% not meeting   

    To find these scores, go to https://dpi.wi.gov/accountability/report-cards  Then the green box “click here for school and district report cards.” Then search on a school district, or an individual school.

    A result of the Big Lie is by the time they reach high school, only 73% of white students, and only 12% of black students, are in position to succeed in STEM classes.

    I’m running out of room to go on, except to say that a major reason schools are perpetuating the Big Lie is they are afraid to crack down on the ~10% of the student body that is not serious about learning, and more interested in showing off, causing trouble, and having fun. If the schools got serious about building a healthy culture of respect and discipline, half of those 10% would get with the program. The other half should be sent to a special “locked down” public school where class sizes are small, there is a no-nonsense approach, and where students could earn the right to go back to their previous school--where all of their friends are--with a week (or more) of good behaviour. See my website for more details.

