    Science should inform policy, not be treated as an afterthought. If elected, I would rely on scientists and subject-matter experts throughout the policymaking process: when evaluating legislation, conducting oversight, assessing economic and environmental impacts, and measuring whether government programs are actually achieving their goals.

    On issues such as public health, agriculture, energy, climate, biotechnology, artificial intelligence, and national security, I believe elected officials have a responsibility to seek out the best available evidence and understand both the benefits and tradeoffs of proposed policies. That means consulting researchers at universities, federal agencies, national laboratories, and private industry, as well as the scientists and engineers working directly in Wisconsin's businesses and research institutions.

    Scientific expertise should not dictate policy on its own, however. Elected representatives must also consider economic realities, ethical concerns, and the needs of their constituents.  With that said, ignoring evidence leads to bad decisions and wasted taxpayer dollars.

    My approach is to start with the data, listen to experts, ask difficult questions, and remain willing to change course when new evidence emerges. Good policy requires humility and a recognition that complex problems are best solved when science, industry, and communities work together.

    KEYWORDS: Evidence. Expertise. Accountability. Adaptability.

