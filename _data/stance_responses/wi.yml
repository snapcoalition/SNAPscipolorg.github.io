- candidate_first_name: Brian
  candidate_last_name: Bock
  state: wi
  race: State Assembly
  district: 61
  party: Democratic
  question: wi-q1
  date: 2026-07-18
  primary_candidate: false
  response: |
    I support responsible AI innovation that balances economic growth with environmental stewardship and community health. As a clinical pharmacist and public health advocate, I prioritize evidence-based policies that protect Wisconsin families while fostering technological advancement. 
    
    I advocate for transparent environmental impact assessments before approving new data centers, requiring water usage disclosure and sustainable cooling technologies. Evidence shows AI data centers consume exponentially increasing energy, straining local utilities and resources. Streamlined permitting should not bypass community input or environmental safeguards. 
    
    I support public investment in AI research focused on healthcare applications, education, and workforce development, ensuring benefits reach all communities rather than consolidating corporate power. Wisconsin should leverage AI for medication management, behavioral health outcomes, and technical college training programs. 
    
    Clear data ownership laws and cybersecurity standards protect patient privacy and prevent algorithmic bias in healthcare and criminal justice. 
    
    Evidence Base: Congressional testimony on AI's economic impacts, University reports (Stanford & Vanderbilt reports were reviewed) on AI regulation, and environmental studies on data center resource consumption inform these positions. 

    KEYWORDS: AI regulation, data center sustainability, healthcare innovation

