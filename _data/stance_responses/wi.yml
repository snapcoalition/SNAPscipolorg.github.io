  response: |
    My quick answer is that yes, there is research necessary, that for-profit companies cannot always underwrite by themselves. In those cases, it is in the best interest of the public to public fund such research. How that is done is where it gets murky.

    Referring back to the 10th amendment, Congress has no authority to control scientific studies. It has taken control--no doubt about that. But such initiatives belong to the states. I’m not insisting every state has it’s own mini NIH. Citizens, and states, can collaborate with each other very well without the imposition of the federal government. There are many examples of this: Hollywood built its empire without the “help” of Congress. Walt Disney create his empire without the “help” of Congress. Cisco Systems basically build the internet without the “help” of Congress. Many large corporations have arisen without the “help” of Congress.  However, more and more large business interests have thought: “Hmmm…We don’t want to have to go to each of the 50 states to set policy for our product…We’ll just go to Congress and see if we can get them to pass a law that paves the way for us to be successful in all fifty states at once!”  When a particular state does not approve of the advantage Congress has given to a big corporation, it is an expensive and heavy lift to try to alter what Congress has done.

    There is also a “middle man” dynamic that is costly. I prefer to see much more of our tax dollars kept by the 50 states, rather then letting the federal government take them, then dole money back to the states, universities, Scientific entities as Congress deems best. That process is rife with opportunities for fraud and corruption. If each of the states kept the tax dollars that would go towards research grants at the state level, they could ensure it either goes to institutions in their state, or  would go to collaboration among many states they knew would benefit the universities and end users in their states. All of this could be done without Congress being involved.  Currently, large, powerful and wealthy Corporations throw their weight around at NIH and NSF to ensure they get a larger share of the grant funding, cutting out smaller but probably more important research that an individual state would recognize as important, and fund. In short, it does not serve the smaller, less political scientific entities in Wisconsin to have to apply to NIH and NSF.  If they were applying to the state of Wisconsin, there would be a more personal touch, better access to the decision-makers, and overall more efficient use of grant money.  

    KEYWORDS: 10th amendment, collaborate, middle man, 

