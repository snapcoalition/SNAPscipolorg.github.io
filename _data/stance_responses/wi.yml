    Artificial intelligence has enormous potential to improve productivity, accelerate scientific discovery, and strengthen American competitiveness, but we cannot ignore its impact on workers, communities, and critical infrastructure. AI is already reshaping white-collar and blue-collar industries, and Congress must ensure that the benefits are broadly shared rather than concentrated among a few large technology companies.

    I support national standards requiring major data centers to publicly disclose projected electricity demand, water use, cooling methods, emissions, and grid-upgrade costs before construction begins. Communities deserve transparency and a meaningful voice in decisions affecting local water supplies, land use, and utility rates. Companies receiving federal incentives should meet strong efficiency standards, invest in water recycling and advanced cooling technologies, and source more energy from clean power.

    We also need policies that prepare workers for disruption. I support expanding Pell Grants, technical education, apprenticeships, and retraining programs so workers can adapt as AI changes the labor market. Companies that profit from AI-driven productivity should help fund workforce development and transition programs.

    KEYWORDS: Transparency. Community Voice. Efficiency. Workforce Protection

