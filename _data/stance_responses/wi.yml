    I support increasing federal investment in public schools, particularly in rural districts that face declining enrollment and shrinking tax bases. Funding formulas should recognize the unique challenges of rural communities, including transportation costs and limited access to specialized courses. Every student should have access to high-speed internet, modern science labs, computer science instruction, and career and technical education programs.

