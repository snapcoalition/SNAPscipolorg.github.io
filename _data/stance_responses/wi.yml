    I oppose indiscriminate cuts to scientific research funding and support multi-year federal funding commitments that give universities and research institutions the stability they need to pursue long-term projects. I also support expanding partnerships between federal agencies, universities, hospitals, and private industry to accelerate the commercialization of new discoveries and ensure that breakthroughs developed in Wisconsin create jobs here at home. 

