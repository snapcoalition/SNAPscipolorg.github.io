  primary_candidate: false
  response: |
    Healthcare is largely out of the hands of State.  We can define access to Medicaid at the margins and limit collection methods.  So, I would maintain and increase access to Medicaid where possible.  The GOP had a bill up this past session to reduce the look back period (reduce access).  It would not get my vote.  

    I would also support any federal efforts towards a single payer system.  We do not have a free market in healthcare.  We do not have a public option in healthcare.  We have the worst aspects of both systems.  I believe that ideally we would have a Medicaid-type system that covered all care for people below a certain income.  Those above that threshold would be covered by a modified Medicare-type plan that in addition to hospitalization would cover other unforeseen significant health issues, like cancer, severe traumatic injuries, major surgery and care, and orphan diseases. They would have the option of purchasing public or, private coverage, or direct primary care plans (sort of like a Medicare Part B, D or C plan) that covered primary care and routine medical needs. 

    _Keywords: Healthcare_

