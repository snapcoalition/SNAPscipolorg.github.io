  response: |
    To a great extent.  I am a lawyer.  I was involved in some of the flood litigation early in my career.  It is very clear that certain weather patterns can be anticipated and that we can anticipate how these patterns are likely to change going forward.  

    It is also clear that science can help us understand the way water infiltrates, the absorption capacity of various soils, and the way land development or timbering impact these rates and flows.  This understanding can inform us on best practices for timbering, road construction, and land development, to maintain water flow as close to a natural state as possible.   

    Many weather events are unavoidable, but scientific analysis can helps us mitigate the consequences.  

- candidate_first_name: Eddie
  candidate_last_name: Wagoner
  state: wv
  race: State House of Representatives
  district: 82
  party: Democratic
  question: wv-q3
  date: 2026-10-21
  primary_candidate: false
  response: |
    Yes.  Absolutely.  One of the worst things that has happened to this country is a great number of us accepting the idea that because there are two political parties, there are two sides, and only two sides, to any issue, and that both are entitled to deference.  This is not so.  You can believe the world is flat.  You can believe vaccines cause autism.  But the fact that someone believes a thing does not render it supported by any empirical study or evidence.  

    Something that would help would be to show the practical means by scientific methods positively impact our lives.  Science is an attempt to understand but that understanding leads to solutions to practical problems.  We can do a better job of highlighting these.  Our sewage plants rely on a combination of biological, chemical, and mechanical expertise honed through a scientific process.  Our ability to buy berries at Kroger in January is the result of both Gregor Mendel-style (an O.G. scientist) crossbreeding and modern DNA marker analysis.  Our cars today can produce greater power with less displacement and therefore less fuel due to scientific advances in metallurgy. 

- candidate_first_name: Eddie
  candidate_last_name: Wagoner
  state: wv
  race: State House of Representatives
  district: 82
  party: Democratic
  question: wv-q4
  date: 2026-10-21
  primary_candidate: false
  response: |
    This is a really tough issue.  The problem comes from two sources.  One, well water is not an option in much of the state due to past mining activity.    Much of the detrimental mining activity is in the past, with companies no longer around to fund the remediation.  

    Two, in many of these regions, the population has declined, and declined most precipitously "in town."   So you have the same length of lines to maintain, with fewer rate payers to share the cost.  Substantially increasing rates to make up the lost revenue is not a viable option.  

    The solution here is will have to be scientific or technical in nature.  I do not know what that solution is, but I think it will involve either a lower cost means of mine remediation or a means to move water purification closer to end users--sort of a micro plant to serve a specific geographic pocket--and thus reduce the maintenance of long lines between a central plant and outlying areas.

- candidate_first_name: Eddie
  candidate_last_name: Wagoner
  state: wv
