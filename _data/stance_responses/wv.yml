    Scientists and experts know some of the best ways to mitigate flood damage and prepare ourselves for future incidents. I’ve already attended a couple of seminars that have discussed a variety of solutions, including nature-based flood mitigation, grey infrastructure, and hybrid solutions, to help our communities meet their specific needs and unique environments. I would meet with these researchers to figure out the right solutions that can be implemented at a state level and figure out how best I can communicate those solutions to not only my fellow legislators but my constituents, as well.

