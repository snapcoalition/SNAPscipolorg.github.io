    Local communities should have a say in these things.  Our Republican Legislature passed a bill in 2025 (HB2014) that excludes these things from county and municipal zoning laws.  So, the GOP believes local communities deserve no say in where or how these are developed.  I disagree.  

    The bill also strips most of the tax revenue these will generate away from the counties and sends it to Charleston.  I disagree.  The counties will be most impacted.  The money should stay there.  

    I also believe that as a practical matter, technological advancements are likely to greatly reduce the necessary footprint for these things.  I am not a computer or electrical engineer, but I am well familiar with Moore's Law and we can all picture those giant IBM machines that took up entire rooms in the 60s.  We have more processing and storage in our pockets today.  So when some of them become obsolete, the county will be left to deal with the empty building.  The counties may be able to plan for that contingency.  The State is just going to use the money to fund other crony capitalism or to fund tax cuts.

- candidate_first_name: Eddie
