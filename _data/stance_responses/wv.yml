  question: wv-q3
  date: 2026-10-23
  primary_candidate: false
  response: |
    Absolutely, and I think the key to developing that trust is in making sure that the scientists and experts we present to the public do not have a monetary stake or corporate connection to any pending developments. I think this has been a point of contention with data centers, for example. When the data center hires a consultant or employs one of its own people to assess the environmental or health impacts of the project, the public is rightly suspicious of those findings. We should have independent consultants and experts to speak to whose paycheck is not determined by whether or not a development goes forward. 

    I think we should also be speaking plainly to people as much as possible and finding ways to make science accessible, digestible, and fun for everyone–especially voters and community members. I am always happy to speak to third-party experts, ask a lot of questions, and find ways to communicate that back to the public to help improve our collective understanding. I think it’s also important to get their guidance before making decisions on legislation that can affect our water, land, air or health. 

